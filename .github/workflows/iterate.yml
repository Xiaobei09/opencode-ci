name: iterate

on:
  workflow_dispatch:
    inputs:
      resume:
        description: Resume the previous run from saved state
        type: boolean
        required: false
        default: true
      relay:
        description: Internal marker for relay-dispatched runs (never clears an operator pause)
        type: boolean
        required: false
        default: false
      budget_seconds:
        description: OpenCode per-run time budget in seconds (0 = no timeout, run until it exits or hits a quota 429; job hard cap is 360m)
        type: string
        required: false
        default: "0"
      reset_baseline:
        description: Rewrite the repository back to its clean initial baseline (runtime state stays in the release)
        type: boolean
        required: false
        default: false
      smoke:
        description: One-off smoke test; bypass pause, never relay a successor, never write the release
        type: boolean
        required: false
        default: false
      split_size:
        description: Max bytes per release asset when paging the packages (GitHub allows up to 2GiB per asset; smaller pages upload in parallel — default 256m, e.g. 1500m for single-stream)
        type: string
        required: false
        default: "256m"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  # R2513: `inputs.smoke` is a BOOLEAN in the `inputs` context (type: boolean).
  # Comparing boolean to string 'true' coerces to numbers (true→1, 'true'→NaN)
  # and is always false. `github.event.inputs.*` is always a string — use it.
  group: ${{ github.event.inputs.smoke == 'true' && format('iterate-smoke-{0}', github.run_id) || 'iterate' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.CROSS_PAT }}
  SESSIONS_REPO: ${{ vars.SESSIONS_REPO }}
  SESSIONS_DIR: /home/runner/work/sessions
  TARGETS_DIR: /home/runner/work/targets

jobs:
  iterate:
    # R2513: manual dispatch ALWAYS runs, even when the loop is paused — that
    # is the only way the Resume step below can clear CI_LOOP_PAUSED. The
    # previous `inputs.smoke || vars.CI_LOOP_PAUSED != 'true'` skipped manual
    # dispatches while paused, so nothing ever cleared the flag: infinite skip.
    # Schedule still respects pause (must not auto-revive a stopped loop).
    # smoke always runs.
    if: github.event.inputs.smoke == 'true' || github.event_name == 'workflow_dispatch' || vars.CI_LOOP_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Mark setup start
        run: echo "PRE_OPENCODE_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out ci-repo
        # R2513: `actions/checkout@v6` does not exist (latest stable is v4/v5).
        # A missing tag fails before any step runs.
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Production ref check
        # R2579: the loop silently ran old code for days because the repository's
        # default branch had been repointed at an old commit branch. Every
        # `gh workflow run` without --ref follows the default branch, so the
        # R2578 relay-first fix never executed (provider traffic went direct).
        # Relay/watchdog now pass --ref main explicitly; this guard makes a
        # future default-branch hijack fail loudly instead of running
        # production traffic on stale code. Smoke runs are exempt (they may be
        # dispatched from a test branch and never relay).
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SMOKE: ${{ github.event.inputs.smoke }}
          RELAY: ${{ github.event.inputs.relay }}
        run: |
          set -euo pipefail
          echo "production ref check: event=${{ github.event_name }} ref=$REF_NAME default_branch=$DEFAULT_BRANCH smoke=${SMOKE:-false} relay=${RELAY:-false}"
          if [ "$SMOKE" = "true" ]; then
            echo "::warning::smoke run is allowed on a non-production ref ($REF_NAME)"
            exit 0
          fi
          if [ "$REF_NAME" != "main" ]; then
            echo "::error::production iterate run requires ref=main; got ref=$REF_NAME (default_branch=$DEFAULT_BRANCH). Refusing to run the loop on stale code."
            exit 1
          fi
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            # R2579: relay/watchdog pin ref=main, so a run that got here was
            # explicitly dispatched from main and is authoritative. Self-heal a
            # hijacked default branch instead of only failing: otherwise the
            # next schedule/relay would keep inheriting the stale branch.
            repo="${{ github.repository }}"
            echo "::warning::repository default branch is '$DEFAULT_BRANCH', not main; repairing to main (this run is pinned to ref=main)"
            if gh api -X PATCH "repos/$repo" -f default_branch=main >/dev/null 2>&1; then
              fixed=$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || echo "")
              if [ "$fixed" = "main" ]; then
                echo "::notice::repository default branch repaired to main"
              else
                echo "::error::default branch repair did not stick (now '$fixed'); refusing to run the loop"
                exit 1
              fi
            else
              echo "::error::default branch repair API call failed; refusing to run while default_branch=$DEFAULT_BRANCH"
              exit 1
            fi
          fi

      - name: Install GitHub CLI and configure git
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            key=$(mktemp)
            wget -nv -O"$key" https://cli.github.com/packages/githubcli-archive-keyring.gpg
            sudo install -m 0644 "$key" /etc/apt/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -y
            sudo apt-get install -y gh
          else
            echo "gh already installed: $(gh --version | head -1)"
          fi
          gh auth setup-git
          git config --global user.name "opencode-ci"
          git config --global user.email "opencode-ci@users.noreply.github.com"

      - name: Clone sessions repository
        run: |
          set -euo pipefail
          if [ ! -d "$SESSIONS_DIR/.git" ]; then
            mkdir -p "$(dirname "$SESSIONS_DIR")"
            gh repo clone "$SESSIONS_REPO" "$SESSIONS_DIR" -- --depth 1 --single-branch --branch main
          fi
          mkdir -p "$SESSIONS_DIR/state" "$SESSIONS_DIR/tasks" "$SESSIONS_DIR/sessions" "$SESSIONS_DIR/workspace-snapshots"
          [ -f "$SESSIONS_DIR/workspace-snapshots/index.json" ] || echo '{"snapshots": []}' > "$SESSIONS_DIR/workspace-snapshots/index.json"

      - name: Acquire lock
        id: lock
        run: |
          echo "acquired=true" >> "$GITHUB_OUTPUT"

      - name: Resume loop on manual dispatch
        # R2513: a manual dispatch is an explicit "restart" signal. Previous
        # cancellation set CI_LOOP_PAUSED=true; without clearing it here Relay
        # stays blocked and every schedule tick is skipped. smoke must NOT
        # touch production variables.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.smoke != 'true' && github.event.inputs.relay != 'true' && steps.lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_PAT }}
        run: |
          set +e
          repo="${{ github.repository }}"
          # R2535：手动 dispatch 是运营者的显式重启信号。即使循环没被暂停，
          # 也要清掉上一轮的失败计数；否则"重启以应用更新"后仍沿用旧 streak，
          # 下一轮再失败一次就触发 3 连败暂停，违背"启动后保持接力运行"。
          gh variable set CI_FAIL_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
          gh variable set CI_EGRESS_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
          gh variable set CI_429_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
          paused=$(gh variable get CI_LOOP_PAUSED --repo "$repo" 2>/dev/null || echo "")
          if [ "$paused" = "true" ]; then
            gh variable set CI_LOOP_PAUSED --body false --repo "$repo" >/dev/null 2>&1 || true
            echo "manual dispatch resumed the loop (CI_LOOP_PAUSED=false, CI_FAIL_STREAK=0, CI_429_STREAK=0)"
          else
            echo "manual dispatch reset CI_FAIL_STREAK and CI_429_STREAK; loop was not paused"
          fi

      - name: Prepare target workspace
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TARGETS_DIR"

      - name: Setup Node 24
        if: steps.lock.outputs.acquired == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore workspace snapshots, environment and toolchain (parallel)
        id: restore_ws
        if: steps.lock.outputs.acquired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT: ${{ secrets.TG_ALLOWED_CHAT }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
          TG_BOT3_TOKEN: ${{ secrets.TG_BOT3_TOKEN }}
          TG_BOT4_TOKEN: ${{ secrets.TG_BOT4_TOKEN }}
          TG_BOTS_EXTRA: ${{ secrets.TG_BOTS_EXTRA }}
          # R2593（D4）：默认保留 env-sync 里 /addbots 写入的最新 token；
          # 设为 1 可强制用上面的 legacy secret 覆盖（运营者明确轮换时用）。
          TG_BOT_SECRET_OVERRIDE: ${{ vars.TG_BOT_SECRET_OVERRIDE }}
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/.github/scripts/restore-targets.sh" > /tmp/restore-targets.log 2>&1 &
          p_t=$!
          bash "$GITHUB_WORKSPACE/.github/scripts/restore-env.sh" > /tmp/restore-env.log 2>&1 &
          p_e=$!
          # R2554: the toolchain install used to be a separate 12s step after the
          # restore finished. It only writes $HOME/.opencode/bin (excluded from
          # the env snapshot) and the node prefix, so it is safe to run beside
          # the two restores; this removes 12s from the pre-opencode budget.
          install_toolchain() {
            set -euo pipefail
            # R2520: the opencode.ai installer can transiently 404 while the latest
            # release asset is propagating (run 41143504097 died here and the
            # skipped prerequisite counted toward the 3-strike pause). Retry the
            # whole installer before burning a loop slot.
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 2 https://opencode.ai/v2/install | bash; then
                installed=1
                break
              fi
              echo "::warning::opencode install attempt ${attempt}/3 failed"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            if [ "$installed" -ne 1 ]; then
              echo "::error::opencode install failed after 3 attempts (upstream 404?)"
              return 1
            fi
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            npm install -g workferry zengate@1.3.1
          }
          install_toolchain > /tmp/install-toolchain.log 2>&1 &
          p_i=$!
          wait "$p_t"; rc_t=$?
          wait "$p_e"; rc_e=$?
          wait "$p_i"; rc_i=$?
          echo "== restore-targets.log =="
          cat /tmp/restore-targets.log 2>/dev/null
          echo "== restore-env.log =="
          cat /tmp/restore-env.log 2>/dev/null
          echo "== install-toolchain.log =="
          cat /tmp/install-toolchain.log 2>/dev/null
          if [ "$rc_t" != 0 ] || [ "$rc_e" != 0 ] || [ "$rc_i" != 0 ]; then
            echo "::error::parallel setup failed (targets rc=$rc_t env rc=$rc_e toolchain rc=$rc_i)"
            exit 1
          fi
          for p in "$HOME/.config/opencode"/*.json \
                   "$HOME/.config/opencode"/*.env \
                   "$HOME/.local/state/opencode/service.json" \
                   "$HOME/.opencode"/*.env; do
            [ -f "$p" ] && chmod 600 "$p" 2>/dev/null || true
          done
          echo "targets, environment and toolchain restored in parallel"

      - name: Select egress proxy
        id: select_egress
        # R2562：整个 run 只在这里选一次出口。
        # R2582（运营者回滚 + 根因）：**direct 必须是候选 #1，绝不能再强制 relay**。
        # 免费模型的 429 是 FreeUsageLimitError（retryAfter≈16h）。R2620 实测
        # 连续 8 轮直连 IP 各不相同却仍在预检后 429，说明额度并不只按出口 IP
        # 计桶（restore 的 $HOME/session 身份也可能参与）。因此 direct 仍优先，
        # 但失败候选按黑名单 6h 跳过；所有候选（含 direct）都不可用时 fail closed。
        # R2580（D2）：restore 失败时不选出口/不跑 OpenCode，避免残缺环境
        # 被桥的 interval env-sync 写回，覆盖上一份好快照。
        if: steps.lock.outputs.acquired == 'true' && steps.restore_ws.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
          EGRESS_ALLOW_PUBLIC_HTTP: "0"
          EGRESS_BLACKLIST_ENABLED: "1"
          EGRESS_SELECT_MAX: "0"
          EGRESS_SELECT_BUDGET: "0"
          EGRESS_PREFLIGHT_TIMEOUT: "20"
          # R2619 (operator: "预检 200 后真实回合 429"; "4k token 边界不可能"):
          # default is a zero-message path preflight. The free tier meters
          # MESSAGES, not tokens; a zengate probe is itself a real request and
          # spends the last message on an IP that has exactly one left, which
          # is the mechanical cause of "probe 200, real turn 429". Set the repo
          # variable EGRESS_PREFLIGHT_MODE=zengate to restore the real-OpenCode
          # probe (one free message per candidate); curl is diagnostic only.
          EGRESS_PREFLIGHT_MODE: ${{ vars.EGRESS_PREFLIGHT_MODE || 'path' }}
          # R2617: do not cap fallback exits. 0 = unlimited; -1 disables relay
          # fallback. R2619: EGRESS_BIG_PROBE is ignored outside zengate mode.
          EGRESS_RELAY_FALLBACK_MAX: "0"
          EGRESS_BIG_PROBE: "0"
          EGRESS_BIG_PROBE_BYTES: "400000"
          EGRESS_BIG_PROBE_TIMEOUT: "60"
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/.github/scripts/select-proxy.sh" 2>&1 | tee "$RUNNER_TEMP/select-proxy.log"
          rc=${PIPESTATUS[0]}
          echo "select-proxy rc=$rc"
          if [ "$rc" -ne 0 ]; then
            # Do not leave a stale selection behind: the next run must select
            # afresh, and the failure notification must not claim an egress.
            rm -f "$HOME/.config/opencode/exit-proxy.json" "$RUNNER_TEMP/exit-proxy.env" \
                  "$RUNNER_TEMP/egress/upstream" "$RUNNER_TEMP/egress/candidates.tsv"
            # R2588/R2617：失败原因必须区分。direct quota 耗尽时探测拿到的是
            # 429；是否试过 relay 由 select-proxy 的 ERROR 行说明（当前默认
            # 不限量，所以通常是“no relay passed the path probe”）。
            sel_err=$(grep -aE '^\[egress-select\] ERROR: ' "$RUNNER_TEMP/select-proxy.log" 2>/dev/null | tail -1 | sed -E 's/^\[egress-select\] ERROR: //' | cut -c1-240)
            if printf '%s' "$sel_err" | grep -q 'direct free-quota exhausted'; then
              reason="${sel_err:-direct free-quota exhausted}"
              echo "::error::egress selection failed: $reason; ending this run so the next run can select a fresh egress"
            elif printf '%s' "$sel_err" | grep -q 'path probe'; then
              reason="${sel_err:-no candidate passed the path probe}"
              echo "::error::egress selection failed: $reason; ending this run so the next run can select a fresh egress"
            else
              reason="no egress candidate answered 200 (select-proxy rc=$rc)"
              echo "::error::egress selection failed: neither direct nor any relay answered 200; ending this run (no unverified egress)"
            fi
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ ! -s "$HOME/.config/opencode/exit-proxy.json" ]; then
            echo "reason=egress selection reported success but exit-proxy state is missing" >> "$GITHUB_OUTPUT"
            echo "::error::egress selection reported success but exit-proxy state is missing; ending this run"
            exit 1
          fi
          # R2575 (D8): the state file alone is not enough. Run OpenCode consumes
          # this env handoff to start the local proxy; without it the round used
          # to fall back to a direct connection while selection looked green.
          if [ ! -s "$RUNNER_TEMP/exit-proxy.env" ] \
             || ! grep -q '^HTTPS_PROXY=http://127\.0\.0\.1:' "$RUNNER_TEMP/exit-proxy.env"; then
            rm -f "$HOME/.config/opencode/exit-proxy.json" "$RUNNER_TEMP/exit-proxy.env" \
                  "$RUNNER_TEMP/egress/upstream" "$RUNNER_TEMP/egress/candidates.tsv"
            echo "reason=egress selection reported success but the proxy handoff env is missing/incomplete" >> "$GITHUB_OUTPUT"
            echo "::error::egress selection reported success but $RUNNER_TEMP/exit-proxy.env is missing/incomplete; ending this run (no direct fallback)"
            exit 1
          fi
          if [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_PUSH_CHAT:-}" ]; then
            # R2520：与 TG 错误卡 exitProxySummary() 使用完全相同的键名/顺序：
            # kind → upstream → local → egress → direct。旧格式 `CI egress: direct direct`
            # 与错误卡的 `exit proxy: http://127.0.0.1:8089 ...` 对不上。
            KIND=$(jq -r '.kind // "direct"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)
            UP=$(jq -r '.upstream // "direct"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)
            SCHEME=$(jq -r '.scheme // "http"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)
            PROXY=$(jq -r '.proxy // "127.0.0.1:8089"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)
            EIP=$(jq -r '.egress_ip // "?"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)
            MSG="exit proxy: kind=${KIND} upstream=${UP} local=${SCHEME}://${PROXY} egress=${EIP} direct=$(jq -r '.direct_ip // "?"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)"
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_PUSH_CHAT}" --data-urlencode "text=${MSG}" \
              >/dev/null 2>&1 || echo "::warning::could not send the exit-proxy notice to telegram"
          fi
          if [ -n "${PRE_OPENCODE_T0:-}" ]; then
            echo "setup timing: pre-opencode $(( $(date +%s) - PRE_OPENCODE_T0 ))s (target <60s: checkout+restore+install+select)"
          fi
          exit 0

      - name: Run OpenCode
        id: run_opencode
        # R2580（D2）：环境/工作区还原失败时绝不启动 OpenCode。否则桥的
        # interval env-sync 可能把残缺环境写入 env-sync 分支；Save 步骤虽受
        # restore 门控，但 interval 写回不受它控制。失败轮由 failure_guard 计数并接力。
        if: steps.lock.outputs.acquired == 'true' && steps.restore_ws.outcome == 'success'
        env:
          SESSIONS_DIR: /home/runner/work/sessions
          TARGETS_DIR: /home/runner/work/targets
          TG_BRIDGE_FORCE_SERVE: "1"
          BUDGET_SECONDS: ${{ inputs.budget_seconds }}
          EGRESS_BLACKLIST_ENABLED: "1"
          EGRESS_PREFLIGHT_TIMEOUT: "20"
          # Option C: one-shot resume after a CI restart, independent of the
          # auto-continue loop. Default on; set repository variable
          # CI_RESUME_ONCE=0 to disable. RESUME_ONCE_FORCE=1 lets it run even
          # while the auto loop gate is open (it never overrides halted/loop-off).
          CI_RESUME_ONCE: ${{ vars.CI_RESUME_ONCE || '1' }}
          RESUME_ONCE_FORCE: ${{ vars.RESUME_ONCE_FORCE || '' }}
          # R2625: after a verified quota 429 ends the round, spend one real
          # zengate request on an alternate egress to test whether the quota is
          # path-specific. Diagnostic only; set the repo variable to 0 to skip.
          EGRESS_QUOTA_PROBE: ${{ vars.EGRESS_QUOTA_PROBE || '1' }}
        run: |
          set +e
          # R2576 (D9): stamp the OpenCode phase so the snapshot step can report
          # the real non-opencode wall time (setup + post-run) instead of only
          # the setup half. OPENCODE_START_T0 is the boundary between the two.
          echo "OPENCODE_START_T0=$(date +%s)" >> "$GITHUB_ENV"
          RUN_LOG="$RUNNER_TEMP/opencode-run.log"
          EGRESS_DIR="${EGRESS_STATE_DIR:-$RUNNER_TEMP/egress}"
          export EGRESS_STATE_DIR="$EGRESS_DIR"
          export EGRESS_LOCAL_PORT="${EGRESS_LOCAL_PORT:-8089}"
          mkdir -p "$EGRESS_DIR"
          PROXY_PID=""
          WATCH_PID=""
          PROXY_READY=0
          cleanup_egress() {
            if [ -n "$WATCH_PID" ]; then
              kill "$WATCH_PID" 2>/dev/null
              wait "$WATCH_PID" 2>/dev/null
            fi
            if [ -n "$PROXY_PID" ]; then
              kill "$PROXY_PID" 2>/dev/null
              wait "$PROXY_PID" 2>/dev/null
            fi
          }
          trap cleanup_egress EXIT
          # R2575 (D8): the old `else` branch treated a missing handoff as
          # "direct connection" and started OpenCode with no proxy at all. Since
          # selection always writes the handoff before this step, absence means
          # selection/handoff failed: end the round instead of silently burning
          # the runner IP's quota.
          if [ ! -s "$RUNNER_TEMP/exit-proxy.env" ]; then
            echo "::error::egress handoff $RUNNER_TEMP/exit-proxy.env is missing; refusing to start OpenCode without a verified egress (no direct fallback)"
            exit 1
          fi
          # R2575 (D8): the watcher proves provider=selected using this state
          # file; if it is missing the startup path check is skipped entirely.
          if [ ! -s "$HOME/.config/opencode/exit-proxy.json" ]; then
            echo "::error::egress state $HOME/.config/opencode/exit-proxy.json is missing; refusing to start OpenCode without a verifiable egress (no direct fallback)"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/exit-proxy.env"
          set +a
          if [ -z "${HTTPS_PROXY:-}" ] || [ -z "${HTTP_PROXY:-}" ]; then
            echo "::error::egress handoff $RUNNER_TEMP/exit-proxy.env is incomplete (HTTP(S)_PROXY unset); refusing to start OpenCode without a verified egress (no direct fallback)"
            exit 1
          fi
          if [ ! -s "$EGRESS_DIR/upstream" ]; then
            echo "::error::egress upstream $EGRESS_DIR/upstream is missing; refusing to start OpenCode without a verified egress (no direct fallback)"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/egress-proxy.py" \
            > "$EGRESS_DIR/proxy.log" 2>&1 &
          PROXY_PID=$!
          for _ in $(seq 1 12); do
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then break; fi
            if curl -sS -m 4 -x "http://127.0.0.1:${EGRESS_LOCAL_PORT}" \
                 -o /dev/null https://opencode.ai/cdn-cgi/trace 2>/dev/null; then
              PROXY_READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$PROXY_READY" = 1 ]; then
            echo "egress proxy: ${HTTPS_PROXY:-none} kind=$(jq -r '.kind // "?"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null) upstream=$(cat "$EGRESS_DIR/upstream" 2>/dev/null || echo '?') egress=$(jq -r '.egress_ip // "?"' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null)"
            bash "$GITHUB_WORKSPACE/.github/scripts/egress-watch.sh" "$RUN_LOG" \
              >> "$EGRESS_DIR/watch.log" 2>&1 &
            WATCH_PID=$!
            # R2575 (D8): a watcher that dies at startup leaves the round with
            # no quota/failure monitoring. Its own pre-start rejection is
            # handled by the stop marker below; any other early exit is fatal.
            sleep 1
            if ! kill -0 "$WATCH_PID" 2>/dev/null && [ ! -f "$EGRESS_DIR/stop" ]; then
              echo "::error::egress watcher exited during startup without a stop marker; refusing to run OpenCode unmonitored"
              tail -20 "$EGRESS_DIR/watch.log" 2>/dev/null || true
              exit 1
            fi
          else
            # R2567 (operator): a failed local proxy must not silently fall
            # back to direct; otherwise the run burns the runner IP's quota
            # while the logs still claim a relay was selected.
            echo "::error::local egress proxy is not ready (no provider trace through it); refusing direct fallback and ending this run"
            tail -20 "$EGRESS_DIR/proxy.log" 2>/dev/null || true
            exit 1
          fi
          # R2618: no default per-round timeout. The old 600s budget killed a
          # healthy, still-working turn every 10 minutes and relayed a new run.
          # 0 = run until OpenCode exits or the egress watcher sees a verified
          # quota 429 (R2620: the first one ends the round); the job-level
          # timeout-minutes: 360 remains the hard safety cap.
          BUDGET="${BUDGET_SECONDS:-0}"
          SID=""
          # Option C receives the exact session this run opens, so it never
          # guesses a different front/pinned target from restored state.
          RESUME_SID=""
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            SID=$(jq -r '.front // empty' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true)
          fi
          # R2513: session presence probe. Uses the sqlite3 CLI (present on
          # ubuntu-latest) instead of an inline Python heredoc — a heredoc whose
          # contents are column-0 inside `run: |` breaks YAML parsing.
          SID_PRESENT="n/a"
          DB="$HOME/.local/share/opencode/opencode.db"
          if [ -n "$SID" ] && [ -f "$DB" ] && command -v sqlite3 >/dev/null 2>&1; then
            TABLES=$(sqlite3 "$DB" ".tables" 2>/dev/null || echo "")
            if echo " $TABLES " | grep -qw session_v2; then
              HIT=$(sqlite3 "$DB" "SELECT 1 FROM session_v2 WHERE id = '$SID' LIMIT 1" 2>/dev/null || true)
              [ "$HIT" = "1" ] && SID_PRESENT="yes" || SID_PRESENT="no"
            elif echo " $TABLES " | grep -qw session; then
              HIT=$(sqlite3 "$DB" "SELECT 1 FROM session WHERE id = '$SID' LIMIT 1" 2>/dev/null || true)
              [ "$HIT" = "1" ] && SID_PRESENT="yes" || SID_PRESENT="no"
            else
              SID_PRESENT="no-table"
            fi
          fi
          echo "bound session probe: present=$SID_PRESENT"
          RECOVER_LINE=""
          if { [ "$SID_PRESENT" = "no" ] || [ "$SID_PRESENT" = "no-table" ] || [ -z "$SID" ]; } \
             && [ -f "$DB" ] && command -v sqlite3 >/dev/null 2>&1; then
            TABLES=$(sqlite3 "$DB" ".tables" 2>/dev/null || echo "")
            for tbl in session_message message_v2 message; do
              if echo " $TABLES " | grep -qw "$tbl"; then
                RECOVER_LINE=$(sqlite3 "$DB" "SELECT session_id || ' ' || COUNT(*) FROM $tbl GROUP BY session_id ORDER BY COUNT(*) DESC LIMIT 1" 2>/dev/null || true)
                [ -n "$RECOVER_LINE" ] && break
              fi
            done
          fi
          RECOVER="${RECOVER_LINE%% *}"
          RECOVER_MSGS="${RECOVER_LINE##* }"
          [ -z "$RECOVER_MSGS" ] && RECOVER_MSGS="0"
          echo "recovery probe: recover=$([ -n "$RECOVER" ] && echo yes || echo no) msgs=$RECOVER_MSGS"
          if [ -n "$SID" ] && [ "$SID_PRESENT" = "yes" ]; then
            ARGS=(--standalone --session "$SID")
            RESUME_SID="$SID"
            echo "resuming bound session present_in_db=$SID_PRESENT"
          elif [ -n "$SID" ] && [ "$SID_PRESENT" != "no" ] && [ "$SID_PRESENT" != "no-table" ]; then
            ARGS=(--standalone --session "$SID")
            RESUME_SID="$SID"
            echo "resuming pinned session (db unreadable, present_in_db=$SID_PRESENT)"
          elif [ -n "$RECOVER" ]; then
            ARGS=(--standalone --session "$RECOVER")
            RESUME_SID="$RECOVER"
            echo "recovery: bound absent (present_in_db=$SID_PRESENT); pinned the richest restored session (msgs=$RECOVER_MSGS)"
          else
            ARGS=(--standalone --continue)
            RESUME_SID=""
            if [ -n "$SID" ]; then
              echo "bound session absent (present_in_db=$SID_PRESENT); no richer session to recover; falling back to --continue"
            else
              echo "no bound session found; continuing the last session"
            fi
          fi
          # Option C (resume-once-v2 plugin): arm one post-restart continuation
          # per interrupted session. R2624 (operator: "ses_e2d48872怎么没有跨ci接力"):
          # the old block armed only RESUME_SID (the single session this run
          # opens), so another bot's interrupted turn was never even evaluated.
          # Arm every registered bot's persisted front/pinned target; the plugin
          # still applies its per-session gates (halted / loop-off / active loop /
          # quota tail) independently, so this widens coverage without forcing a
          # resume. Default on.
          RESUME_ONCE_ENABLED=1
          if printf '%s' "${CI_RESUME_ONCE:-1}" | grep -qiE '^(0|false|no|off)$'; then
            RESUME_ONCE_ENABLED=0
          fi
          resume_front_of() {
            local st="$1" sid=""
            sid=$(jq -r '.front // empty' "$st" 2>/dev/null || true)
            case "$sid" in ses_*) printf '%s' "$sid"; return 0 ;; esac
            sid=$(jq -r '.pinned // empty' "$st" 2>/dev/null || true)
            case "$sid" in ses_*) printf '%s' "$sid" ;; esac
          }
          RESUME_ONCE_LIST="$RESUME_SID"
          RESUME_ONCE_SIDS=""
          if [ "$RESUME_ONCE_ENABLED" = "1" ]; then
            # Keep the bot registry's order (first entry = tg-chats.json, the
            # rest = tg-chats-<id>.json), matching auto-continue's discovery.
            _bots_json="$HOME/.config/opencode/tg-bots.json"
            if [ -f "$_bots_json" ] && command -v jq >/dev/null 2>&1; then
              _first_bot=1
              while IFS= read -r _botid; do
                [ -n "$_botid" ] || continue
                # Same convention as auto-continue.resolveExtraTargetPaths:
                # the first registry entry owns tg-chats.json, the rest own
                # tg-chats-<id>.json.
                if [ "$_first_bot" = "1" ]; then
                  _state="$HOME/.config/opencode/tg-chats.json"
                  _first_bot=0
                else
                  _state="$HOME/.config/opencode/tg-chats-${_botid}.json"
                fi
                [ -f "$_state" ] || continue
                _sid=$(resume_front_of "$_state")
                if [ -n "$_sid" ]; then
                  RESUME_ONCE_LIST="${RESUME_ONCE_LIST:+$RESUME_ONCE_LIST,}$_sid"
                fi
              done < <(jq -r '.bots[]?.id // empty' "$_bots_json" 2>/dev/null || true)
            else
              # Registry missing/unreadable: fall back to every persisted bot
              # state file. Globbing tg-chats*.json also covers the primary.
              for _state in "$HOME"/.config/opencode/tg-chats.json "$HOME"/.config/opencode/tg-chats-*.json; do
                [ -f "$_state" ] || continue
                _sid=$(resume_front_of "$_state")
                if [ -n "$_sid" ]; then
                  RESUME_ONCE_LIST="${RESUME_ONCE_LIST:+$RESUME_ONCE_LIST,}$_sid"
                fi
              done
            fi
            # Deduplicate (bots may share a front), preserving first-seen order.
            RESUME_ONCE_SIDS=$(printf '%s\n' "$RESUME_ONCE_LIST" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd, -)
          fi
          if [ "$RESUME_ONCE_ENABLED" = "1" ] && [ -n "$RESUME_ONCE_SIDS" ]; then
            export RESUME_ONCE_SIDS
            echo "option C resume-once armed: $RESUME_ONCE_SIDS"
          else
            export RESUME_ONCE_SIDS=""
            if [ "$RESUME_ONCE_ENABLED" = "1" ]; then
              echo "option C resume-once skipped: no explicit session (--continue path)"
            else
              echo "option C resume-once disabled by CI_RESUME_ONCE=${CI_RESUME_ONCE:-}"
            fi
          fi
          # R2622 (operator: "200-429测试有没有进一步优化"): zero-message gateway
          # preflight. The local proxy is already pointed at the selected
          # upstream. Send a deliberately malformed JSON body to the exact
          # completion endpoint: the gateway rejects it with 400 before any
          # model call, so this spends NO free message. It proves the selected
          # path reaches the real inference gateway. R2625 live finding: the
          # gateway validates the body BEFORE quota, so this probe returned 400
          # at 05:54:44 while the real turn 429'd at 05:55:08 (24s later). The
          # 429 branch below is a safety net, not a quota oracle. The first real
          # turn remains the authoritative quota test; a round-end R2625
          # zengate probe answers whether the quota is path-specific.
          if [ ! -f "$EGRESS_DIR/stop" ] && [ "${EGRESS_GATEWAY_PREFLIGHT:-1}" != "0" ]; then
            GWMETA="$EGRESS_DIR/gateway-preflight.meta"
            GWERR="$EGRESS_DIR/gateway-preflight.err"
            rm -f "$GWMETA" "$GWERR"
            GWOUT=$(EGRESS_GATEWAY_META="$GWMETA" \
              bash "$GITHUB_WORKSPACE/.github/scripts/egress-preflight-gateway.sh" 8 2>"$GWERR" || true)
            GWCODE=${GWOUT%%$'\t'*}
            GWWHY=${GWOUT##*$'\t'}
            [ -n "$GWCODE" ] || GWCODE=000
            [ -n "$GWWHY" ] || GWWHY=transport
            GWRA=$(sed -n 's/^retry_after=//p' "$GWMETA" 2>/dev/null | head -1)
            echo "gateway preflight (0 messages): code=$GWCODE reason=$GWWHY${GWRA:+ retry_after=${GWRA}s}"
            if [ "$GWWHY" = "quota" ]; then
              GWUP=$(cat "$EGRESS_DIR/upstream" 2>/dev/null || echo '?')
              printf '%s\n' "quota 429 on the selected egress during zero-message gateway preflight (upstream=$GWUP, retry_after=${GWRA:-?}s); ending this round before OpenCode spends a real message" > "$EGRESS_DIR/stop"
              # Keep the candidate out of the next selection for the provider's
              # reset window. This mirrors egress-watch.sh blacklist_selected;
              # direct keys are runner-IP scoped, relay/http keys are the
              # upstream entry.
              if [ -s "$HOME/.config/opencode/exit-proxy.json" ]; then
                # egress-lib.sh sets -u; keep that from leaking into the rest
                # of this step (which relies on set +e and optional vars).
                (
                  set -uo pipefail
                  # shellcheck source=egress-lib.sh
                  . "$GITHUB_WORKSPACE/.github/scripts/egress-lib.sh"
                  egress_bl_init
                  _kind=$(jq -r '.kind // ""' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null || true)
                  _dip=$(jq -r '.direct_ip // ""' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null || true)
                  _eg=$(jq -r '.egress_ip // ""' "$HOME/.config/opencode/exit-proxy.json" 2>/dev/null || true)
                  case "$_kind" in
                    direct) _key="direct:${_dip:-unknown}" ;;
                    relay|http) _key="$GWUP" ;;
                    *) _key="" ;;
                  esac
                  if [ -n "$_key" ]; then
                    _ttl=21600
                    if [ -n "$GWRA" ] && [ "$GWRA" -gt "$_ttl" ] 2>/dev/null; then _ttl="$GWRA"; fi
                    egress_bl_add "$_key" "$_eg" "quota-after-gateway-preflight" "$_ttl" || true
                    echo "gateway preflight blacklisted $_key for ${_ttl}s (retry_after=${GWRA:-?}s)"
                  fi
                )
              fi
            elif [ "$GWWHY" != "ok" ]; then
              echo "::warning::zero-message gateway preflight code=$GWCODE reason=$GWWHY; continuing to the real turn (the watcher handles transport/quota)"
            fi
          fi
          if [ -f "$EGRESS_DIR/stop" ]; then
            # R2567: the watcher can reject the selected path before OpenCode is
            # even started (provider traffic bypassed the relay / relay rotated).
            # pkill cannot catch a not-yet-started process, so honor the marker
            # here and never start an unmonitored round.
            echo "::error::egress watcher rejected the selected path before the round started: $(tr '\n' ' ' < "$EGRESS_DIR/stop" 2>/dev/null | cut -c1-300)"
            RC=0
          else
            if [ "${BUDGET:-0}" -gt 0 ] 2>/dev/null; then
              # Explicit operator budget only; the default is 0 (no timeout).
              TERM=xterm-256color timeout --signal=TERM --kill-after=30s "$BUDGET" \
                opencode "${ARGS[@]}" --print-logs </dev/null >"$RUN_LOG" 2>&1
            else
              TERM=xterm-256color opencode "${ARGS[@]}" --print-logs </dev/null >"$RUN_LOG" 2>&1
            fi
            RC=$?
          fi
          if [ -f "$EGRESS_DIR/stop" ]; then
            STOP_REASON=$(tr '\n' ' ' < "$EGRESS_DIR/stop" 2>/dev/null | cut -c1-300)
            echo "watcher_stop=true" >> "$GITHUB_OUTPUT"
            echo "watcher_reason=${STOP_REASON:-unknown}" >> "$GITHUB_OUTPUT"
            # R2596/R2620: an egress quota stop is external (free-tier usage
            # limit), not a content/code failure. It must not count toward the
            # content-failure pause: failure_guard treats it as an egress-only
            # round and relays immediately. The general no-healthy-turn guard
            # still pauses after 3 such rounds.
            if printf '%s' "$STOP_REASON" | grep -qiE 'quota|free[- ]limit|FreeUsageLimitError|provider\.free-limit'; then
              echo "egress_quota_stop=true" >> "$GITHUB_OUTPUT"
            fi
            # R2620 (operator: "改为出现一个429就重启吧"): a single verified
            # quota 429 is an egress-only round and must relay immediately. Do
            # not pause the loop here; the general 3-rounds-without-a-healthy-turn
            # guard still applies. Do not match the watcher's old 3-429 wording.
            # R2535：watcher 是进程外停止，不能一律按失败计。auto-continue 在首个
            # 正常 assistant 回合写该标记；有 200 的轮次必须清零 streak（运营者规则：
            # 只有连续 3 轮没有任何 200 才停循环）。
            if [ -f "$RUNNER_TEMP/round-had-success" ]; then
              echo "round_success=true" >> "$GITHUB_OUTPUT"
              echo "::notice::egress watcher ended this round after a healthy turn; CI_FAIL_STREAK will reset"
            else
              echo "round_success=false" >> "$GITHUB_OUTPUT"
            fi
            echo "::warning::egress watcher ended this round: ${STOP_REASON:-unknown}; relay policy decides whether to pause"
            RC=0
          elif [ -f "$RUNNER_TEMP/round-end.json" ]; then
            # R2521: auto-continue END-ROUND-CI writes this marker. It used to exit 0
            # silently, so failure_guard treated the round as a success and reset
            # CI_FAIL_STREAK forever. The marker carries whether any healthy turn ran.
            STOP_REASON=$(jq -r '.reason // "auto-continue ended the round"' "$RUNNER_TEMP/round-end.json" 2>/dev/null || echo "auto-continue ended the round")
            ROUND_SUCCESS=$(jq -r '.success // false' "$RUNNER_TEMP/round-end.json" 2>/dev/null || echo false)
            echo "watcher_stop=true" >> "$GITHUB_OUTPUT"
            echo "watcher_reason=auto-continue: ${STOP_REASON}" >> "$GITHUB_OUTPUT"
            echo "round_success=${ROUND_SUCCESS}" >> "$GITHUB_OUTPUT"
            if printf '%s' "$STOP_REASON" | grep -qiE 'quota|free[- ]limit|FreeUsageLimitError|provider\.free-limit'; then
              echo "egress_quota_stop=true" >> "$GITHUB_OUTPUT"
            fi
            # R2620 (operator: "改为出现一个429就重启吧"): a single verified
            # quota 429 is an egress-only round and must relay immediately. Do
            # not pause the loop here; the general 3-rounds-without-a-healthy-turn
            # guard still applies. Do not match the watcher's old 3-429 wording.
            echo "::warning::auto-continue ended this round: ${STOP_REASON} (round_success=${ROUND_SUCCESS}); relay policy decides whether to pause"
            RC=0
          fi
          # R2625 (operator: "429 结束时再次使用 zengate 测试"): the 0-message
          # gateway probe always gets 400 even while quota is exhausted, so it
          # cannot tell us whether the quota is path-specific. After a verified
          # quota stop, spend one REAL zengate request on an alternate egress
          # (direct -> relay, relay -> direct). Diagnostic only: it never
          # changes selection, the stop reason, or the relay policy.
          if [ "${EGRESS_QUOTA_PROBE:-1}" != "0" ] \
             && printf '%s' "${STOP_REASON:-}" | grep -qiE 'quota 429|FreeUsageLimit|provider\.free-limit'; then
            echo "quota-end zengate diagnostic: probing an alternate egress (real request)"
            EGRESS_QUOTA_PROBE=1 bash "$GITHUB_WORKSPACE/.github/scripts/egress-quota-probe.sh" \
              2>&1 | tee "$EGRESS_DIR/quota-probe.log" || true
          fi
          echo "opencode exit=$RC lines=$(wc -l < "$RUN_LOG" 2>/dev/null)"
          # R2587（D7）：插件错误只写 /tmp/opencode/v2plugin.log，run 结束随
          # runner 一起消失；旧诊断只 grep OpenCode 主日志，插件注入/桥失败在
          # Actions 日志里看不到。这里把插件 error/warn 尾部打印出来。
          if [ -s /tmp/opencode/v2plugin.log ]; then
            PLUGIN_ERR=$(grep -aE '\] (error|warn): ' /tmp/opencode/v2plugin.log 2>/dev/null | tail -40)
            PLUGIN_N=$(printf '%s\n' "$PLUGIN_ERR" | grep -c . 2>/dev/null || echo 0)
            echo "plugin error/warn lines: ${PLUGIN_N:-0} (last ${PLUGIN_N:-0} shown)"
            if [ -n "$PLUGIN_ERR" ]; then
              printf '%s\n' "$PLUGIN_ERR" | cut -c1-300 || true
            fi
          fi
          ERR_TXT="$RUNNER_TEMP/opencode-errors.txt"
          if [ -s "$RUN_LOG" ]; then
            tr '\r' '\n' < "$RUN_LOG" 2>/dev/null \
              | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g' \
              | grep -aE 'FreeUsageLimit|free usage limit|provider\.free-limit|provider\.transport|level=ERROR|error target=|idle_timeout|"type":"error"|HTTP 429|rate.?limit' \
              | grep -avE 'grep -aE|grep -aoE|ERR_TXT=|opencode-errors\.txt|=== ' \
              > "$ERR_TXT" 2>/dev/null || true
            echo "opencode error summary: total=$(wc -l < "$ERR_TXT" 2>/dev/null || echo 0)"
            if [ -s "$ERR_TXT" ]; then
              sort "$ERR_TXT" 2>/dev/null | uniq -c | sort -rn | head -30 | cut -c1-360 || true
              echo "opencode error lines (all):"
              cut -c1-500 "$ERR_TXT" 2>/dev/null || true
            fi
          fi
          if [ -f "$EGRESS_DIR/proxy.log" ]; then
            echo "egress connections:"
            grep -aE 'target=opencode\.ai|epoch [0-9]+:' "$EGRESS_DIR/proxy.log" | tail -8 || true
          fi
          if [ -f "$EGRESS_DIR/watch.log" ]; then
            # R2562：watcher 不再轮换；诊断单轮内的连续失败与停止原因。
            # R2588（D8）：last-40 里常混着“quota-like line ignoring”噪声，先给
            # 一行计数汇总，让 200→429 / 轮换 / 停轮一眼可判。
            cnt() { local n; n=$(grep -acE "$1" "$EGRESS_DIR/watch.log" 2>/dev/null); echo "${n:-0}"; }
            echo "egress summary: upstream=$(cat "$EGRESS_DIR/upstream" 2>/dev/null || echo '?') path_checks=$(cnt 'egress path check') rechecks=$(cnt 'egress path recheck ok') quota=$(cnt 'quota error detected') failures=$(cnt 'egress failure') blacklisted=$(cnt 'blacklisted') stops=$(cnt 'STOP:') ignored_quota=$(cnt 'ignoring')"
            echo "egress watch (last 40):"
            tail -40 "$EGRESS_DIR/watch.log" 2>/dev/null || true
            echo "egress watch failures/stops:"
            grep -aE 'egress failure|STOP:|blacklisted|selected egress answered 200' "$EGRESS_DIR/watch.log" 2>/dev/null | tail -20 || true
          fi
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            jq -c '{iocount, paused, selfmute, halted:(.halted|length), qlen:((.queue//[])|length), pqlen:((.pinqueue//[])|length)}' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true
          fi
          for pat in "pinject delivered" "pinject failed" "inject failed" "getUpdates failed" "loop stopped" "sendMessage chunked ok" "free tier" "FreeUsageLimitError" "provider.free-limit" "instance registered" "turnActuallyIdle" "loop skip" "loopskip"; do
            echo "diag '$pat' = $(grep -c -- "$pat" "$RUN_LOG" 2>/dev/null || echo 0)"
          done
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ] || [ "$RC" -eq 143 ]; then
            # R2618: only an explicitly requested budget can time out. That is a
            # deliberate round boundary, not a failed 429 round: end normally and
            # let the relay policy start the next round.
            echo "opencode hit the explicit budget; ending this round normally."
            echo "budget_timeout=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "opencode exited with $RC; this run will not relay."
          fi
          exit "$RC"

      - name: Update failure streak and stop policy
        id: failure_guard
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_PAT }}
        run: |
          set +e
          # R2576 (D9): start of the post-opencode phase; paired with
          # OPENCODE_START_T0 to report the non-opencode wall time at run end.
          echo "POST_OPENCODE_T0=$(date +%s)" >> "$GITHUB_ENV"
          repo="${{ github.repository }}"
          outcome="${{ steps.run_opencode.outcome }}"
          watcher_stop="${{ steps.run_opencode.outputs.watcher_stop }}"
          round_success="${{ steps.run_opencode.outputs.round_success }}"
          soft_success="${{ steps.run_opencode.outputs.soft_success }}"
          select_outcome="${{ steps.select_egress.outcome }}"
          select_reason="${{ steps.select_egress.outputs.reason }}"
          restore_outcome="${{ steps.restore_ws.outcome }}"
          quota_stop="${{ steps.run_opencode.outputs.egress_quota_stop }}"
          budget_timeout="${{ steps.run_opencode.outputs.budget_timeout }}"
          allow=false
          # R2620 (operator: "改为出现一个429就重启吧"): a quota 429 is an
          # egress-only round; relay immediately instead of pausing on the old
          # within-round 3-429 rule. The general safety valve below still pauses
          # after 3 consecutive rounds without ANY real healthy turn.
          # R2596/R2617: an exhausted free-tier egress is external, so a single
          # egress-only failure relays immediately with a growing backoff.
          egress_only=false
          if [ "$quota_stop" = "true" ] && [ "$round_success" != "true" ]; then
            egress_only=true
          fi
          if [ "$select_outcome" = "failure" ] \
             && printf '%s' "$select_reason" | grep -qiE 'free-quota|quota exhausted|FreeUsageLimit'; then
            egress_only=true
          fi
          # Safety net: OpenCode can exit 0 after a quota 429 without the watcher
          # writing a stop marker. Treat the run as an egress-only retry too;
          # the no-200 streak still counts it and pauses after 3.
          if [ "$egress_only" != "true" ] && [ "$round_success" != "true" ] \
             && [ -s "$RUNNER_TEMP/opencode-errors.txt" ] \
             && grep -qiE 'FreeUsageLimit|free usage limit|provider\.free-limit' "$RUNNER_TEMP/opencode-errors.txt" 2>/dev/null; then
            egress_only=true
          fi
          # A healthy turn proves the egress works; clear the egress retry and
          # consecutive-429 streaks.
          if [ -f "$RUNNER_TEMP/round-had-success" ] || [ "$round_success" = "true" ]; then
            gh variable set CI_EGRESS_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
            gh variable set CI_429_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
          fi
          egress_retry_policy() {
            local cur next delay q429
            cur=$(gh variable get CI_EGRESS_STREAK --repo "$repo" 2>/dev/null || echo 0)
            case "$cur" in ''|*[!0-9]*) cur=0 ;; esac
            next=$((cur + 1))
            gh variable set CI_EGRESS_STREAK --body "$next" --repo "$repo" >/dev/null 2>&1 || true
            # R2620 (operator: "改为出现一个429就重启吧"): every quota 429 now
            # ends its round, so this counts consecutive 429-only rounds. Keep
            # the general safety valve: after 3 rounds without ANY real healthy
            # turn, pause for an operator instead of restarting forever. A
            # healthy turn resets the streak above (and is checked again so a
            # quota after a real 200 never counts).
            if [ -f "$RUNNER_TEMP/round-had-success" ] || [ "$round_success" = "true" ]; then
              gh variable set CI_429_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
              q429=0
            else
              q429=$(gh variable get CI_429_STREAK --repo "$repo" 2>/dev/null || echo 0)
              case "$q429" in ''|*[!0-9]*) q429=0 ;; esac
              q429=$((q429 + 1))
              gh variable set CI_429_STREAK --body "$q429" --repo "$repo" >/dev/null 2>&1 || true
              if [ "$q429" -ge 3 ]; then
                gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
                echo "::error::$q429 consecutive quota 429 rounds without a healthy turn (CI_429_STREAK=$q429/3); CI_LOOP_PAUSED=true, no successor"
                echo "quota_round_limit=true" >> "$GITHUB_OUTPUT"
                echo "egress_retry=true" >> "$GITHUB_OUTPUT"
                echo "egress_retry_count=$next" >> "$GITHUB_OUTPUT"
                allow=false
                return 0
              fi
              echo "::notice::quota 429 round $q429/3 (CI_429_STREAK); will relay a fresh run"
            fi
            # Egress quota says nothing about the content loop. Keep the content
            # failure counter clear so a later real failure still pauses after 3.
            gh variable set CI_FAIL_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
            delay=0
            if [ "$next" -ge 4 ]; then
              delay=$(( 15 << (next - 4) ))
              [ "$delay" -gt 300 ] && delay=300
            fi
            echo "::notice::egress-only failure #$next (free-tier quota is not keyed by exit IP alone); relay in ${delay}s; 429 streak is tracked separately"
            echo "egress_retry=true" >> "$GITHUB_OUTPUT"
            echo "egress_retry_count=$next" >> "$GITHUB_OUTPUT"
            echo "relay_delay=$delay" >> "$GITHUB_OUTPUT"
            allow=true
          }
          if [ "$restore_outcome" != "success" ]; then
            # R2580（D2）：restore 失败时 OpenCode/Select 都被跳过；这里只记录真实
            # 原因，后续 skipped 分支按一次失败轮计数并接力。绝不能启动 OpenCode
            # 让 interval env-sync 把残缺环境写回。
            echo "restore_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::workspace/environment restore failed (restore_ws=$restore_outcome); OpenCode was skipped so the incomplete environment cannot overwrite the snapshot"
          fi
          if [ "$watcher_stop" = "true" ]; then
            # R2521：本轮如果出现过正常回合（200/正常产出），失败计数清零；
            # 只有真正"连续 3 轮没有任何成功"才暂停。END-ROUND-CI 的 marker
            # 会带 success=true/false；egress watcher 停止按无成功处理。
            if [ "$egress_only" = "true" ]; then
              egress_retry_policy
              echo "allow_relay=$allow" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$round_success" = "true" ]; then
              gh variable set CI_FAIL_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
              allow=true
              echo "round ended after a successful turn; reset CI_FAIL_STREAK; will relay"
              echo "allow_relay=$allow" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # R2520 收尾（运营者新指令）：一轮内连续 3 次出口错误只结束本轮并换新 run，
            # 不立刻暂停循环；只有连续 3 轮都没有成功回合才停循环。
            cur=$(gh variable get CI_FAIL_STREAK --repo "$repo" 2>/dev/null || echo 0)
            case "$cur" in ''|*[!0-9]*) cur=0 ;; esac
            next=$((cur + 1))
            if gh variable set CI_FAIL_STREAK --body "$next" --repo "$repo" >/dev/null 2>&1; then
              if [ "$next" -ge 3 ]; then
                gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
                echo "::error::watcher ended the round; $next consecutive rounds without a successful round; CI_LOOP_PAUSED=true, no successor"
              else
                allow=true
                echo "::notice::watcher ended the round; CI_FAIL_STREAK=$next/3, will relay a fresh round"
              fi
            else
              echo "::error::could not update CI_FAIL_STREAK; refusing to relay blindly"
            fi
          # R2514: `skipped` (prerequisite failed, Run OpenCode never ran) is a
          # transient failure — increment streak, do NOT pause. `cancelled` is
          # an operator signal — pause immediately.
          elif [ "$outcome" = "success" ]; then
            # R2550（D5）：exit 0 不等于本轮有正常回合。旧实现无条件清零 streak，
            # 于是插件未注入/进程静默退出时会无限接力且永远不触发 3 连败暂停。
            # 判据与 watcher 分支一致：本进程写过 round-had-success，或确属时间预算耗尽。
            if [ "$budget_timeout" = "true" ]; then
              # R2618: an explicitly requested budget is a deliberate round
              # boundary, not a failed 429 round. End normally and relay; do not
              # touch the 429/failure streaks.
              allow=true
              echo "::notice::opencode ended at the explicit time budget; treating it as a normal round boundary and will relay"
            elif [ -f "$RUNNER_TEMP/round-had-success" ]; then
              gh variable set CI_FAIL_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
              allow=true
              echo "run succeeded; reset CI_FAIL_STREAK"
            else
              # R2617: a soft timeout (exit 124) is NOT a healthy turn. Counting
              # it as success let a stuck loop relay forever; the operator's rule
              # is 3 consecutive rounds without any real 200 → stop.
              echo "::warning::opencode exited 0 but produced no healthy turn this run${soft_success:+ (soft_success=$soft_success)}; counting it as a failed round"
              echo "silent_exit=true" >> "$GITHUB_OUTPUT"
              cur=$(gh variable get CI_FAIL_STREAK --repo "$repo" 2>/dev/null || echo 0)
              case "$cur" in ''|*[!0-9]*) cur=0 ;; esac
              next=$((cur + 1))
              if gh variable set CI_FAIL_STREAK --body "$next" --repo "$repo" >/dev/null 2>&1; then
                if [ "$next" -ge 3 ]; then
                  gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
                  echo "::error::three consecutive rounds without a healthy turn (last: silent exit 0); CI_LOOP_PAUSED=true, no successor"
                else
                  allow=true
                  echo "::notice::silent exit without a healthy turn; CI_FAIL_STREAK=$next/3, will relay a fresh round"
                fi
              else
                echo "::error::could not update CI_FAIL_STREAK; refusing to relay blindly"
              fi
            fi
          elif [ "$outcome" = "failure" ] || [ "$outcome" = "skipped" ]; then
            # R2559（D5，运营者规则：只有连续 3 轮没有任何 200 才停循环）：
            # watcher/success 分支都按 round-had-success 清零；failure 分支旧实现
            # 忽略该标记，导致“本轮已有 200、随后进程崩溃”的轮次被算成无成功轮，
            # 3 次即误停循环。有 200 就必须复位 streak；仍接力新 run（崩溃不该拖住循环）。
            # R2562：Select egress proxy 失败时 run_opencode 为 skipped；把真实
            # 原因传给结束通知，避免写成含糊的 outcome=skipped。
            if [ "$select_outcome" = "failure" ]; then
              echo "select_failed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::egress selection failed; ${select_reason:-no candidate answered 200}"
            fi
            if [ "$egress_only" = "true" ]; then
              egress_retry_policy
              echo "allow_relay=$allow" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -f "$RUNNER_TEMP/round-had-success" ]; then
              gh variable set CI_FAIL_STREAK --body 0 --repo "$repo" >/dev/null 2>&1 || true
              allow=true
              echo "healthy_failure=true" >> "$GITHUB_OUTPUT"
              echo "::notice::run outcome=$outcome after a healthy turn (200); reset CI_FAIL_STREAK; will relay a fresh round"
            else
              cur=$(gh variable get CI_FAIL_STREAK --repo "$repo" 2>/dev/null || echo 0)
              case "$cur" in ''|*[!0-9]*) cur=0 ;; esac
              next=$((cur + 1))
              if gh variable set CI_FAIL_STREAK --body "$next" --repo "$repo" >/dev/null 2>&1; then
                if [ "$next" -ge 3 ]; then
                  gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
                  echo "::error::three consecutive failed/skipped runs (last outcome=$outcome); CI_LOOP_PAUSED=true, no successor"
                else
                  allow=true
                  echo "run outcome=$outcome; CI_FAIL_STREAK=$next/3, will retry"
                fi
              else
                echo "::error::could not update CI_FAIL_STREAK; refusing to relay blindly"
              fi
            fi
          elif [ "$outcome" = "cancelled" ]; then
            gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
            echo "::notice::run cancelled by operator; CI_LOOP_PAUSED=true, no successor"
          else
            gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
            echo "::notice::unexpected outcome=$outcome; paused the loop and suppressing relay"
          fi
          echo "allow_relay=$allow" >> "$GITHUB_OUTPUT"

      - name: Relay next run
        id: relay
        # R2513: do NOT gate on `vars.CI_LOOP_PAUSED` — `vars` is snapshotted at
        # run start, so a Resume step that cleared the flag would be overruled.
        # `allow_relay` is the single source of truth for the run outcome.
        # R2517: still re-read the LIVE pause variable before dispatching — an
        # operator stop issued while this run was in flight must win over relay.
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && steps.failure_guard.outputs.allow_relay == 'true'
        run: |
          set +e
          repo="${{ github.repository }}"
          paused=$(gh variable get CI_LOOP_PAUSED --repo "$repo" 2>/dev/null || echo "")
          if [ "$paused" = "true" ]; then
            echo "relayed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_LOOP_PAUSED=true (live); operator stopped the loop, suppressing relay"
            exit 0
          fi
          echo "Relaying next run (run_opencode outcome=${{ steps.run_opencode.outcome }})."
          relay_delay="${{ steps.failure_guard.outputs.relay_delay }}"
          if [ -n "$relay_delay" ] && [ "$relay_delay" -gt 0 ] 2>/dev/null; then
            echo "egress retry backoff: sleeping ${relay_delay}s before dispatching a fresh runner"
            sleep "$relay_delay"
          fi
          relayed=0
          for attempt in 1 2 3; do
            # R2579: never inherit the repository default branch. It was once
            # repointed at an old commit branch, silently pinning every relayed
            # run to stale workflow code (bypassing the relay-first egress fix).
            out=$(gh workflow run iterate.yml -f resume=true -f relay=true --ref main --repo "$repo" 2>&1)
            rc=$?
            if [ "$rc" = "0" ]; then
              echo "relayed next run on attempt $attempt"
              relayed=1
              break
            fi
            echo "$out"
            echo "::warning::relay attempt $attempt failed; not re-enabling a disabled workflow"
            sleep 5
          done
          if [ "$relayed" = "1" ]; then
            echo "relayed=true" >> "$GITHUB_OUTPUT"
          else
            echo "relayed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$relayed" != "1" ]; then
            echo "::error::relay failed after 3 attempts; no successor queued"
            exit 1
          fi

      - name: Notify round end
        # R2540（运营者：每次 CI 结束告诉我本轮结束的原因）：所有已成功接力的轮次
        # 都发一条，包括正常成功 / 预算耗尽 / watcher 停止。旧实现只看
        # watcher_stop == 'true'，导致正常成功轮静默结束；兜底文案还把缺原因
        # 一律写成“3 次出口错误”。现在按 outcome 给出真实原因。
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && steps.failure_guard.outputs.allow_relay == 'true' && steps.relay.outputs.relayed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
        run: |
          set +e
          repo="${{ github.repository }}"
          outcome="${{ steps.run_opencode.outcome }}"
          watcher="${{ steps.run_opencode.outputs.watcher_stop }}"
          reason="${{ steps.run_opencode.outputs.watcher_reason }}"
          silent_exit="${{ steps.failure_guard.outputs.silent_exit }}"
          healthy_failure="${{ steps.failure_guard.outputs.healthy_failure }}"
          select_failed="${{ steps.failure_guard.outputs.select_failed }}"
          select_reason="${{ steps.select_egress.outputs.reason }}"
          restore_failed="${{ steps.failure_guard.outputs.restore_failed }}"
          egress_retry="${{ steps.failure_guard.outputs.egress_retry }}"
          egress_n="${{ steps.failure_guard.outputs.egress_retry_count }}"
          # R2622: surface the provider reset window in the TG notice. The
          # watcher / gateway preflight stop reason carries retry_after=N;
          # auto-continue errors carry retry_after_s=N. Convert either to an
          # absolute UTC reset hint so the operator knows when the free bucket
          # is expected back instead of retrying blindly.
          retry_after_s=""
          if printf '%s' "$reason" | grep -qE 'retry_after(_s)?=[0-9]+'; then
            retry_after_s=$(printf '%s' "$reason" | sed -nE 's/.*retry_after(_s)?=([0-9]+).*/\2/p' | head -1)
          elif [ -s "$RUNNER_TEMP/opencode-errors.txt" ]; then
            retry_after_s=$(grep -aoE 'retry_after(_s)?=[0-9]+' "$RUNNER_TEMP/opencode-errors.txt" 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)
          fi
          reset_hint=""
          if [ -n "$retry_after_s" ] && [ "$retry_after_s" -gt 0 ] 2>/dev/null; then
            reset_epoch=$(( $(date +%s) + retry_after_s ))
            reset_hint=$(date -u -d "@$reset_epoch" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || true)
          fi
          if [ "$egress_retry" = "true" ]; then
            # R2596: during a dirty-IP period the loop now retries every 1-5 min.
            # Do not spam Telegram: notify at 1/3/6/12/24/48 and then every 24.
            case "$egress_n" in
              1|3|6|12|24|48) ;;
              *) if [ $((egress_n % 24)) -ne 0 ] 2>/dev/null; then
                   echo "egress retry #$egress_n: suppressing duplicate TG notice"
                   exit 0
                 fi ;;
            esac
          fi
          if [ "$egress_retry" = "true" ]; then
            # R2620: every quota 429 ends its round. Do not claim the bucket is
            # keyed by exit IP: fresh runner IPs still hit the same wall.
            reason="出口配额 429（免费额度耗尽）；本轮首个 429 已结束并换新 run 重试（第 ${egress_n} 次）${reset_hint:+；预计 ${reset_hint} 重置}"
          elif [ "$restore_failed" = "true" ]; then
            reason="环境/工作区还原失败；已跳过 OpenCode 并按失败计数接力新 run（快照未被覆盖）"
          elif [ "$select_failed" = "true" ]; then
            reason="出口选择失败：${select_reason:-no candidate answered 200}；已按失败计数接力新 run"
          elif [ "$watcher" = "true" ]; then
            [ -n "$reason" ] || reason="watcher 结束本轮（未提供原因）"
            reason="watcher：${reason}"
          elif [ "$outcome" = "success" ] && [ "$silent_exit" = "true" ]; then
            reason="opencode 退出但本轮无健康回合（无 200），按失败计数后接力新 run"
          elif [ "$outcome" = "success" ]; then
            reason="opencode 正常结束（预算耗尽或正常收尾），已接力新 run"
          elif [ "$outcome" = "failure" ] && [ "$healthy_failure" = "true" ]; then
            reason="opencode 异常结束，但本轮有健康回合（200），已复位失败计数并接力新 run"
          elif [ "$outcome" = "failure" ]; then
            reason="opencode 失败（outcome=failure），已按失败计数接力重试"
          else
            reason="opencode 结束（outcome=${outcome:-unknown}），已接力新 run"
          fi
          streak=$(gh variable get CI_FAIL_STREAK --repo "$repo" 2>/dev/null || echo "?")
          [ "$egress_retry" = "true" ] && streak=$(gh variable get CI_429_STREAK --repo "$repo" 2>/dev/null || echo "?")
          [ "$egress_retry" = "true" ] && streak="${streak}/3 (429 轮)"
          # R2587（D7）：结束通知必须带真实错误证据，而不只是 outcome。退出码
          # 与本次 Run OpenCode 抓到的最后一条错误（已去 ANSI/CR）一并附上。
          rc="${{ steps.run_opencode.outputs.exit_code }}"
          err_line=""
          if [ -s "$RUNNER_TEMP/opencode-errors.txt" ]; then
            err_line=$(head -1 "$RUNNER_TEMP/opencode-errors.txt" 2>/dev/null | tr -d '\r' | cut -c1-200)
          fi
          detail="opencode：${outcome}"
          [ -n "$rc" ] && detail="$detail（exit=$rc）"
          text=$(printf '🔄 CI 本轮结束（已接力新 run）\n原因：%s\nrun：%s\n%s；streak：%s' "$reason" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$detail" "$streak")
          if [ -n "$err_line" ]; then
            text=$(printf '%s\n最后错误：%s' "$text" "$err_line")
          fi
          # R2625: surface the round-end zengate scope probe, so the operator
          # sees whether an alternate path still had quota or every path 429'd.
          probe_line=""
          if [ -s "$RUNNER_TEMP/egress/quota-probe.meta" ]; then
            probe_line=$(awk -F= '
              $1=="round_up"{up=$2}
              $1=="alt_up"{alt=$2}
              $1=="alt_code"{code=$2}
              $1=="alt_reason"{reason=$2}
              $1=="scope"{scope=$2}
              $1=="note"{note=$2}
              END{if(scope=="") exit; printf "429 结束探针：%s → %s（code=%s，reason=%s，scope=%s%s）", (up==""?"?":up), (alt==""?"?":alt), (code==""?"?":code), (reason==""?"?":reason), scope, (note==""?"":"，note=" note)}
            ' "$RUNNER_TEMP/egress/quota-probe.meta" 2>/dev/null || true)
          fi
          if [ -n "$probe_line" ]; then
            text=$(printf '%s\n%s' "$text" "$probe_line")
          fi
          if [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_PUSH_CHAT:-}" ]; then
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_PUSH_CHAT}" --data-urlencode "text=${text}" \
              >/dev/null 2>&1 || echo "::warning::could not send round-end notice to telegram"
          else
            echo "::warning::TG_BOT_TOKEN/TG_PUSH_CHAT missing; round-end notice skipped"
          fi

      - name: Notify loop stop
        # R2517（运营者：每次 CI 结束告诉我本轮结束的原因）：只在循环真正停下时发
        # 停止卡；已成功接力的轮次由 Notify round end 发结束原因，两者按 relayed
        # 互斥。覆盖：连续 3 次失败、watcher 停止未接力、取消、relay 失败、
        # 运营者暂停后 relay 主动让路。
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && (steps.failure_guard.outputs.allow_relay != 'true' || steps.relay.outputs.relayed != 'true')
        env:
          GH_TOKEN: ${{ secrets.CROSS_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
        run: |
          set +e
          repo="${{ github.repository }}"
          outcome="${{ steps.run_opencode.outcome }}"
          relay_out="${{ steps.relay.outcome }}"
          watcher="${{ steps.run_opencode.outputs.watcher_stop }}"
          select_failed="${{ steps.failure_guard.outputs.select_failed }}"
          select_reason="${{ steps.select_egress.outputs.reason }}"
          restore_failed="${{ steps.failure_guard.outputs.restore_failed }}"
          quota_round_limit="${{ steps.failure_guard.outputs.quota_round_limit }}"
          streak=$(gh variable get CI_FAIL_STREAK --repo "$repo" 2>/dev/null || echo "?")
          if [ "$quota_round_limit" = "true" ]; then
            streak=$(gh variable get CI_429_STREAK --repo "$repo" 2>/dev/null || echo "3")
            streak="${streak}/3 (429 轮)"
          fi
          paused=$(gh variable get CI_LOOP_PAUSED --repo "$repo" 2>/dev/null || echo "?")
          # R2587（D7）：停止卡同样带退出码与最后一条错误证据。
          rc="${{ steps.run_opencode.outputs.exit_code }}"
          err_line=""
          if [ -s "$RUNNER_TEMP/opencode-errors.txt" ]; then
            err_line=$(head -1 "$RUNNER_TEMP/opencode-errors.txt" 2>/dev/null | tr -d '\r' | cut -c1-200)
          fi
          detail="opencode：${outcome}"
          [ -n "$rc" ] && detail="$detail（exit=$rc）"
          reason="本轮结束（opencode=$outcome）"
          if [ "$restore_failed" = "true" ]; then
            reason="环境/工作区还原失败；已跳过 OpenCode（快照未被覆盖）"
            if [ "$streak" != "?" ] && [ "$streak" -ge 3 ] 2>/dev/null; then
              reason="$reason；连续失败 ${streak} 次，循环已暂停"
            elif [ "$relay_out" = "failure" ]; then
              reason="$reason；接力失败，没有后继 run"
            else
              reason="$reason；未接力"
            fi
          elif [ "$select_failed" = "true" ]; then
            reason="出口选择失败：${select_reason:-no candidate answered 200}"
            if [ "$streak" != "?" ] && [ "$streak" -ge 3 ] 2>/dev/null; then
              reason="$reason；连续失败 ${streak} 次，循环已暂停"
            elif [ "$relay_out" = "failure" ]; then
              reason="$reason；接力失败，没有后继 run"
            else
              reason="$reason；未接力"
            fi
          elif [ "$quota_round_limit" = "true" ]; then
            reason="连续 3 轮 429 且无健康回合（免费额度耗尽），循环已暂停，不再接力新 run"
          elif [ "$watcher" = "true" ]; then
            wr=$(tr '\n' ' ' < "$RUNNER_TEMP/egress/stop" 2>/dev/null | cut -c1-300)
            if [ "$streak" != "?" ] && [ "$streak" -ge 3 ] 2>/dev/null; then
              reason="连续 3 轮无成功，循环已暂停（last: ${wr:-watcher stop}）"
            else
              reason="watcher 结束本轮，但未能接力（${wr:-unknown}）"
            fi
          elif [ "$outcome" = "cancelled" ]; then
            reason="本轮被取消（运营者停止信号，不会自动接力）"
          elif [ "$streak" != "?" ] && [ "$streak" -ge 3 ] 2>/dev/null; then
            reason="连续失败 3 次，循环已暂停"
          elif [ "$relay_out" = "failure" ]; then
            reason="接力失败：3 次 dispatch 均未成功，没有后继 run"
          elif [ "$paused" = "true" ]; then
            reason="循环已暂停（运营者停止或失败阈值），relay 已让路"
          fi
          text=$(printf '🛑 CI 循环停止\n原因：%s\nrun：%s\n%s；relay：%s；streak：%s；pause：%s' "$reason" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$detail" "$relay_out" "$streak" "$paused")
          if [ -n "$err_line" ]; then
            text=$(printf '%s\n最后错误：%s' "$text" "$err_line")
          fi
          # R2625: the stop card must also show the round-end zengate scope
          # probe, because the 3/3 quota pause is exactly when "is it only
          # direct?" matters most.
          probe_line=""
          if [ -s "$RUNNER_TEMP/egress/quota-probe.meta" ]; then
            probe_line=$(awk -F= '
              $1=="round_up"{up=$2}
              $1=="alt_up"{alt=$2}
              $1=="alt_code"{code=$2}
              $1=="alt_reason"{reason=$2}
              $1=="scope"{scope=$2}
              $1=="note"{note=$2}
              END{if(scope=="") exit; printf "429 结束探针：%s → %s（code=%s，reason=%s，scope=%s%s）", (up==""?"?":up), (alt==""?"?":alt), (code==""?"?":code), (reason==""?"?":reason), scope, (note==""?"":"，note=" note)}
            ' "$RUNNER_TEMP/egress/quota-probe.meta" 2>/dev/null || true)
          fi
          if [ -n "$probe_line" ]; then
            text=$(printf '%s\n%s' "$text" "$probe_line")
          fi
          if [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_PUSH_CHAT:-}" ]; then
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_PUSH_CHAT}" --data-urlencode "text=${text}" \
              >/dev/null 2>&1 || echo "::warning::could not send loop-stop notice to telegram"
          else
            echo "::warning::TG_BOT_TOKEN/TG_PUSH_CHAT missing; loop-stop notice skipped"
          fi

      - name: Save workspace snapshots
        # R2513: smoke must NOT write the env release (it runs in a separate
        # concurrency group, so a save could race and overwrite production).
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && steps.restore_ws.outcome == 'success'
        run: |
          set +e
          SNAP="$SESSIONS_DIR/workspace-snapshots"
          mkdir -p "$SNAP"
          INDEX="$SNAP/index.json"
          [ -f "$INDEX" ] || echo '{"snapshots": []}' > "$INDEX"
          echo "target snapshots: index=$INDEX"
          find "$SNAP" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null
          shopt -s nullglob
          for target_dir in "$TARGETS_DIR"/*/; do
            repo_dir="${target_dir%/}"
            # R2586（D6）：只索引真实的目标目录。会话会在工作区里放指向别处的
            # 符号链接（实测 `pcb -> PCB`，10:29 创建）；旧逻辑的 `[ -d ./.git ]`
            # 会跟随链接，把同一个仓库再索引一次（fp 相同、restore 报 ok=5），
            # 更糟的是链接若指向 $HOME 等大树，指纹会把外部内容也算进来。
            [ -L "$repo_dir" ] && continue
            [ -d "$repo_dir/.git" ] || continue
            name=$(basename "$repo_dir")
            snap_dir="$SNAP/$name"
            rm -rf "$snap_dir"

            BRANCH=$(git -C "$repo_dir" symbolic-ref --short HEAD 2>/dev/null || true)
            COMMIT=$(git -C "$repo_dir" rev-parse HEAD 2>/dev/null || true)
            REMOTE=$(git -C "$repo_dir" remote get-url origin 2>/dev/null || true)
            SAVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            MODE="dirtar"
            PRIOR=$(jq -r --arg d "$name" '.snapshots[] | select(.dir == $d) | [.commit // "", .mode // ""] | @tsv' "$INDEX" 2>/dev/null | head -1)
            PRIOR_COMMIT=${PRIOR%%$'\t'*}
            PRIOR_MODE=${PRIOR##*$'\t'}
            SKIP_FETCH=0
            if [ -n "$COMMIT" ] && [ "$COMMIT" = "$PRIOR_COMMIT" ] && [ "$PRIOR_MODE" = "dirtar-slim" ] \
               && [ ! -f "$repo_dir/.gitmodules" ] \
               && ! git -C "$repo_dir" ls-files -u 2>/dev/null | grep -q .; then
              SKIP_FETCH=1
              MODE="dirtar-slim"
            fi
            if [ "$SKIP_FETCH" != 1 ] && [ -n "$REMOTE" ] && [ -n "$BRANCH" ]; then
              timeout 20 git -C "$repo_dir" fetch --quiet --no-tags origin \
                "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
            fi
            if [ "$SKIP_FETCH" != 1 ] && [ -n "$COMMIT" ] && [ -n "$BRANCH" ] && [ ! -f "$repo_dir/.gitmodules" ] \
               && ! git -C "$repo_dir" ls-files -u 2>/dev/null | grep -q . \
               && git -C "$repo_dir" branch -r --contains "$COMMIT" 2>/dev/null | grep -q .; then
              MODE="dirtar-slim"
            fi

            if [ "$MODE" = "dirtar" ]; then
              STASH_HASH=$(git -C "$repo_dir" stash create "snapshot-$(date -u +%s)")
              if [ -n "$STASH_HASH" ]; then
                git -C "$repo_dir" stash store -m "snapshot" "$STASH_HASH" 2>/dev/null || true
              fi
            fi

            FP=$( {
              printf 'head=%s\n' "$COMMIT"
              printf 'branch=%s\n' "$BRANCH"
              printf 'worktree=%s\n' "$(cd "$repo_dir" && find . -path ./.git -prune -o -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)"
            } | sha256sum | cut -d' ' -f1 )

            ENTRY=$(jq -n \
              --arg repo "$REMOTE" \
              --arg dir "$name" \
              --arg mode "$MODE" \
              --arg fp "$FP" \
              --arg branch "$BRANCH" \
              --arg commit "$COMMIT" \
              --arg saved_at "$SAVED_AT" \
              '{repo: $repo, dir: $dir, mode: $mode, fp: $fp, bundle: "", worktree: "", branch: $branch, commit: $commit, saved_at: $saved_at}')

            tmp=$(mktemp)
            jq --arg dir "$name" '.snapshots |= map(select(.dir != $dir))' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
            tmp=$(mktemp)
            jq --argjson e "$ENTRY" '.snapshots += [$e]' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
            echo "target snapshot indexed: dir=$name commit=${COMMIT:0:12} mode=$MODE fp=${FP:0:12}"
          done
          # R2586（D6）：旧 index 里若已存在符号链接条目（上一代旧代码写入的），
          # 必须在本代修剪掉；否则 TGT_FP 永远包含它，包会被判定“未变化”而携带，
          # 链接一代代被还原回来。只修剪符号链接，视觉上“消失”的目录保留条目
          # （下一轮 restore 会从包里恢复它，宁可复活也不静默丢工作区）。
          while IFS= read -r _sd; do
            [ -n "$_sd" ] || continue
            if [ -L "$TARGETS_DIR/$_sd" ]; then
              _tmp=$(mktemp)
              if jq --arg dir "$_sd" '.snapshots |= map(select(.dir != $dir))' "$INDEX" > "$_tmp" 2>/dev/null; then
                mv "$_tmp" "$INDEX"
                echo "target snapshot pruned: dir=$_sd (symlink, not a real workspace)"
              else
                rm -f "$_tmp"
                echo "::warning::could not prune symlink target entry $_sd from the snapshot index"
              fi
            fi
          done < <(jq -r '.snapshots[]?.dir // empty' "$INDEX" 2>/dev/null)
          echo "target snapshot index: $(jq -r '[.snapshots[]?] | length' "$INDEX" 2>/dev/null || echo 0) entries"

      - name: Snapshot environment to sessions repository
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && steps.restore_ws.outcome == 'success'
        env:
          SPLIT_SIZE: ${{ inputs.split_size }}
        run: |
          set +e
          ENV_SRC="$SESSIONS_DIR/opencode"
          mkdir -p "$ENV_SRC"
          ENV_TAG="env"
          SPLIT_SIZE="${SPLIT_SIZE:-256m}"
          if command -v python3 >/dev/null 2>&1 && [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            python3 -c 'import sqlite3;c=sqlite3.connect("'"$HOME"'/.local/share/opencode/opencode.db");c.execute("PRAGMA wal_checkpoint(TRUNCATE)");c.close()' 2>/dev/null \
              && echo "sqlite WAL checkpointed" || echo "::warning::sqlite WAL checkpoint skipped"
          fi
          OUT=/tmp/envsnap
          rm -rf "$OUT" && mkdir -p "$OUT"
          if command -v pigz >/dev/null 2>&1; then
            TAR_COMP=(tar -I 'pigz -1 -p4' -cf -)
          else
            TAR_COMP=(tar -czf -)
          fi
          # R2554: the targets bundle is the bulk of the snapshot (51 MB with
          # pigz -1). zstd -10 packs it to ~21 MB in the same ~4s, and the
          # restore side already detects the 28b52ffd magic. env/records keep
          # pigz because their readers are unchanged and env is mostly carried.
          if command -v zstd >/dev/null 2>&1; then
            TGT_TAR_COMP=(tar -I 'zstd -10 -T4 -q' -cf -)
          elif command -v pigz >/dev/null 2>&1; then
            TGT_TAR_COMP=(tar -I 'pigz -1 -p4' -cf -)
          else
            TGT_TAR_COMP=(tar -czf -)
          fi
          SNAP_T0=$(date +%s)
          SKIP_ENV_PACK=0
          if [ -f "$SESSIONS_DIR/opencode/config/scripts/env-sync.sh" ]; then
            SYNC_OK=0
            SYNC_LOG="$RUNNER_TEMP/env-sync-run-end.log"
            : > "$SYNC_LOG"
            for a in 1 2; do
              # R2518: WAIT_LOCK makes run-end wait for the bridge interval sync
              # instead of silently skipping (rc=75 = still locked → retry).
              # R2543: cap each wait at 8s (boot sync can hold the lock for
              # minutes); the release pack below still captures the final state.
              # R2545: keep the per-attempt output. The old `>/dev/null 2>&1`
              # meant a failed lock wait left no evidence in the run log at all.
              sync_t0=$(date +%s)
              ENV_SYNC_WHY=run-end ENV_SYNC_TIMEOUT=180 ENV_SYNC_WAIT_LOCK=1 \
                ENV_SYNC_WAIT_SECONDS=8 \
                timeout 300 bash "$SESSIONS_DIR/opencode/config/scripts/env-sync.sh" >>"$SYNC_LOG" 2>&1
              sync_rc=$?
              sync_took=$(( $(date +%s) - sync_t0 ))
              if [ "$sync_rc" = 0 ]; then
                SYNC_OK=1
                echo "run-end env-sync attempt $a ok in ${sync_took}s"
                break
              fi
              echo "::warning::run-end env-sync attempt $a failed rc=$sync_rc after ${sync_took}s (75=lock busy); retrying"
              # R2545: show why it failed. Without this the operator only saw the
              # final "packing the env release" line and could not tell whether
              # the lock was busy or the push failed.
              tail -6 "$SYNC_LOG" | sed 's/^/  env-sync: /'
              sleep 2
            done
            if [ "$SYNC_OK" = 1 ]; then
              echo "run-end env-sync pushed; the env-sync branch now holds the final state"
              gh release download "$ENV_TAG" --repo "$SESSIONS_REPO" --pattern 'meta.json' --dir "$OUT" --clobber >/dev/null 2>&1 || true
              if [ -s "$OUT/meta.json" ] && jq -e '(.env.bytes // 0) > 0' "$OUT/meta.json" >/dev/null 2>&1; then
                cp -f "$OUT/meta.json" "$OUT/meta.env-carry.json"
                SKIP_ENV_PACK=1
                echo "env pack skipped: carried the release env section; the branch is the primary env source"
              else
                echo "::warning::no usable previous meta.json to carry the env section; packing env anyway"
              fi
            else
              echo "::warning::run-end env-sync failed; packing the env release as before"
            fi
          fi
          echo "snapshot timing: env-sync $(( $(date +%s) - SNAP_T0 ))s (skip_pack=$SKIP_ENV_PACK)"
          if [ "$SKIP_ENV_PACK" != 1 ]; then
          find "$HOME/.local/share/opencode/shell" -type f -size +50M -delete 2>/dev/null || true
          # R2573（D6）：tar|split 是管线，bash 默认只看最后一个命令的退出码 ——
          # tar 中途失败（文件消失/权限/磁盘）会被 split 的成功掩盖，随后 meta 的
          # bytes/sha 恰好按“半包”计算，读侧校验全绿却永久少数据。必须在同一
          # 子 shell 开 pipefail，失败就退出本步：旧 release 原样保留。
          if ! ( set -o pipefail
            "${TAR_COMP[@]}" -C "$HOME" \
            --exclude='./work' \
            --exclude='./.cache' \
            --exclude='./.opencode/bin' \
            --exclude='./.ssh' \
            --exclude='./.config/gh' \
            --exclude='./.gitconfig' \
            --exclude='./.git-credentials' \
            --exclude='./.local/share/opencode/log' \
            --exclude='./.npm/_cacache' \
            --exclude='./.bun' \
            --exclude='./actions-runner' \
            --exclude='./.rustup' \
            --exclude='./.dotnet' \
            --exclude='./.opencode/.v2lib-live' \
            . 2>/dev/null | split -b "$SPLIT_SIZE" - "$OUT/env.tar.gz." ); then
            echo "::error::environment package failed (tar/split returned nonzero); refusing to publish a partial env package (previous generation kept)"
            exit 1
          fi
          fi
          REC_OK=0
          REC_T0=$(date +%s)
          if ( set -o pipefail; cd "$SESSIONS_DIR" || exit 1; "${TAR_COMP[@]}" state tasks sessions loop-state.md 2>/dev/null | split -b "$SPLIT_SIZE" - "$OUT/records.tar.gz." ) \
             && ls "$OUT"/records.tar.gz.* >/dev/null 2>&1; then
            REC_OK=1
          else
            # R2573（D6）：半包不得留在 $OUT 被后续 stage/upload 当成“最新 records”
            # 发出去。删掉它，meta 不写 records，读侧继续用 targets 内嵌副本。
            echo "::warning::records package failed (tar/split nonzero); dropping the partial asset; readers will use the copy embedded in the targets package"
            rm -f "$OUT"/records.tar.gz.* 2>/dev/null || true
          fi
          echo "snapshot timing: records pack $(( $(date +%s) - REC_T0 ))s, $(cat "$OUT"/records.tar.gz.* 2>/dev/null | wc -c) bytes"
          TGT_FP=""; TGT_MODE=""
          IDX="$SESSIONS_DIR/workspace-snapshots/index.json"
          if [ -s "$IDX" ]; then
            _tn=$(jq -r '[.snapshots[]?] | length' "$IDX" 2>/dev/null || echo 0)
            _bad=$(jq -r '[.snapshots[]? | select((((.mode // "") | test("^dirtar")) | not) or ((.fp // "") | length) == 0)] | length' "$IDX" 2>/dev/null || echo 1)
            if [ "${_tn:-0}" -gt 0 ] 2>/dev/null && [ "${_bad:-1}" = "0" ]; then
              _slim=$(jq -r '[.snapshots[]? | select(.mode == "dirtar-slim")] | length' "$IDX" 2>/dev/null || echo 0)
              _full=$(jq -r '[.snapshots[]? | select(.mode == "dirtar")] | length' "$IDX" 2>/dev/null || echo 0)
              if [ "${_slim:-0}" = "${_tn}" ]; then TGT_MODE="dirtar-slim"
              elif [ "${_full:-0}" = "${_tn}" ]; then TGT_MODE="dirtar"
              else TGT_MODE="mixed"; fi
              TGT_FP=$(jq -r '[.snapshots[] | .dir + "=" + .fp] | sort | join("\n")' "$IDX" | sha256sum | cut -d' ' -f1)
            fi
          fi
          CARRY=0
          if [ "$SKIP_ENV_PACK" = 1 ] && [ "$REC_OK" = 1 ] && [ -n "$TGT_FP" ] && [ -f "$OUT/meta.env-carry.json" ] \
            && jq -e '(.targets.mode // "") | test("^(dirtar|mixed)")' "$OUT/meta.env-carry.json" >/dev/null 2>&1 \
            && [ "$(jq -r '.targets.fp // empty' "$OUT/meta.env-carry.json" 2>/dev/null)" = "$TGT_FP" ]; then
            _prev_n=$(jq -r '.targets.volumes // 0' "$OUT/meta.env-carry.json" 2>/dev/null || echo 0)
            _have_n=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '[.assets[].name | select(test("^targets\\.tar\\.gz"))] | length' 2>/dev/null || echo 0)
            if [ "${_prev_n:-0}" -gt 0 ] 2>/dev/null && [ "${_prev_n:-0}" = "${_have_n:-0}" ]; then
              CARRY=1
              echo "targets unchanged (fingerprint match, $_have_n page(s)); carrying the previous targets package (the embedded index saved_at stays at the last repack; this run is recorded as meta.targets.carried_at)"
            else
              echo "::warning::targets fingerprint matches but the release has ${_have_n:-0} of ${_prev_n:-0} page(s); re-uploading targets"
            fi
          fi
          if [ "$CARRY" != 1 ]; then
            TGT_PACK_T0=$(date +%s)
            TGT_DIRS=()
            SLIM_EXCLUDES=()
            for d in "$TARGETS_DIR"/*/; do
              # R2586：符号链接不是独立目标，不打包（避免重复条目/外部树）。
              [ -L "${d%/}" ] && continue
              [ -d "${d%/}/.git" ] && TGT_DIRS+=("$(basename "$d")")
            done
            if [ -s "$IDX" ]; then
              while IFS= read -r sd; do
                [ -n "$sd" ] && SLIM_EXCLUDES+=("--exclude=$sd/.git" "--exclude=$sd/.git/*")
              done < <(jq -r '.snapshots[]? | select(.mode == "dirtar-slim") | .dir // empty' "$IDX" 2>/dev/null)
            fi
            # R2573（D6）：与 env 同因 —— tar|split 默认只看 split 的退出码。
            # 半包一旦发布，meta 的 bytes/sha 与半包一致，读侧“校验通过”；
            # 缺失的目标目录会在下一代 save 时被移出 index，等于静默丢工作区。
            # 失败即退出本步，保留上一代完整包。
            if ! ( set -o pipefail
              cd "$SESSIONS_DIR" || exit 1
              "${TGT_TAR_COMP[@]}" "${SLIM_EXCLUDES[@]}" --exclude='*/.git/*.lock' workspace-snapshots state tasks sessions loop-state.md -C "$TARGETS_DIR" ${TGT_DIRS[@]+"${TGT_DIRS[@]}"} 2>/dev/null | split -b "$SPLIT_SIZE" - "$OUT/targets.tar.gz." ); then
              echo "::error::target workspace package failed (tar/split returned nonzero); refusing to publish a partial targets package (previous generation kept)"
              exit 1
            fi
            if ! ls "$OUT"/targets.tar.gz.* >/dev/null 2>&1; then
              echo "::error::target workspace package produced no volumes; refusing to publish (previous generation kept)"
              exit 1
            fi
            echo "snapshot timing: targets pack $(( $(date +%s) - TGT_PACK_T0 ))s, $(cat "$OUT"/targets.tar.gz.* 2>/dev/null | wc -c) bytes"
          fi
          UP_T0=$(date +%s)
          SZ=$(cat "$OUT"/env.tar.gz.* 2>/dev/null | wc -c)
          TZ=$(cat "$OUT"/targets.tar.gz.* 2>/dev/null | wc -c)
          ENV_N=$(ls "$OUT"/env.tar.gz.* 2>/dev/null | wc -l)
          TGT_N=$(ls "$OUT"/targets.tar.gz.* 2>/dev/null | wc -l)
          ENV_SHA=$(cat "$OUT"/env.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          TGT_SHA=$(cat "$OUT"/targets.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          REC_SZ=$(cat "$OUT"/records.tar.gz.* 2>/dev/null | wc -c)
          REC_N=$(ls "$OUT"/records.tar.gz.* 2>/dev/null | wc -l)
          REC_SHA=$(cat "$OUT"/records.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          SNAP_UP_PAR="${SNAP_UP_PAR:-8}"
          upload_par() {
            local fail=0
            [ "$#" -gt 0 ] || return 1
            printf '%s\0' "$@" | \
              TAG="$ENV_TAG" REPO="$SESSIONS_REPO" \
              xargs -0 -n1 -P"$SNAP_UP_PAR" \
                bash -c 'gh release upload "$TAG" "$1" --repo "$REPO" --clobber >/dev/null 2>&1' _ \
              || fail=1
            return "$fail"
          }
          if ls "$OUT"/env.tar.gz.* >/dev/null 2>&1; then
            gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" >/dev/null 2>&1 \
              || gh release create "$ENV_TAG" --repo "$SESSIONS_REPO" --title "environment snapshot" \
                   --notes "Whole-\$HOME environment + target workspace packages; replaced every run." >/dev/null 2>&1
            jq -n --arg tag "$ENV_TAG" --arg run "${GITHUB_RUN_ID:-}" --arg commit "${GITHUB_SHA:-}" \
                  --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg split "$SPLIT_SIZE" \
                  --argjson env_bytes "${SZ:-0}" --argjson targets_bytes "${TZ:-0}" \
                  --argjson env_volumes "${ENV_N:-0}" --argjson targets_volumes "${TGT_N:-0}" \
                  --arg env_sha "$ENV_SHA" --arg targets_sha "$TGT_SHA" \
                  --argjson records_bytes "${REC_SZ:-0}" --argjson records_volumes "${REC_N:-0}" \
                  --arg records_sha "$REC_SHA" --argjson rec_ok "${REC_OK:-0}" \
                  --arg tgt_mode "$TGT_MODE" --arg tgt_fp "$TGT_FP" \
                  '{version:2, tag:$tag, run_id:$run, commit:$commit, created_at:$at, split_size:$split,
                    env:{volumes:$env_volumes, bytes:$env_bytes, sha256:$env_sha},
                    targets:{volumes:$targets_volumes, bytes:$targets_bytes, sha256:$targets_sha, mode:$tgt_mode, fp:$tgt_fp}}
                   | (if $rec_ok==1 then .records={volumes:$records_volumes, bytes:$records_bytes, sha256:$records_sha} else . end)' \
                  > "$OUT/meta.json" 2>/dev/null
            mkdir -p "$OUT/stage"
            for f in "$OUT"/env.tar.gz.* "$OUT"/targets.tar.gz.* "$OUT"/records.tar.gz.* "$OUT/meta.json"; do
              [ -f "$f" ] || continue
              cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
            done
            stage_ok=0
            if upload_par "$OUT"/stage/* || gh release upload "$ENV_TAG" "$OUT"/stage/* --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
              stage_ok=1
              for f in "$OUT"/stage/stage-*; do
                n=$(basename "$f"); l=$(stat -c%s "$f")
                r=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq ".assets[] | select(.name==\"$n\") | .size")
                if [ "$l" = "$r" ]; then
                  echo "staged ok $n = $l bytes"
                else
                  stage_ok=0
                  echo "::warning::staged size mismatch $n ($l vs $r)"
                fi
              done
            else
              echo "::warning::staged upload failed; the previous package is left untouched"
            fi
            if [ "$stage_ok" -eq 1 ]; then
              mapfile -t DELOLD < <(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -E '^(env|home|targets|records)\.tar\.gz(\.|$)|^meta\.json$' || true)
              for a in ${DELOLD[@]+"${DELOLD[@]}"}; do
                gh release delete-asset "$ENV_TAG" "$a" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 &
              done
              wait
              UPF=()
              for f in "$OUT"/env.tar.gz.* "$OUT"/targets.tar.gz.* "$OUT"/records.tar.gz.*; do
                [ -f "$f" ] && UPF+=("$f")
              done
              if upload_par "${UPF[@]}" || gh release upload "$ENV_TAG" "${UPF[@]}" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
                if [ -s "$OUT/meta.json" ]; then
                  gh release upload "$ENV_TAG" "$OUT/meta.json" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 \
                    || echo "::warning::failed to upload meta.json (readers will fall back to unverified extract)"
                else
                  echo "::warning::failed to build meta.json (readers will fall back to unverified extract)"
                fi
                echo "environment package uploaded: $ENV_N volume(s), $SZ bytes"
                echo "target workspace package uploaded: $TGT_N volume(s), $TZ bytes"
                echo "package manifest: split=$SPLIT_SIZE env=$ENV_N vol targets=$TGT_N vol"
              else
                echo "::warning::failed to upload packages to release"
              fi
              for f in "$OUT"/stage/stage-*; do
                gh release delete-asset "$ENV_TAG" "$(basename "$f")" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 \
                  && echo "staged copy removed: $(basename "$f")" &
              done
              wait
            fi
          elif [ "$SKIP_ENV_PACK" = 1 ] \
            && { [ "${CARRY:-0}" = 1 ] || ls "$OUT"/targets.tar.gz.* >/dev/null 2>&1; }; then
            if [ -f "$OUT/meta.env-carry.json" ] \
              && jq --arg run "${GITHUB_RUN_ID:-}" --arg commit "${GITHUB_SHA:-}" \
                 --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg split "$SPLIT_SIZE" \
                 --argjson targets_bytes "${TZ:-0}" --argjson targets_volumes "${TGT_N:-0}" \
                 --arg targets_sha "$TGT_SHA" \
                 --argjson carry "${CARRY:-0}" --arg tgt_mode "$TGT_MODE" --arg tgt_fp "$TGT_FP" \
                 --argjson rec_ok "${REC_OK:-0}" --argjson records_bytes "${REC_SZ:-0}" \
                 --argjson records_volumes "${REC_N:-0}" --arg records_sha "$REC_SHA" \
                 '.env.packed_at=(.env.packed_at // .env.carried_at // .created_at) |
                  .env.carried_at=$at |
                  .env.carried=true |
                  .created_at=$at | .run_id=$run | .commit=$commit | .split_size=$split |
                  .targets=(if $carry==1 then (.targets + {carried_at:$at, carried:true}) else {volumes:$targets_volumes, bytes:$targets_bytes, sha256:$targets_sha, mode:$tgt_mode, fp:$tgt_fp} end) |
                  (if $rec_ok==1 then .records={volumes:$records_volumes, bytes:$records_bytes, sha256:$records_sha} else del(.records) end)' \
                 "$OUT/meta.env-carry.json" > "$OUT/meta.json" 2>/dev/null \
              && [ -s "$OUT/meta.json" ] && jq -e '(.env.bytes // 0) > 0' "$OUT/meta.json" >/dev/null 2>&1; then
              mkdir -p "$OUT/stage"
              for f in "$OUT"/records.tar.gz.* "$OUT/meta.json"; do
                [ -f "$f" ] || continue
                cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
              done
              if [ "${CARRY:-0}" != 1 ]; then
                for f in "$OUT"/targets.tar.gz.*; do
                  [ -f "$f" ] || continue
                  cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
                done
              fi
              stage_ok=0
              if upload_par "$OUT"/stage/* || gh release upload "$ENV_TAG" "$OUT"/stage/* --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
                stage_ok=1
                for f in "$OUT"/stage/stage-*; do
                  n=$(basename "$f"); l=$(stat -c%s "$f")
                  r=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq ".assets[] | select(.name==\"$n\") | .size")
                  if [ "$l" = "$r" ]; then
                    echo "staged ok $n = $l bytes"
                  else
                    stage_ok=0
                    echo "::warning::staged size mismatch $n ($l vs $r)"
                  fi
                done
              else
                echo "::warning::staged upload failed; the previous packages are left untouched"
              fi
              if [ "$stage_ok" -eq 1 ]; then
                if [ "${CARRY:-0}" = 1 ]; then
                  DELPAT='^records\.tar\.gz(\.|$)|^meta\.json$'
                else
                  DELPAT='^records\.tar\.gz(\.|$)|^targets\.tar\.gz(\.|$)|^meta\.json$'
                fi
                mapfile -t DELOLD < <(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                  | grep -E "$DELPAT" || true)
                for a in ${DELOLD[@]+"${DELOLD[@]}"}; do
                  gh release delete-asset "$ENV_TAG" "$a" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 &
                done
                wait
                UPF=()
                for f in "$OUT"/records.tar.gz.*; do [ -f "$f" ] && UPF+=("$f"); done
                if [ "${CARRY:-0}" != 1 ]; then
                  for f in "$OUT"/targets.tar.gz.*; do [ -f "$f" ] && UPF+=("$f"); done
                fi
                up_ok=1
                if [ "${#UPF[@]}" -gt 0 ]; then
                  upload_par "${UPF[@]}" || gh release upload "$ENV_TAG" "${UPF[@]}" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 || up_ok=0
                else
                  up_ok=0
                fi
                if [ "$up_ok" = 1 ]; then
                  if [ -s "$OUT/meta.json" ]; then
                    gh release upload "$ENV_TAG" "$OUT/meta.json" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 \
                      || echo "::warning::failed to upload meta.json (readers will fall back to unverified extract)"
                  fi
                  if [ "${CARRY:-0}" = 1 ]; then
                    echo "target workspace package carried (unchanged); records refreshed"
                  else
                    echo "target workspace package updated (env from env-sync branch; retained release env kept as fallback)"
                  fi
                  echo "package manifest: split=$SPLIT_SIZE env=carried targets=$TGT_N vol carry=${CARRY:-0} records=$REC_N vol"
                else
                  echo "::warning::failed to upload targets/records packages to release"
                fi
                for f in "$OUT"/stage/stage-*; do
                  gh release delete-asset "$ENV_TAG" "$(basename "$f")" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 \
                    && echo "staged copy removed: $(basename "$f")" &
                done
                wait
              fi
            else
              echo "::warning::meta rewrite failed; leaving the release untouched (targets stay previous generation)"
            fi
          else
            echo "::warning::environment package is empty"
          fi
          echo "snapshot timing: publish $(( $(date +%s) - UP_T0 ))s, total $(( $(date +%s) - SNAP_T0 ))s"
          # R2576 (D9): report the complete non-opencode wall time for this run:
          # setup (job start → OpenCode start) + post-run (failure policy +
          # relay + notify + snapshot). Target <60s.
          POST_T0="${POST_OPENCODE_T0:-0}"
          OPEN_START_T0="${OPENCODE_START_T0:-0}"
          if [ "$POST_T0" -gt 0 ] 2>/dev/null && [ "$OPEN_START_T0" -gt 0 ] 2>/dev/null \
             && [ -n "${PRE_OPENCODE_T0:-}" ]; then
            PRE_S=$(( OPEN_START_T0 - PRE_OPENCODE_T0 ))
            POST_S=$(( $(date +%s) - POST_T0 ))
            TOTAL_S=$(( PRE_S + POST_S ))
            echo "non-opencode timing: total ${TOTAL_S}s (setup ${PRE_S}s + post-run ${POST_S}s; target <60s)"
            if [ "$TOTAL_S" -gt 60 ]; then
              echo "::warning::non-opencode CI time ${TOTAL_S}s exceeds the 60s target (setup ${PRE_S}s + post-run ${POST_S}s)"
            fi
          else
            echo "::warning::non-opencode timing unavailable (missing PRE_OPENCODE_T0/OPENCODE_START_T0/POST_OPENCODE_T0)"
          fi
          rm -rf "$OUT"

      - name: Rebuild repository baseline
        if: always() && github.event.inputs.smoke != 'true' && steps.lock.outputs.acquired == 'true' && inputs.reset_baseline
        run: |
          set +e
          cd "$SESSIONS_DIR"
          git checkout --detach HEAD >/dev/null 2>&1 || true
          git branch -D baseline-reset >/dev/null 2>&1 || true
          git checkout --orphan baseline-reset >/dev/null 2>&1
          rm -rf opencode/data
          mkdir -p opencode/data
          touch opencode/data/.gitkeep
          rm -rf sessions state tasks workspace-snapshots loop-state.md
          rm -f opencode/config/tg-chats.json opencode/config/tg-chats-bot*.json \
                opencode/config/loop-ctl.json opencode/config/loop-marker.json \
                opencode/config/tg-bots.json opencode/config/loop-guard.json \
                opencode/config/loop-sessions.json opencode/config/model-windows.json \
                opencode/config/abort-events.json opencode/config/inject-card-*.json \
                opencode/config/botname-*.json opencode/config/egress-blacklist.json \
                opencode/config/egress-usage.json \
                opencode/config/exit-proxy.json
          {
            echo '# Runtime state lives in the env release, not in git.'
            echo 'opencode/data/*'
            echo '!opencode/data/.gitkeep'
            echo 'sessions/'
            echo 'state/'
            echo 'tasks/'
            echo 'workspace-snapshots/'
            echo 'loop-state.md'
            echo 'opencode/config/tg-chats*.json'
            echo 'opencode/config/tg-bots.json'
            echo 'opencode/config/loop-ctl.json'
            echo 'opencode/config/loop-marker.json'
            echo 'opencode/config/loop-guard.json'
            echo 'opencode/config/loop-sessions.json'
            echo 'opencode/config/model-windows.json'
            echo 'opencode/config/abort-events.json'
            echo 'opencode/config/inject-card-*.json'
            echo 'opencode/config/halt-release.json*'
            echo 'opencode/config/botname-*.json*'
            echo 'opencode/config/egress-blacklist.json*'
            echo 'opencode/config/egress-usage.json*'
            echo 'opencode/config/exit-proxy.json*'
            echo 'opencode/config/service.json*'
            echo 'opencode/config/tg-bot*.env'
            echo 'opencode/config/tg.env'
            echo 'opencode/home.tar.gz*'
          } > .gitignore
          git add -A
          git -c user.name="opencode-ci" -c user.email="opencode-ci@users.noreply.github.com" \
            commit -q -m "baseline: clean initial state ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            || echo "::warning::nothing to commit"
          git branch -M baseline-reset main
          for attempt in 1 2 3 4 5; do
            if git push --force origin main; then
              echo "baseline pushed (single commit)"
              break
            fi
            echo "::warning::baseline push attempt $attempt failed; retrying"
            sleep 4
          done
          git tag -f baseline >/dev/null 2>&1
          for attempt in 1 2 3 4 5; do
            if git push --force origin refs/tags/baseline; then
              echo "baseline tag pushed"
              break
            fi
            echo "::warning::baseline tag push attempt $attempt failed; retrying"
            sleep 4
          done