name: iterate

on:
  workflow_dispatch:
    inputs:
      resume:
        description: Resume the previous run from saved state
        type: boolean
        required: false
        default: true
      budget_seconds:
        description: OpenCode run budget in seconds (default ~5h30m; max job is 6h)
        type: string
        required: false
        default: "19800"
      reset_baseline:
        description: Rewrite the repository back to its clean initial baseline (runtime state stays in the release)
        type: boolean
        required: false
        default: false
      split_size:
        description: Max bytes per release asset when paging the packages (GitHub allows up to 2GiB per asset; smaller pages upload in parallel — default 256m, e.g. 1500m for single-stream)
        type: string
        required: false
        default: "256m"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: iterate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.CROSS_PAT }}
  SESSIONS_REPO: ${{ vars.SESSIONS_REPO }}
  SESSIONS_DIR: /home/runner/work/sessions
  TARGETS_DIR: /home/runner/work/targets

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out ci-repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI and configure git
        run: |
          set -euo pipefail
          # R341: ubuntu-latest ships gh (measured 2.102.0); the apt dance below only
          # exists for images without it. Measured cost when needlessly run: ~8s of
          # `apt-get update` on every boot. Keep the installer as the fallback path.
          if ! command -v gh >/dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            key=$(mktemp)
            wget -nv -O"$key" https://cli.github.com/packages/githubcli-archive-keyring.gpg
            sudo install -m 0644 "$key" /etc/apt/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -y
            sudo apt-get install -y gh
          else
            echo "gh already installed: $(gh --version | head -1)"
          fi
          gh auth setup-git
          git config --global user.name "opencode-ci"
          git config --global user.email "opencode-ci@users.noreply.github.com"

      - name: Clone sessions repository
        run: |
          set -euo pipefail
          if [ ! -d "$SESSIONS_DIR/.git" ]; then
            mkdir -p "$(dirname "$SESSIONS_DIR")"
            gh repo clone "$SESSIONS_REPO" "$SESSIONS_DIR"
          fi
          mkdir -p "$SESSIONS_DIR/state" "$SESSIONS_DIR/tasks" "$SESSIONS_DIR/sessions" "$SESSIONS_DIR/workspace-snapshots"
          [ -f "$SESSIONS_DIR/workspace-snapshots/index.json" ] || echo '{"snapshots": []}' > "$SESSIONS_DIR/workspace-snapshots/index.json"

      - name: Acquire lock
        id: lock
        run: |
          # Runs are serialized by the workflow-level `concurrency` group, so no
          # cross-run lock file is needed. The step id/output are kept so downstream
          # `if:` guards stay simple. A committed lock file used to deadlock the loop
          # whenever a push failed; removing it removes that whole failure class.
          echo "acquired=true" >> "$GITHUB_OUTPUT"

      - name: Prepare target workspace
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TARGETS_DIR"

      - name: Restore workspace snapshots
        id: restore_ws
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set +e
          # Target workspace bundles also live in the release now (a whole tar of the
          # repo's runtime dirs), not in git, so the repository can stay a clean baseline.
          ENV_TAG="env"
          # ROUND 35（降级读取策略，与 env 包同口径）：页按 `sort -V` 定序；有 meta.json 时先核对
          # 拼接字节数，不一致则拒绝应用（宁可用克隆里的 git 版本，也不铺半套 targets）；
          # 压缩格式按魔数判定；manifest 缺失 ⇒ 退回旧的无校验直解。
          # ROUND 44：同 env 读侧——主包不可用时改从保险 tag 'env-safe' 还原，避免撕裂包铺半套/空 targets。
          FALLBACK_TAG="${SESSIONS_FALLBACK_TAG:-env-safe}"
          tgt_try() {
            local tag="$1" dl="/tmp/tgdl-$1" vols pages bytes expect hdr tflag
            rm -rf "$dl" && mkdir -p "$dl"
            # R341: parallel multi-range fetch; the helper itself falls back to
            # plain single-stream `gh release download` on any internal failure.
            bash "$GITHUB_WORKSPACE/.github/scripts/fetch-asset.sh" "$SESSIONS_REPO" "$tag" 'targets.tar.gz*' "$dl" || return 1
            ls "$dl"/targets.tar.gz* >/dev/null 2>&1 || return 1
            gh release download "$tag" --repo "$SESSIONS_REPO" --pattern 'meta.json' --dir "$dl" --clobber >/dev/null 2>&1 || true
            vols=$(ls "$dl"/targets.tar.gz* 2>/dev/null | sort -V)
            pages=$(echo "$vols" | wc -l)
            bytes=$(cat $vols 2>/dev/null | wc -c)
            expect=$(jq -r '.targets.bytes // empty' "$dl/meta.json" 2>/dev/null || true)
            if [ -n "$expect" ] && [ "$bytes" != "$expect" ]; then
              echo "::warning::$tag targets package incomplete ($bytes of $expect bytes, $pages page(s)); refusing to apply a partial restore"
              return 1
            fi
            hdr=$(head -c 6 "$(echo "$vols" | head -1)" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            case "$hdr" in
              1f8b*)        tflag="-z" ;;
              fd377a585a00) tflag="-J" ;;
              28b52ffd*)    tflag="--zstd" ;;
              425a68*)      tflag="-j" ;;
              *)            tflag="" ;;
            esac
            if cat $vols | tar -xf - -C "$SESSIONS_DIR" $tflag 2>/dev/null; then
              echo "target workspace package restored from '$tag' ($pages page(s), $bytes bytes, tar ${tflag:-plain}${expect:+, size-verified})"
              return 0
            fi
            echo "::warning::$tag target workspace package failed to extract (tar ${tflag:-plain}, $bytes bytes)"
            return 1
          }
          # ROUND 53：与 env 读侧同口径——换装窗口里 targets 也可能只剩 stage-*；
          # 用 stage-targets.tar.gz* + stage-meta.json 严格校验后再应用，否则退回 env-safe。
          tgt_try_staged() {
            local tag="$1" dl="/tmp/tgdl-$1-staged" vols pages bytes expect hdr tflag
            rm -rf "$dl" && mkdir -p "$dl"
            bash "$GITHUB_WORKSPACE/.github/scripts/fetch-asset.sh" "$SESSIONS_REPO" "$tag" 'stage-targets.tar.gz*' "$dl" || return 1
            ls "$dl"/stage-targets.tar.gz* >/dev/null 2>&1 || return 1
            gh release download "$tag" --repo "$SESSIONS_REPO" --pattern 'stage-meta.json' --dir "$dl" --clobber >/dev/null 2>&1 || true
            expect=$(jq -r '.targets.bytes // empty' "$dl/stage-meta.json" 2>/dev/null || true)
            if [ -z "$expect" ]; then
              echo "::warning::$tag staged targets have no manifest; refusing an unverifiable staged restore"
              return 1
            fi
            vols=$(ls "$dl"/stage-targets.tar.gz* 2>/dev/null | sort -V)
            pages=$(echo "$vols" | wc -l)
            bytes=$(cat $vols 2>/dev/null | wc -c)
            if [ "$bytes" != "$expect" ]; then
              echo "::warning::$tag staged targets incomplete ($bytes of $expect bytes, $pages page(s)); refusing"
              return 1
            fi
            hdr=$(head -c 6 "$(echo "$vols" | head -1)" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            case "$hdr" in
              1f8b*)        tflag="-z" ;;
              fd377a585a00) tflag="-J" ;;
              28b52ffd*)    tflag="--zstd" ;;
              425a68*)      tflag="-j" ;;
              *)            tflag="" ;;
            esac
            if cat $vols | tar -xf - -C "$SESSIONS_DIR" $tflag 2>/dev/null; then
              echo "target workspace package restored from '$tag' verified staged generation ($pages page(s), $bytes bytes, tar ${tflag:-plain})"
              return 0
            fi
            echo "::warning::$tag staged targets failed to extract ($pages page(s), $bytes bytes)"
            return 1
          }
          if tgt_try "$ENV_TAG"; then
            :
          elif tgt_try_staged "$ENV_TAG"; then
            echo "::warning::primary targets were mid-swap; restored the verified staged generation"
          elif [ "$FALLBACK_TAG" != "$ENV_TAG" ] && tgt_try "$FALLBACK_TAG"; then
            echo "::warning::primary targets package '$ENV_TAG' unusable; restored the insurance generation '$FALLBACK_TAG'"
          fi
          # ROUND 34 (D6): the target-workspace package is built at the END of a run, so right
          # after an aborted/cancelled run it is OLDER than the fresh clone of the sessions repo.
          # Extracting it above would then downgrade the *tracked* knowledge dirs in the working
          # tree (state/ tasks/ sessions/), and the next agent could re-commit that as a revert.
          # `workspace-snapshots/` is deliberately left as the package provided it: its index.json
          # and the target bundles are runtime artifacts that must stay mutually consistent.
          #
          # ROUND 77: records are no longer tracked in the sessions repo (the operator's model:
          # the release targets package is the authority for records, the repo tree is a clean
          # reset baseline). Only re-assert from git while those dirs are actually tracked;
          # otherwise the package content must stay in place and there is nothing to warn about.
          if [ -d "$SESSIONS_DIR/.git" ] \
             && git -C "$SESSIONS_DIR" ls-files --error-unmatch state >/dev/null 2>&1; then
            git -C "$SESSIONS_DIR" checkout -- state tasks sessions 2>/dev/null \
              || echo "::warning::could not re-assert tracked knowledge dirs (state/tasks/sessions) from git"
          fi
          INDEX="$SESSIONS_DIR/workspace-snapshots/index.json"
          [ -f "$INDEX" ] || exit 0
          # R342（Stage C：目录直存快照）：targets 包现在直接携带目标工作区**整目录**
          # （tar 根下 <name>，含 .git），解包后落在 $SESSIONS_DIR/<name>；同文件系统
          # mv 瞬时完成。旧格式（bundle 克隆）实测 1.4GB 包 CPU 密集约 72s，是本步最大
          # 单项；目录直存恢复实测约 11s，且还原度更高（含未跟踪/被忽略文件、stash ref）。
          while IFS= read -r snap_name; do
            [ -n "$snap_name" ] || continue
            if [ -d "$SESSIONS_DIR/$snap_name/.git" ] && [ ! -e "$TARGETS_DIR/$snap_name" ]; then
              mv "$SESSIONS_DIR/$snap_name" "$TARGETS_DIR/$snap_name" \
                && echo "target workspace $snap_name restored from its directory snapshot"
            fi
          done < <(jq -r '.snapshots[]? | select(.mode == "dirtar") | .dir // empty' "$INDEX" 2>/dev/null)
          # R342（records 独立资产，每轮刷新）：targets 包内嵌一份 records（兼容旧读侧），
          # 另有独立 records 资产——targets 内容未变时会被原样沿用，records 却必须每轮
          # 更新。这里优先覆盖为独立资产的最新副本：先解到临时目录并验证完整，再替换；
          # 任何失败都保留包内嵌副本，绝不半途清空记录。
          RDL=/tmp/rec-dl; rm -rf "$RDL"; mkdir -p "$RDL"
          if bash "$GITHUB_WORKSPACE/.github/scripts/fetch-asset.sh" "$SESSIONS_REPO" "$ENV_TAG" 'records.tar.gz*' "$RDL" 2>/dev/null \
             && ls "$RDL"/records.tar.gz* >/dev/null 2>&1; then
            gh release download "$ENV_TAG" --repo "$SESSIONS_REPO" --pattern 'meta.json' --dir "$RDL" --clobber >/dev/null 2>&1 || true
            REXP=$(jq -r '.records.bytes // empty' "$RDL/meta.json" 2>/dev/null || true)
            RVOLS=$(ls "$RDL"/records.tar.gz* 2>/dev/null | sort -V)
            RBYTES=$(cat $RVOLS 2>/dev/null | wc -c)
            if [ -n "$REXP" ] && [ "$RBYTES" = "$REXP" ]; then
              RX=/tmp/rec-x; rm -rf "$RX"; mkdir -p "$RX"
              if cat $RVOLS | tar -xzf - -C "$RX" 2>/dev/null \
                 && [ -d "$RX/state" ] && [ -d "$RX/tasks" ] && [ -d "$RX/sessions" ]; then
                rm -rf "$SESSIONS_DIR/state" "$SESSIONS_DIR/tasks" "$SESSIONS_DIR/sessions" "$SESSIONS_DIR/loop-state.md"
                cp -a "$RX"/. "$SESSIONS_DIR"/ 2>/dev/null
                echo "records overlaid from the standalone records asset ($RBYTES bytes)"
              else
                echo "::warning::records asset incomplete (state/tasks/sessions missing); keeping the embedded copy"
              fi
            else
              echo "::warning::records asset unverified (bytes=$RBYTES expect=${REXP:-none}); keeping the embedded copy"
            fi
          fi
          COUNT=$(jq '.snapshots | length' "$INDEX")
          for i in $(seq 0 $((COUNT - 1))); do
            dir=$(jq -r ".snapshots[$i].dir // empty" "$INDEX")
            bundle=$(jq -r ".snapshots[$i].bundle // empty" "$INDEX")
            worktree=$(jq -r ".snapshots[$i].worktree // empty" "$INDEX")
            branch=$(jq -r ".snapshots[$i].branch // empty" "$INDEX")
            commit=$(jq -r ".snapshots[$i].commit // empty" "$INDEX")
            repo=$(jq -r ".snapshots[$i].repo // empty" "$INDEX")
            [ -n "$dir" ] || continue
            target_dir="$TARGETS_DIR/$dir"
            [ -e "$target_dir" ] && continue
            # R203（D6 还原链缺口）：快照 bundle 克隆失败时**退回远端**再试一次。
            # 背景：`git bundle create` 对 **shallow 仓**（`git clone --depth N`）会造出无法
            # 独立克隆的包（实测 proxyip：`Could not read <oid>` / `remote did not send all
            # necessary objects`），而这里原先只打一句 warning 就 skip ⇒ 换 runner 时该目标
            # 工作区**整个缺失**（R202 实测：那一代靠代理自己从 GitHub clone 才补回）。
            # 只影响失败路径：bundle 正常时行为与本补丁前完全一致。
            if ! git clone "$SESSIONS_DIR/$bundle" "$target_dir"; then
              rm -rf "$target_dir"
              if [ -z "$repo" ] || ! git clone "$repo" "$target_dir"; then
                echo "::warning::clone failed for $dir (bundle and remote), skipping"
                continue
              fi
              echo "::warning::bundle clone failed for $dir; recovered from remote $repo (shallow snapshot)"
            fi
            (
              set +e
              cd "$target_dir" || exit 0
              if [ -n "$branch" ]; then
                git checkout "$branch" 2>/dev/null \
                  || git checkout -b "$branch" "origin/$branch" 2>/dev/null \
                  || echo "::warning::branch $branch missing for $dir, staying on default"
              fi
              if [ -n "$commit" ]; then
                git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout "$commit" 2>/dev/null || true
              fi
              git fetch origin '+refs/stash:refs/stash' 2>/dev/null || true
              # R203：`worktree.tar.gz` 缺失是**良性**的（`workferry pack` 对干净仓不产出
              # 文件）⇒ 路径为空/文件不存在时静默跳过，不再每轮打一条误导告警。
              if [ -n "$worktree" ] && [ -f "$SESSIONS_DIR/$worktree" ] \
                && ! workferry apply --dir "$target_dir" "$SESSIONS_DIR/$worktree"; then
                echo "::warning::workferry apply failed for $dir, untracked files may be lost"
              fi
              if git rev-parse --verify refs/stash >/dev/null 2>&1; then
                STASH_SHA=$(git rev-parse refs/stash)
                git stash apply --index "$STASH_SHA" 2>/dev/null \
                  || echo "::warning::stash apply failed for $dir, staged state may be incomplete"
              fi
              if [ -n "$repo" ]; then
                git remote set-url origin "$repo"
              fi
            )
          done

      - name: Restore environment and install bridge from sessions repository
        id: restore_env
        if: steps.lock.outputs.acquired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT: ${{ secrets.TG_ALLOWED_CHAT }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
          TG_BOT3_TOKEN: ${{ secrets.TG_BOT3_TOKEN }}
          TG_BOT4_TOKEN: ${{ secrets.TG_BOT4_TOKEN }}
        run: |
          set -euo pipefail
          ENV_SRC="$SESSIONS_DIR/opencode"
          mkdir -p "$HOME/.config" "$HOME/.local/share" "$HOME/.opencode"
          ENV_TAG="env"

          # 1. Restore the WHOLE persisted environment from the release. It is a full
          #    package of $HOME (a complete tar, not a delta/overlay), so files the agent
          #    put ANYWHERE come back - including files copied or moved with old
          #    timestamps, which a "changed-since-the-last-run" scan would silently miss.
          #    Exclusions are only reinstallable caches, the work/ tree, the opencode
          #    binary, server logs and secrets.
          # ROUND 35（降级读取策略）：包可能按「1..N 页 + meta.json」上传（现默认 1500m ⇒ 大包也只占一页），
          # 也可能是旧的 90 MiB 多页、甚至无 manifest 的旧包。读侧分三层：
          #   ① 页集合按 `sort -V` 定序（`.aa/.ab` 与 `.000/.001` 都能排对）；
          #   ② 若有 meta.json，先比对拼接字节数；**不一致就拒绝应用**（半套 $HOME 比不还原本更糟）
          #      并给出可操作告警；manifest 缺失/不可解析 ⇒ 退回旧行为（不校验直接解 = 降级）；
          #   ③ 压缩格式由**魔数**判定（gzip/xz/zstd/bzip2/未压缩），不再写死 gzip。
          # ROUND 44（防数据丢失，关键）：旧版「先删光资产、再上传」的写侧一旦被取消切在中间，
          # 就会留下「新卷 + 旧 meta.json」的**撕裂包**；此时旧读侧只告警然后 bootstrap **空环境**
          # ⇒ 会话库/桥聊天整体丢失（实测：run 39097256929 被取消 → run 39103651786 读到撕裂包 →
          # 空 DB → 会话 ses_eb626522 消失）。现在：主包 'env' 不可用 ⇒ 改从**保险 tag** 'env-safe'
          # 还原；两者都不可用才 bootstrap。env-safe 由运营者的 env-backup.sh 维护为「最近一次完好代」。
          FALLBACK_TAG="${SESSIONS_FALLBACK_TAG:-env-safe}"
          env_try() {
            local tag="$1" dl="/tmp/envdl-$1" vols pages bytes expect hdr tflag
            rm -rf "$dl" && mkdir -p "$dl"
            bash "$GITHUB_WORKSPACE/.github/scripts/fetch-asset.sh" "$SESSIONS_REPO" "$tag" 'env.tar.gz*' "$dl" || return 1
            ls "$dl"/env.tar.gz* >/dev/null 2>&1 || return 1
            gh release download "$tag" --repo "$SESSIONS_REPO" --pattern 'meta.json' --dir "$dl" --clobber >/dev/null 2>&1 || true
            vols=$(ls "$dl"/env.tar.gz* 2>/dev/null | sort -V)
            pages=$(echo "$vols" | wc -l)
            bytes=$(cat $vols 2>/dev/null | wc -c)
            expect=$(jq -r '.env.bytes // empty' "$dl/meta.json" 2>/dev/null || true)
            if [ -n "$expect" ] && [ "$bytes" != "$expect" ]; then
              echo "::warning::$tag package incomplete ($bytes of $expect bytes, $pages page(s)); refusing to apply a partial restore"
              return 1
            fi
            hdr=$(head -c 6 "$(echo "$vols" | head -1)" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            case "$hdr" in
              1f8b*)        tflag="-z" ;;
              fd377a585a00) tflag="-J" ;;
              28b52ffd*)    tflag="--zstd" ;;
              425a68*)      tflag="-j" ;;
              *)            tflag="" ;;
            esac
            if cat $vols | tar -xf - -C "$HOME" $tflag 2>/dev/null; then
              echo "environment restored from release '$tag' ($pages page(s), $bytes bytes, tar ${tflag:-plain}${expect:+, size-verified})"
              return 0
            fi
            echo "::warning::$tag package failed to extract (tar ${tflag:-plain}, $bytes bytes)"
            return 1
          }
          # ROUND 53（取消序列防丢失）：R42 原子换装的窗口（旧代已删、真名新代尚未上传）里，
          # release 只剩 stage-* 资产——而那是**已逐个校验过尺寸的当前代**。旧读侧此时会直接
          # 退回 env-safe（可能落后数小时 ⇒ 丢最近会话）。新增：真名代不可用时改试 stage 代；
          # stage 必须带 stage-meta.json 且字节数完全吻合，半套/无 manifest 的 stage 一律拒绝
          # （宁可用旧的 env-safe，也绝不铺半套 $HOME）。
          env_try_staged() {
            local tag="$1" dl="/tmp/envdl-$1-staged" vols pages bytes expect hdr tflag
            rm -rf "$dl" && mkdir -p "$dl"
            bash "$GITHUB_WORKSPACE/.github/scripts/fetch-asset.sh" "$SESSIONS_REPO" "$tag" 'stage-env.tar.gz*' "$dl" || return 1
            ls "$dl"/stage-env.tar.gz* >/dev/null 2>&1 || return 1
            gh release download "$tag" --repo "$SESSIONS_REPO" --pattern 'stage-meta.json' --dir "$dl" --clobber >/dev/null 2>&1 || true
            expect=$(jq -r '.env.bytes // empty' "$dl/stage-meta.json" 2>/dev/null || true)
            if [ -z "$expect" ]; then
              echo "::warning::$tag staged generation has no manifest; refusing an unverifiable staged restore"
              return 1
            fi
            vols=$(ls "$dl"/stage-env.tar.gz* 2>/dev/null | sort -V)
            pages=$(echo "$vols" | wc -l)
            bytes=$(cat $vols 2>/dev/null | wc -c)
            if [ "$bytes" != "$expect" ]; then
              echo "::warning::$tag staged generation incomplete ($bytes of $expect bytes, $pages page(s)); refusing"
              return 1
            fi
            hdr=$(head -c 6 "$(echo "$vols" | head -1)" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            case "$hdr" in
              1f8b*)        tflag="-z" ;;
              fd377a585a00) tflag="-J" ;;
              28b52ffd*)    tflag="--zstd" ;;
              425a68*)      tflag="-j" ;;
              *)            tflag="" ;;
            esac
            if cat $vols | tar -xf - -C "$HOME" $tflag 2>/dev/null; then
              echo "environment restored from '$tag' verified staged generation ($pages page(s), $bytes bytes, tar ${tflag:-plain})"
              return 0
            fi
            echo "::warning::$tag staged generation failed to extract ($pages page(s), $bytes bytes)"
            return 1
          }
          # ROUND 278（运营者「快照优化」— restore 侧）：env-sync 分支是**首选** env 源。
          # 运行中插件每 5 分钟 + 保存步 run-end 推终态；校验「克隆/manifest/硬上限
          # ENV_SYNC_MAX_AGE_MIN（默认 24h）/db 字节数」全过才应用，并与 release 比新鲜：
          # release 的**实际打包时刻**（未携带⇒created_at；携带⇒env.packed_at）若晚于
          # 分支 tip 则让位 release；否则取分支（两者中较新者）。任一不满足即整体回落
          # 原 release 三层链（env → stage-env → env-safe → bootstrap），语义不变。
          ENV_SYNC_MAX_AGE_MIN="${ENV_SYNC_MAX_AGE_MIN:-1440}"
          env_sync_try() {
            local repo="${SESSIONS_REPO:-Xiaobei09/opencode-sessions}"
            local d="/tmp/envsync-restore" json epoch age dbfmt dbexp dbsz
            local carried rel_at rel_epoch
            rm -rf "$d" 2>/dev/null
            if ! git clone --depth 1 --single-branch --branch env-sync \
                  "https://github.com/$repo.git" "$d" >/dev/null 2>&1; then
              echo "::warning::env-sync branch not available; using release packages"
              return 1
            fi
            json="$d/env-sync.json"
            if [ ! -s "$json" ] || [ ! -d "$d/payload/.config/opencode" ]; then
              echo "::warning::env-sync payload missing or incomplete; using release packages"
              return 1
            fi
            epoch=$(jq -r '.epoch // empty' "$json" 2>/dev/null || true)
            case "$epoch" in (*[!0-9]*|'') echo "::warning::env-sync manifest epoch invalid; using release packages"; return 1;; esac
            age=$(( ( $(date +%s) - epoch ) / 60 ))
            if [ "$age" -gt "$ENV_SYNC_MAX_AGE_MIN" ]; then
              echo "::warning::env-sync branch too old (${age}min > ${ENV_SYNC_MAX_AGE_MIN}min cap); using release packages"
              return 1
            fi
            gh release download "$ENV_TAG" --repo "$repo" --pattern 'meta.json' --dir "$d" --clobber >/dev/null 2>&1 || true
            if [ -s "$d/meta.json" ]; then
              carried=$(jq -r '.env.carried // false' "$d/meta.json" 2>/dev/null || echo false)
              if [ "$carried" = "true" ]; then
                rel_at=$(jq -r '.env.packed_at // empty' "$d/meta.json" 2>/dev/null || true)
              else
                rel_at=$(jq -r '.created_at // empty' "$d/meta.json" 2>/dev/null || true)
              fi
              rel_epoch=$(date -u -d "$rel_at" +%s 2>/dev/null || true)
              if [ -n "$rel_epoch" ] && [ "$rel_epoch" -gt "$epoch" ]; then
                echo "::warning::release env (packed ${rel_at}) is newer than the branch tip; using release packages"
                return 1
              fi
            fi
            dbfmt=$(jq -r '.db_format // "raw"' "$json" 2>/dev/null || echo raw)
            dbexp=$(jq -r '.db_bytes // 0' "$json" 2>/dev/null || echo 0)
            case "$dbexp" in (*[!0-9]*) dbexp=0;; esac
            if [ "$dbfmt" = "chunks" ]; then
              cat "$d"/payload/.local/share/opencode/opencode.db.[0-9][0-9].part \
                > "$d"/payload/.local/share/opencode/opencode.db 2>/dev/null || return 1
              rm -f "$d"/payload/.local/share/opencode/opencode.db.[0-9][0-9].part 2>/dev/null
            fi
            dbsz=$(stat -c%s "$d/payload/.local/share/opencode/opencode.db" 2>/dev/null || echo 0)
            if [ "${dbexp:-0}" -gt 0 ] && [ "$dbsz" != "$dbexp" ]; then
              echo "::warning::env-sync db size mismatch (${dbsz} vs ${dbexp}); using release packages"
              return 1
            fi
            if ! rsync -a "$d"/payload/ "$HOME"/ 2>/dev/null; then
              echo "::warning::env-sync payload apply failed; using release packages"
              return 1
            fi
            rm -rf "$d" 2>/dev/null
            echo "environment restored from env-sync branch (age=${age}min, db=${dbfmt} ${dbsz} bytes)"
            return 0
          }
          if env_sync_try; then
            echo "environment source: env-sync"
          elif env_try "$ENV_TAG"; then
            echo "environment source: $ENV_TAG"
          elif env_try_staged "$ENV_TAG"; then
            echo "::warning::primary env was mid-swap; restored the verified staged generation (skipped the stale env-safe)"
          elif [ "$FALLBACK_TAG" != "$ENV_TAG" ] && env_try "$FALLBACK_TAG"; then
            echo "::warning::primary env package '$ENV_TAG' unusable; restored the insurance generation '$FALLBACK_TAG'"
          else
            echo "no usable environment package; bootstrapping from the repository baseline"
          fi

          # 2. The repository is the clean baseline and stays authoritative for the
          #    bridge CODE. Copy it in (except the runtime-state files, which come from
          #    the release) so code updates always take effect over a restored env.
          #    ROUND 48（真缺陷修复）：跳过表原只列了 5 个文件，其余运行态文件仍被无条件
          #    从仓库覆盖到运行态 ⇒ 每轮启动都会用**仓库里那份陈旧状态**盖掉刚从 release
          #    还原的**实时状态**（实测：loop-sessions 被盖回 3 会话、漏掉已还原的
          #    ses_eb24bf12；inject-card 被盖回旧 session/旧计数；loop-guard 每次被盖回
          #    problem:true）。把这些运行态文件一并纳入跳过表，改为「缺失才播种」（见下）。
          if [ -d "$ENV_SRC/config" ]; then
            mkdir -p "$HOME/.config/opencode"
            for f in "$ENV_SRC"/config/*; do
              [ -e "$f" ] || continue
              case "$(basename "$f")" in
                tg-chats.json|tg-chats-bot*.json|tg-bots.json|loop-ctl.json|loop-marker.json|\
                loop-guard.json|loop-sessions.json|model-windows.json|abort-events.json|\
                inject-card-*.json|botname-*.json|service.json|tg-bot*.env|tg.env) continue ;;
              esac
              cp -a "$f" "$HOME/.config/opencode/" 2>/dev/null || true
            done
          fi
          # First run only (no release yet): seed runtime state from the repo so the
          # existing sessions are not dropped while migrating to release storage.
          if [ ! -e "$HOME/.local/share/opencode/opencode.db" ] && [ -d "$ENV_SRC/data" ]; then
            mkdir -p "$HOME/.local/share/opencode"
            cp -a "$ENV_SRC/data/." "$HOME/.local/share/opencode/" 2>/dev/null || true
          fi
          if [ ! -f "$HOME/.config/opencode/tg-chats.json" ] && [ -f "$ENV_SRC/config/tg-chats.json" ]; then
            cp -a "$ENV_SRC/config/tg-chats.json" "$HOME/.config/opencode/" 2>/dev/null || true
          fi
          # ROUND 48：运行态文件一律「缺失才播种」（绝不覆盖 release 还原的实时状态）。
          for j in loop-ctl.json loop-marker.json service.json \
                   loop-guard.json loop-sessions.json model-windows.json \
                   abort-events.json botname-sig.json; do
            [ -f "$HOME/.config/opencode/$j" ] || cp -a "$ENV_SRC/config/$j" "$HOME/.config/opencode/" 2>/dev/null || true
          done
          # Plugin libraries also resolve under ~/.opencode/v2lib.
          # ROUND 19：**目标目录必然已存在**（由 env release 还原），此时裸 `cp -a src dst`
          # 会把源目录**嵌套**进目标（→ ~/.opencode/v2lib/v2lib），而插件真正加载的
          # ~/.opencode/v2lib/*.ts 保持旧内容 → **仓库代码改动在每次重启后都不生效**
          # （与"repo 对桥代码权威"的注释相反，实测 mtime 停在旧的 env 还原时间）。
          # 改为复制**目录内容**，并清掉历史嵌套产物。
          mkdir -p "$HOME/.opencode"
          if [ -d "$ENV_SRC/config/v2lib" ]; then
            cp -a "$ENV_SRC/config/v2lib/." "$HOME/.opencode/v2lib/" 2>/dev/null || true
            rm -rf "$HOME/.opencode/v2lib/v2lib" 2>/dev/null || true
          fi
          # ROUND 63: prove the repo→runtime code sync actually took effect.
          # If it silently does not (nested `cp -a`, wrong path, stale extraction),
          # the plugin boots the **snapshot's** old code and every repo fix looks
          # like it did nothing — a failure mode that costs whole restart cycles
          # to diagnose. Compare byte-for-byte and fail loudly instead.
          for d in "$HOME/.config/opencode/v2lib" "$HOME/.opencode/v2lib"; do
            [ -f "$ENV_SRC/config/v2lib/auto-continue.ts" ] || break
            [ -d "$d" ] || continue
            if [ -d "$d/v2lib" ]; then
              echo "::error::nested v2lib copy at $d/v2lib — repo code would not be live"
              exit 1
            fi
            if ! cmp -s "$ENV_SRC/config/v2lib/auto-continue.ts" "$d/auto-continue.ts"; then
              echo "::error::v2lib code sync mismatch at $d/auto-continue.ts (repo != runtime)"
              exit 1
            fi
            if ! cmp -s "$ENV_SRC/config/v2lib/_v2compat.ts" "$d/_v2compat.ts"; then
              echo "::error::v2lib code sync mismatch at $d/_v2compat.ts (repo != runtime)"
              exit 1
            fi
          done

          if [ ! -d "$HOME/.config/opencode/plugins" ]; then
            echo "::warning::bridge plugins missing; continuing without them"
            exit 0
          fi
          # 3. Derived registry plus the secret env file, both kept outside the repo.
          if [ -f "$ENV_SRC/templates/tg-bots.json" ]; then
            sed "s#__HOME__#$HOME#g" "$ENV_SRC/templates/tg-bots.json" > "$HOME/.config/opencode/tg-bots.json"
          fi
          : > "$HOME/.opencode/tg.env"
          if [ -n "${TG_BOT_TOKEN:-}" ]; then printf 'TG_BOT_TOKEN=%s\n' "$TG_BOT_TOKEN" >> "$HOME/.opencode/tg.env"; fi
          if [ -n "${TG_ALLOWED_CHAT:-}" ]; then printf 'TG_ALLOWED_CHAT=%s\n' "$TG_ALLOWED_CHAT" >> "$HOME/.opencode/tg.env"; fi
          if [ -n "${TG_PUSH_CHAT:-}" ]; then printf 'TG_PUSH_CHAT=%s\n' "$TG_PUSH_CHAT" >> "$HOME/.opencode/tg.env"; fi
          chmod 600 "$HOME/.opencode/tg.env"
          # bot3/bot4 tokens come from CI secrets too (ROUND 26). A token file kept under
          # $HOME cannot survive on its own: the value-independent snapshot scrub rewrites
          # token-shaped text to REDACTED, and ~/.config/opencode/tg-bot*.env is excluded
          # from the package - so a hand-written file is gone after every restart (exactly
          # why bot3/bot4 kept reporting token=MISSING).
          for b in 3 4; do
            v=""
            [ "$b" = "3" ] && v="${TG_BOT3_TOKEN:-}"
            [ "$b" = "4" ] && v="${TG_BOT4_TOKEN:-}"
            if [ -n "$v" ]; then
              printf 'TG_BOT_TOKEN=%s\nTG_ALLOWED_CHAT=%s\nTG_PUSH_CHAT=%s\n' \
                "$v" "${TG_ALLOWED_CHAT:-}" "${TG_PUSH_CHAT:-}" > "$HOME/.config/opencode/tg-bot$b.env"
              chmod 600 "$HOME/.config/opencode/tg-bot$b.env"
              echo "bot$b secret env written"
            else
              echo "::warning::TG_BOT${b}_TOKEN missing; bot$b will run without a token"
            fi
          done

      - name: Install OpenCode 2 and workferry
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g workferry

      - name: Run OpenCode
        id: run_opencode
        if: steps.lock.outputs.acquired == 'true'
        env:
          SESSIONS_DIR: /home/runner/work/sessions
          TARGETS_DIR: /home/runner/work/targets
          TG_BRIDGE_FORCE_SERVE: "1"
          BUDGET_SECONDS: ${{ inputs.budget_seconds }}
        run: |
          set +e
          RUN_LOG="$RUNNER_TEMP/opencode-run.log"
          BUDGET="${BUDGET_SECONDS:-19800}"
          # Cold-start resume. `opencode run` is one-shot: it loads the plugins, sends
          # one message and exits, so the tg-bridge is only alive for that one turn and
          # most operator messages get no reply. Instead we open the exact session the
          # bridge is bound to in the long-lived interactive mode, whose server loads
          # the plugins and stays up for the whole budget. No prompt is injected and no
          # new session is created; the bridge feeds operator Telegram messages into
          # this same session and pushes the replies.
          # ROUND 42（重启自动恢复的加固，运营者第 3 项要求）：pin 来自**随包还原**的
          # tg-chats.json.front，但"文件在"不等于"会话在" —— 若会话 DB 缺失/被换成旧代，
          # `--session <sid>` 会开一个**空的**新会话，看起来"恢复了"其实上下文全丢。
          # 故先查 DB 里是否真有该会话：确认为 "no" 才退回 `--continue`（恢复最近一次会话）；
          # DB 读不出（err/n-a）时**保持 pin**（pin 是已验证路径，不因探针抖动而改写）。
          # 诊断只打计数/是否，绝不打会话内容。
          SID=""
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            SID=$(jq -r '.front // empty' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true)
          fi
          SID_PRESENT="n/a"
          if [ -n "$SID" ] && [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            SID_PRESENT=$(python3 -c 'import sqlite3,sys,os;c=sqlite3.connect("file:"+os.path.expanduser("~/.local/share/opencode/opencode.db")+"?mode=ro",uri=True);print("yes" if c.execute("select 1 from session_v2 where id=?",(sys.argv[1],)).fetchone() else "no")' "$SID" 2>/dev/null || echo "err")
          fi
          # ROUND 44（重启自动恢复加固）：bound 会话**确认为 no**（或压根没有 bound）时，**不要**盲目
          # `--continue`——数据丢失后 `--continue` 只会打开本轮新建的空会话（实测：撕裂包 → 空 DB →
          # 新会话 ses_eb24bf12，旧 ses_eb626522 的 1056 条上下文全部掉线）。改为挑 DB 里**消息最多**
          # 的会话（最富上下文者，通常就是主循环会话）作为恢复目标；探针 err/n-a 仍保持 pin 不动。
          RECOVER_LINE=""
          if { [ "$SID_PRESENT" = "no" ] || [ -z "$SID" ]; } && [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            RECOVER_LINE=$(python3 -c 'import sqlite3,os;c=sqlite3.connect("file:"+os.path.expanduser("~/.local/share/opencode/opencode.db")+"?mode=ro",uri=True);r=c.execute("select session_id,count(*) n from session_message group by session_id order by n desc limit 1").fetchone();print("%s %d"%(r[0],r[1]) if r else "")' 2>/dev/null || true)
          fi
          RECOVER="${RECOVER_LINE%% *}"
          RECOVER_MSGS="${RECOVER_LINE##* }"
          if [ -n "$SID" ] && [ "$SID_PRESENT" != "no" ]; then
            ARGS=(--standalone --session "$SID")
            echo "resuming bound session present_in_db=$SID_PRESENT"
          elif [ -n "$RECOVER" ]; then
            ARGS=(--standalone --session "$RECOVER")
            echo "recovery: bound=$([ -n "$SID" ] && echo yes || echo none) present_in_db=$SID_PRESENT; pinned the richest restored session (msgs=$RECOVER_MSGS)"
          else
            ARGS=(--standalone --continue)
            if [ -n "$SID" ]; then
              echo "bound session absent from the restored db ($SID_PRESENT); no richer session to recover; falling back to --continue"
            else
              echo "no bound session found; continuing the last session"
            fi
          fi
          TERM=xterm-256color timeout --signal=TERM --kill-after=30s "$BUDGET" \
            opencode "${ARGS[@]}" --print-logs </dev/null >"$RUN_LOG" 2>&1
          RC=$?
          # Session content must never reach the CI log, so only a non-content summary.
          echo "opencode exit=$RC lines=$(wc -l < "$RUN_LOG" 2>/dev/null)"
          # Content-safe bridge diagnostics: counters only, never message text.
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            jq -c '{iocount, paused, selfmute, halted:(.halted|length), qlen:((.queue//[])|length), pqlen:((.pinqueue//[])|length)}' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true
          fi
          for pat in "pinject delivered" "pinject failed" "inject failed" "getUpdates failed" "loop stopped" "sendMessage chunked ok" "free tier" "instance registered" "turnActuallyIdle" "loop skip" "loopskip"; do
            echo "diag '$pat' = $(grep -c -- "$pat" "$RUN_LOG" 2>/dev/null || echo 0)"
          done
          # R213：143（SIGTERM 收尾，插件端 endRunNow 的 TERM 路径）同样视为“已受控结束=成功”，
          # 与 124/137 一并白名单，确保 END-ROUND-CI 一定能走到 relay；真崩溃（其他非零）仍不接力。
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ] || [ "$RC" -eq 143 ]; then
            echo "opencode hit the time budget; treated as success so the loop continues."
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "opencode exited with $RC; this run will not relay."
          fi
          exit "$RC"

      - name: Relay next run
        # ROUND 42（取消也要接力，运营者第 2 项要求）：运营者要用**一系列取消**验证无缝，
        # 而原先 `outcome == 'success'` 使取消的 run 不接力 ⇒ 没有后继 run，循环只能等
        # 6 小时 cron。实证：run 39090552818 的第 11/12 步（两个 always() 快照步）都
        # completed/success，唯独第 14 步 Relay 被 skipped。故：success **或 cancelled**
        # 都接力；failure 仍不接力（避免失败快循环）。
        # 位置也前移到快照步**之前**：接力只是 `gh workflow run` 排队（concurrency
        # cancel-in-progress:false ⇒ 后继必然等本轮结束），所以即使随后的快照步被取消
        # 信号打断，后继也已经排上——无缝性不再依赖"重活能不能跑完"。带 3 次重试。
        # ROUND 46：条件由 `steps.run_opencode.outcome == 'cancelled'` 改为 run 级 `cancelled()`。
        # 旧写法只在「取消发生在 Run OpenCode 步」时接力；若运营者在**还原/安装期间**就取消
        # （此时 run_opencode 是 skipped、不是 cancelled）⇒ 不接力 ⇒ 只能等 6 小时 cron，
        # 运营者观感＝「循环没启动」。用 `cancelled()` 覆盖任意时刻的取消（lock 已获得即可）。
        if: always() && steps.lock.outputs.acquired == 'true' && (steps.run_opencode.outcome == 'success' || cancelled())
        run: |
          set +e
          echo "Relaying next run (run_opencode outcome=${{ steps.run_opencode.outcome }})."
          relayed=0
          for attempt in 1 2 3; do
            if gh workflow run iterate.yml -f resume=true --repo "${{ github.repository }}"; then
              echo "relayed next run on attempt $attempt"
              relayed=1
              break
            fi
            echo "::warning::relay attempt $attempt failed; retrying"
            sleep 5
          done
          # ROUND 51：三次都失败时**原先静默成功** ⇒ 无后继、无告警，循环只能等 6h cron，
          # 运营者观感又是「循环停了」。改为显式失败（红 run/通知），快照步仍因 always() 照常执行。
          if [ "$relayed" != "1" ]; then
            echo "::error::relay failed after 3 attempts; no successor queued (falls back to the 6h cron)."
            exit 1
          fi

      - name: Save workspace snapshots
        # ROUND 46（防数据丢失）：只有 workspace 还原步**成功**才允许快照；若本轮在还原期间被取消
        # （outcome=cancelled）或根本没跑到（skipped），$HOME/targets 是半套/空壳，快照它会把
        # 「半套世界」固化进 release。跳过 ⇒ 保留上一代完好包。
        if: always() && steps.lock.outputs.acquired == 'true' && steps.restore_ws.outcome == 'success'
        run: |
          set +e
          SNAP="$SESSIONS_DIR/workspace-snapshots"
          mkdir -p "$SNAP"
          INDEX="$SNAP/index.json"
          [ -f "$INDEX" ] || echo '{"snapshots": []}' > "$INDEX"
          # R342：清掉旧格式（bundle/worktree）解包残留——新格式的 workspace-snapshots/
          # 只应有 index.json；任何子目录都是上一代旧包的遗留物，必须删掉以免被打进新包。
          find "$SNAP" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null
          shopt -s nullglob
          for target_dir in "$TARGETS_DIR"/*/; do
            repo_dir="${target_dir%/}"
            [ -d "$repo_dir/.git" ] || continue
            name=$(basename "$repo_dir")
            snap_dir="$SNAP/$name"
            # R342（Stage C）：目标工作区不再转 bundle，而是整目录留在原地、由 Snapshot
            # 步直接打进 targets 包（解包=还原，实测 11s vs bundle 克隆 72s）。这里只做：
            # 清掉旧代解包残留的 bundle 目录、把未提交状态固化成 stash、写 index 元数据
            # （含内容指纹 fp，供「未变则沿用」判定）。旧格式残留必须删除，否则会被打包。
            rm -rf "$snap_dir"

            STASH_HASH=$(git -C "$repo_dir" stash create "snapshot-$(date -u +%s)")
            if [ -n "$STASH_HASH" ]; then
              git -C "$repo_dir" stash store -m "snapshot" "$STASH_HASH" 2>/dev/null || true
            fi

            # R203（D6）：shallow 仓先把历史补全（保持历来行为；目录快照本身不要求可独立
            # 克隆，但补全后各代还原的工作区历史一致）。best-effort：远端不可达就保持原样。
            if [ "$(git -C "$repo_dir" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
              git -C "$repo_dir" fetch --unshallow --tags >/dev/null 2>&1 \
                || echo "::warning::unshallow failed for $name (the directory snapshot keeps the shallow history)"
            fi

            # R342（内容指纹）：「未变则沿用 targets」的判据 = HEAD/分支/全部 refs/worktree
            # 文件内容。实测 proxyip（7373 文件，~0.3GB 工作树）0.36s。刻意排除 .git 内部
            # 细节（reflog/pack 布局，属过程产物）与 refs/stash（每次 save 都会新生成）。
            FP=$( {
              printf 'head=%s\n' "$(git -C "$repo_dir" rev-parse HEAD 2>/dev/null)"
              printf 'branch=%s\n' "$(git -C "$repo_dir" symbolic-ref --short HEAD 2>/dev/null)"
              printf 'refs=%s\n' "$(git -C "$repo_dir" for-each-ref --format='%(refname) %(objectname)' 2>/dev/null | sort | sha256sum | cut -d' ' -f1)"
              printf 'worktree=%s\n' "$(cd "$repo_dir" && find . -path ./.git -prune -o -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)"
            } | sha256sum | cut -d' ' -f1 )

            BRANCH=$(git -C "$repo_dir" symbolic-ref --short HEAD 2>/dev/null || true)
            COMMIT=$(git -C "$repo_dir" rev-parse HEAD 2>/dev/null || true)
            REMOTE=$(git -C "$repo_dir" remote get-url origin 2>/dev/null || true)
            SAVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            # bundle/worktree 留空仅为旧读侧兼容（旧读侧 clone 空路径失败后会走远端克隆兜底）。
            ENTRY=$(jq -n \
              --arg repo "$REMOTE" \
              --arg dir "$name" \
              --arg mode "dirtar" \
              --arg fp "$FP" \
              --arg branch "$BRANCH" \
              --arg commit "$COMMIT" \
              --arg saved_at "$SAVED_AT" \
              '{repo: $repo, dir: $dir, mode: $mode, fp: $fp, bundle: "", worktree: "", branch: $branch, commit: $commit, saved_at: $saved_at}')

            tmp=$(mktemp)
            jq --arg dir "$name" '.snapshots |= map(select(.dir != $dir))' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
            tmp=$(mktemp)
            jq --argjson e "$ENTRY" '.snapshots += [$e]' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
          done

      - name: Snapshot environment to sessions repository
        # ROUND 46（防数据丢失）：同 workspace —— 只有 env 还原步**成功**才允许快照，避免把
        # 「取消在还原途中」留下的半套/空 $HOME 固化进 release（那正是 R44 那轮丢失的成因）。
        if: always() && steps.lock.outputs.acquired == 'true' && steps.restore_env.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SPLIT_SIZE: ${{ inputs.split_size }}
        run: |
          set +e
          ENV_SRC="$SESSIONS_DIR/opencode"
          mkdir -p "$ENV_SRC"
          # Best-effort scrub of the bot token from plaintext files under $HOME.
          if [ -n "${TG_BOT_TOKEN:-}" ]; then
            grep -rlI -F "$TG_BOT_TOKEN" "$HOME" \
              --exclude-dir=.cache --exclude-dir=.npm --exclude-dir=.bun --exclude-dir=bin \
              --exclude-dir=work --exclude-dir=.git 2>/dev/null \
              | while IFS= read -r f; do sed -i "s/${TG_BOT_TOKEN}/REDACTED/g" "$f" 2>/dev/null; done
          fi
          # Value-independent scrub (ROUND 10 / D3): telegram bot tokens have a fixed
          # shape (<6-12 digits>:<30+ base64url chars>). This also covers the per-bot
          # tokens (tg-bot3 / tg-bot4) which are NOT present as CI secrets, so the
          # value-only scrub above silently misses them. Text files only (-I skips the
          # binary sqlite session db, which is excluded from the package separately).
          grep -rlIE '[0-9]{6,12}:[A-Za-z0-9_-]{30,}' "$HOME" \
            --exclude-dir=.cache --exclude-dir=.npm --exclude-dir=.bun --exclude-dir=bin \
            --exclude-dir=work --exclude-dir=.git 2>/dev/null \
            | while IFS= read -r f; do sed -i -E 's/[0-9]{6,12}:[A-Za-z0-9_-]{30,}/REDACTED/g' "$f" 2>/dev/null; done
          # ROUND 24 / D3: the $HOME scrub above excludes work/ — and the sessions
          # repository lives in work/. Yet that tree is (a) packaged by the target tar
          # below (sessions/state/tasks) and uploaded to the release, and (b) force-pushed
          # wholesale to git by the "Rebuild repository baseline" step, where a leaked
          # token becomes permanent history. Scrub the repository tree as well.
          grep -rlIE '[0-9]{6,12}:[A-Za-z0-9_-]{30,}' "$SESSIONS_DIR" \
            --exclude-dir=.git 2>/dev/null \
            | while IFS= read -r f; do sed -i -E 's/[0-9]{6,12}:[A-Za-z0-9_-]{30,}/REDACTED/g' "$f" 2>/dev/null; done
          # Whole-package capture: tar the ENTIRE $HOME in one go - a complete snapshot,
          # not a delta/overlay. This is what guarantees completeness: the agent may drop
          # files anywhere, and files it copies or moves keep their old timestamps, so a
          # "changed-since-the-last-run" scan would silently miss them. Exclusions are
          # only reinstallable caches, the work/ tree (targets + the repo clone, both
          # persisted elsewhere and the latter would recurse), the opencode binary,
          # server logs and secrets.
          ENV_TAG="env"
          # ROUND 35：分页大小按「支持的单个资产上限」取大（90m→1500m）曾把上传压成**单流**。
          # R428 Stage D 基准（本 runner→GitHub release）：单流 27–33 MB/s、4 流 65 MB/s、
          # 8 流 82 MB/s ⇒ 改为**小页 + 相位内并行**：默认 256m（targets ≈6 页），stage/真名
          # 两相内各页并行（SNAP_UP_PAR 默认 8）。序列不变量（stage→校验→删旧→真名→meta→删stage）不变。
          # 可用 dispatch 输入 `split_size` 覆盖（relay 只传 resume ⇒ 用默认值）。
          SPLIT_SIZE="${SPLIT_SIZE:-256m}"
          # Checkpoint the SQLite sessions DB first so the packaged copy is consistent.
          if command -v python3 >/dev/null 2>&1 && [ -f "$HOME/.local/share/opencode/opencode.db" ]; then
            python3 -c 'import sqlite3;c=sqlite3.connect("'"$HOME"'/.local/share/opencode/opencode.db");c.execute("PRAGMA wal_checkpoint(TRUNCATE)");c.close()' 2>/dev/null \
              && echo "sqlite WAL checkpointed" || echo "::warning::sqlite WAL checkpoint skipped"
          fi
          # Binary DB redaction (ROUND 14 / D3). The text scrub above uses `grep -I`, so it
          # SKIPS the binary sqlite session DB - which therefore carried bot tokens straight
          # into every env package (measured: 62 hits, two distinct tokens). The DB cannot
          # be sed-edited, but a telegram token is ASCII and lives only inside string
          # values, so a LENGTH-PRESERVING byte replacement is safe for sqlite: page
          # offsets never move (verified on a copy: PRAGMA integrity_check=ok, all rows
          # intact). Runs AFTER the WAL checkpoint so the main file holds every page, and
          # before the tar; temp+rename makes an interrupted run non-destructive.
          for dbf in "$HOME/.local/share/opencode/opencode.db" "$HOME/.local/share/opencode/opencode.db-wal" "$HOME/.local/share/opencode/opencode.db-shm"; do
            [ -f "$dbf" ] || continue
            python3 -c 'import os,re,sys;p=sys.argv[1];pat=re.compile(rb"[0-9]{6,12}:[A-Za-z0-9_-]{30,}");b=open(p,"rb").read();nb=pat.sub(lambda m:b"X"*len(m.group(0)),b);m=os.stat(p).st_mode&0o777;t=p+".redact";open(t,"wb").write(nb);os.chmod(t,m);os.replace(t,p)' "$dbf" \
              && echo "db token-redacted: $(basename "$dbf")" || echo "::warning::db redaction skipped: $(basename "$dbf")"
          done
          OUT=/tmp/envsnap
          rm -rf "$OUT" && mkdir -p "$OUT"
          # R341 (non-agent time): pack with parallel gzip when available. pigz output
          # is a standard multi-member gzip stream, so every reader (this workflow's
          # magic-detection + `tar -xz`) stays dependency-free; fall back to gzip -6.
          # Measured on a 1.4GB target package: gzip 31.3s -> pigz -p4 12.4s.
          if command -v pigz >/dev/null 2>&1; then
            TAR_COMP=(tar -I 'pigz -p4' -cf -)
          else
            TAR_COMP=(tar -czf -)
          fi
          # ROUND 278（「快照优化」— save 侧）：run-end env-sync 把**终态**推到 env-sync
          # 分支；成功且能取到旧 meta（其 env 段仍与保留的 release env 卷吻合）时跳过全量
          # env 打包（本次最大单项 ~1m45s）。失败/取不到旧 meta 一律回退全量打包（保守）。
          # 两次尝试 + 20s 间隔，化解与插件 tick 的锁竞争。分支即 B 侧首选还原源；
          # release env 卷保留为 size-verified 回退（不再每代刷新，由 .env.carried 标记）。
          SKIP_ENV_PACK=0
          if [ -f "$SESSIONS_DIR/opencode/config/scripts/env-sync.sh" ]; then
            SYNC_OK=0
            for a in 1 2; do
              if ENV_SYNC_WHY=run-end ENV_SYNC_TIMEOUT=180 \
                   timeout 300 bash "$SESSIONS_DIR/opencode/config/scripts/env-sync.sh" >/dev/null 2>&1; then
                SYNC_OK=1; break
              fi
              echo "::warning::run-end env-sync attempt $a did not complete; retrying"
              sleep 20
            done
            if [ "$SYNC_OK" = 1 ]; then
              echo "run-end env-sync pushed; the env-sync branch now holds the final state"
              gh release download "$ENV_TAG" --repo "$SESSIONS_REPO" --pattern 'meta.json' --dir "$OUT" --clobber >/dev/null 2>&1 || true
              if [ -s "$OUT/meta.json" ] && jq -e '(.env.bytes // 0) > 0' "$OUT/meta.json" >/dev/null 2>&1; then
                cp -f "$OUT/meta.json" "$OUT/meta.env-carry.json"
                SKIP_ENV_PACK=1
                echo "env pack skipped: carried the release env section; the branch is the primary env source"
              else
                echo "::warning::no usable previous meta.json to carry the env section; packing env anyway"
              fi
            else
              echo "::warning::run-end env-sync failed; packing the env release as before"
            fi
          fi
          if [ "$SKIP_ENV_PACK" != 1 ]; then
          "${TAR_COMP[@]}" -C "$HOME" \
            --exclude='./work' \
            --exclude='./.cache' \
            --exclude='./.opencode/bin' \
            --exclude='./.opencode/tg.env' \
            --exclude='./.opencode/tg-bot*.env' \
            --exclude='./.config/opencode/tg.env' \
            --exclude='./.config/opencode/tg-bot*.env' \
            --exclude='./.ssh' \
            --exclude='./.config/gh' \
            --exclude='./.gitconfig' \
            --exclude='./.git-credentials' \
            --exclude='./.local/share/opencode/log' \
            --exclude='./.npm/_cacache' \
            --exclude='./.bun/install/cache' \
            --exclude='./actions-runner' \
            --exclude='./.rustup' \
            --exclude='./.dotnet' \
            --exclude='./.opencode/.v2lib-live' \
            . 2>/dev/null | split -b "$SPLIT_SIZE" - "$OUT/env.tar.gz." \
            || echo "::warning::environment package failed"
          fi
          # R342（records 独立资产，Stage B）：records 很小但每轮都变；targets 很大但内容
          # 可以不变。独立打包 records ⇒ targets 未变时只换 records（~2MB），跳过 ~1.4GB
          # 的暂存+正式双上传。targets 包内仍内嵌一份 records（兼容旧读侧；未变轮次里它
          # 可能略旧，新读侧会用独立资产覆盖）。
          REC_OK=0
          ( cd "$SESSIONS_DIR" && "${TAR_COMP[@]}" state tasks sessions loop-state.md 2>/dev/null ) \
            | split -b "$SPLIT_SIZE" - "$OUT/records.tar.gz." \
            && ls "$OUT"/records.tar.gz.* >/dev/null 2>&1 && REC_OK=1 \
            || echo "::warning::records package failed; readers will use the copy embedded in the targets package"
          # R342：聚合内容指纹（来自 Save 步写入的 index.json）——只有全部快照都是新格式
          # 且带指纹时才允许「未变沿用」，否则一律重传（保守）。
          TGT_FP=""; TGT_MODE=""
          IDX="$SESSIONS_DIR/workspace-snapshots/index.json"
          if [ -s "$IDX" ]; then
            _tn=$(jq -r '[.snapshots[]?] | length' "$IDX" 2>/dev/null || echo 0)
            _bad=$(jq -r '[.snapshots[]? | select((.mode // "") != "dirtar" or ((.fp // "") | length) == 0)] | length' "$IDX" 2>/dev/null || echo 1)
            if [ "${_tn:-0}" -gt 0 ] 2>/dev/null && [ "${_bad:-1}" = "0" ]; then
              TGT_MODE="dirtar"
              TGT_FP=$(jq -r '[.snapshots[] | .dir + "=" + .fp] | sort | join("\n")' "$IDX" | sha256sum | cut -d' ' -f1)
            fi
          fi
          # R342（未变沿用判定）：上一代 meta 与 release 现状都要自洽才可信——格式/指纹
          # 一致、records 包已生成、且 release 里的 targets 页数与上一代 meta 相符。
          CARRY=0
          if [ "$SKIP_ENV_PACK" = 1 ] && [ "$REC_OK" = 1 ] && [ -n "$TGT_FP" ] && [ -f "$OUT/meta.env-carry.json" ] \
            && [ "$(jq -r '.targets.mode // empty' "$OUT/meta.env-carry.json" 2>/dev/null)" = "dirtar" ] \
            && [ "$(jq -r '.targets.fp // empty' "$OUT/meta.env-carry.json" 2>/dev/null)" = "$TGT_FP" ]; then
            _prev_n=$(jq -r '.targets.volumes // 0' "$OUT/meta.env-carry.json" 2>/dev/null || echo 0)
            _have_n=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '[.assets[].name | select(test("^targets\\.tar\\.gz"))] | length' 2>/dev/null || echo 0)
            if [ "${_prev_n:-0}" -gt 0 ] 2>/dev/null && [ "${_prev_n:-0}" = "${_have_n:-0}" ]; then
              CARRY=1
              echo "targets unchanged (fingerprint match, $_have_n page(s)); carrying the previous targets package"
            else
              echo "::warning::targets fingerprint matches but the release has ${_have_n:-0} of ${_prev_n:-0} page(s); re-uploading targets"
            fi
          fi
          # R342（Stage C）：目标工作区以目录直存随 targets 包同行（tar 根下 <name>，排除
          # 运行态文件锁）；只打包真正的 git 工作区（跳过 data/.github 等辅助目录）。
          # 沿用轮次（CARRY=1）跳过打包，省 ~15s。
          if [ "$CARRY" != 1 ]; then
            TGT_DIRS=()
            for d in "$TARGETS_DIR"/*/; do
              [ -d "${d%/}/.git" ] && TGT_DIRS+=("$(basename "$d")")
            done
            ( cd "$SESSIONS_DIR" && "${TAR_COMP[@]}" --exclude='*/.git/*.lock' workspace-snapshots state tasks sessions loop-state.md -C "$TARGETS_DIR" ${TGT_DIRS[@]+"${TGT_DIRS[@]}"} 2>/dev/null ) \
              | split -b "$SPLIT_SIZE" - "$OUT/targets.tar.gz." \
              || echo "::warning::target workspace package failed"
          fi
          SZ=$(cat "$OUT"/env.tar.gz.* 2>/dev/null | wc -c)
          TZ=$(cat "$OUT"/targets.tar.gz.* 2>/dev/null | wc -c)
          ENV_N=$(ls "$OUT"/env.tar.gz.* 2>/dev/null | wc -l)
          TGT_N=$(ls "$OUT"/targets.tar.gz.* 2>/dev/null | wc -l)
          ENV_SHA=$(cat "$OUT"/env.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          TGT_SHA=$(cat "$OUT"/targets.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          REC_SZ=$(cat "$OUT"/records.tar.gz.* 2>/dev/null | wc -c)
          REC_N=$(ls "$OUT"/records.tar.gz.* 2>/dev/null | wc -l)
          REC_SHA=$(cat "$OUT"/records.tar.gz.* 2>/dev/null | sha256sum | cut -d' ' -f1)
          # ── R428 / Stage D：分页并行上传助手（有界并发）────────────────────────
          # 依据：2026-10-19 基准（本 runner→GitHub release，256 MiB 定字节）：
          #   单流 27–33 MB/s；4 流 65 MB/s；8 流 82 MB/s（≈2.5–3×）。
          # 因此在**相位内**把分页资产并行上传；相位序不变：stage→校验→删旧→真名→meta→删stage。
          # 每页一个 `gh release upload`（内部单流），并发 N ⇒ 聚合吞吐上台阶。
          # 失败语义沿用原版：任一页失败 ⇒ 本相失败（stage 失败不动旧包；真名失败写 warning）；
          # 每个调用点都保留单次全量 `gh release upload` 作为回退（并行助手失败时回落，仍是正确序）。
          SNAP_UP_PAR="${SNAP_UP_PAR:-8}"
          upload_par() {
            local fail=0
            [ "$#" -gt 0 ] || return 1
            printf '%s\0' "$@" | xargs -0 -n1 -P"$SNAP_UP_PAR" bash -c \
              'gh release upload "$0" "$3" --repo "$2" --clobber >/dev/null 2>&1' "$ENV_TAG" _ "$SESSIONS_REPO" || fail=1
            return "$fail"
          }
          # ROUND 35：只有当 **env 页真的存在** 时才进入「删旧资产 + 上传」分支。否则打包失败
          # 会把上一代好包删掉（manifest 本身也会让目录非空，所以这里不能用"目录非空"当判据）。
          if ls "$OUT"/env.tar.gz.* >/dev/null 2>&1; then
            gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" >/dev/null 2>&1 \
              || gh release create "$ENV_TAG" --repo "$SESSIONS_REPO" --title "environment snapshot" \
                   --notes "Whole-\$HOME environment + target workspace packages; replaced every run." >/dev/null 2>&1
            # ROUND 42（取消安全换装，关键）：旧序是「先删光旧卷、再上传」——取消若切在中间，
            # release 会**没有包或只剩残包**，下一轮就还原不出环境。运营者现在会**故意**做
            # 一系列取消来验证无缝，故改成与 `env-backup.sh swap` 同款的原子序：
            #   ① 先建好 manifest（本地）
            #   ② 新代以 STAGE 名上传（读侧 glob `env.tar.gz*` 与删除正则都不匹配 stage-*）
            #   ③ 远程逐个比对 STAGE 尺寸
            #   ④ 删旧代  ⑤ 真名上传（manifest 最后）  ⑥ 远程校验真名  ⑦ 删 STAGE 副本
            # 任何中断都退化成「上一代完整包仍在」，永不出现混杂/空缺。
            jq -n --arg tag "$ENV_TAG" --arg run "${GITHUB_RUN_ID:-}" --arg commit "${GITHUB_SHA:-}" \
                  --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg split "$SPLIT_SIZE" \
                  --argjson env_bytes "${SZ:-0}" --argjson targets_bytes "${TZ:-0}" \
                  --argjson env_volumes "${ENV_N:-0}" --argjson targets_volumes "${TGT_N:-0}" \
                  --arg env_sha "$ENV_SHA" --arg targets_sha "$TGT_SHA" \
                  --argjson records_bytes "${REC_SZ:-0}" --argjson records_volumes "${REC_N:-0}" \
                  --arg records_sha "$REC_SHA" --argjson rec_ok "${REC_OK:-0}" \
                  --arg tgt_mode "$TGT_MODE" --arg tgt_fp "$TGT_FP" \
                  '{version:2, tag:$tag, run_id:$run, commit:$commit, created_at:$at, split_size:$split,
                    env:{volumes:$env_volumes, bytes:$env_bytes, sha256:$env_sha},
                    targets:{volumes:$targets_volumes, bytes:$targets_bytes, sha256:$targets_sha, mode:$tgt_mode, fp:$tgt_fp}}
                   | (if $rec_ok==1 then .records={volumes:$records_volumes, bytes:$records_bytes, sha256:$records_sha} else . end)' \
                  > "$OUT/meta.json" 2>/dev/null
            mkdir -p "$OUT/stage"
            for f in "$OUT"/env.tar.gz.* "$OUT"/targets.tar.gz.* "$OUT"/records.tar.gz.* "$OUT/meta.json"; do
              [ -f "$f" ] || continue
              cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
            done
            stage_ok=0
            if upload_par "$OUT"/stage/* || gh release upload "$ENV_TAG" "$OUT"/stage/* --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
              stage_ok=1
              for f in "$OUT"/stage/stage-*; do
                n=$(basename "$f"); l=$(stat -c%s "$f")
                r=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq ".assets[] | select(.name==\"$n\") | .size")
                if [ "$l" = "$r" ]; then
                  echo "staged ok $n = $l bytes"
                else
                  stage_ok=0
                  echo "::warning::staged size mismatch $n ($l vs $r)"
                fi
              done
            else
              echo "::warning::staged upload failed; the previous package is left untouched"
            fi
            if [ "$stage_ok" -eq 1 ]; then
              # 旧代删除（正则与读侧 glob 都不匹配 stage-*，故暂存副本安全）；逐资产后台并行、wait 收口
              mapfile -t DELOLD < <(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -E '^(env|home|targets|records)\.tar\.gz(\.|$)|^meta\.json$' || true)
              for a in ${DELOLD[@]+"${DELOLD[@]}"}; do
                gh release delete-asset "$ENV_TAG" "$a" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 &
              done
              wait
              UPF=()
              for f in "$OUT"/env.tar.gz.* "$OUT"/targets.tar.gz.* "$OUT"/records.tar.gz.*; do
                [ -f "$f" ] && UPF+=("$f")
              done
              if upload_par "${UPF[@]}" || gh release upload "$ENV_TAG" "${UPF[@]}" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
                # ROUND 35：manifest 最后上传 ⇒ 它的存在即代表页是完整的；读侧据它检测
                # "下载不全"并拒绝半套应用；缺失时读侧退回无校验直解（降级读）。
                if [ -s "$OUT/meta.json" ]; then
                  gh release upload "$ENV_TAG" "$OUT/meta.json" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 \
                    || echo "::warning::failed to upload meta.json (readers will fall back to unverified extract)"
                else
                  echo "::warning::failed to build meta.json (readers will fall back to unverified extract)"
                fi
                echo "environment package uploaded: $ENV_N volume(s), $SZ bytes"
                echo "target workspace package uploaded: $TGT_N volume(s), $TZ bytes"
                echo "package manifest: split=$SPLIT_SIZE env=$ENV_N vol targets=$TGT_N vol"
              else
                echo "::warning::failed to upload packages to release"
              fi
              for f in "$OUT"/stage/stage-*; do
                gh release delete-asset "$ENV_TAG" "$(basename "$f")" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 \
                  && echo "staged copy removed: $(basename "$f")" &
              done
              wait
            fi
          elif [ "$SKIP_ENV_PACK" = 1 ] \
            && { [ "${CARRY:-0}" = 1 ] || ls "$OUT"/targets.tar.gz.* >/dev/null 2>&1; }; then
            # ROUND 278：env 由 env-sync 分支承担 ⇒ 本次**仅**原子换装 targets 包；
            # release 里的旧 env 卷**保留**为回退源（env_try 仍按其尺寸校验）。新 meta
            # 沿用旧 meta 的 env 段并打 .env.carried=true（读侧据此让位给分支）。
            # R342：records（每轮必新）+ targets（内容未变则沿用，跳过 ~1.4GB 双上传）。
            if [ -f "$OUT/meta.env-carry.json" ] \
              && jq --arg run "${GITHUB_RUN_ID:-}" --arg commit "${GITHUB_SHA:-}" \
                 --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg split "$SPLIT_SIZE" \
                 --argjson targets_bytes "${TZ:-0}" --argjson targets_volumes "${TGT_N:-0}" \
                 --arg targets_sha "$TGT_SHA" \
                 --argjson carry "${CARRY:-0}" --arg tgt_mode "$TGT_MODE" --arg tgt_fp "$TGT_FP" \
                 --argjson rec_ok "${REC_OK:-0}" --argjson records_bytes "${REC_SZ:-0}" \
                 --argjson records_volumes "${REC_N:-0}" --arg records_sha "$REC_SHA" \
                 '.env.packed_at=(.env.packed_at // .env.carried_at // .created_at) |
                  .env.carried_at=$at |
                  .env.carried=true |
                  .created_at=$at | .run_id=$run | .commit=$commit | .split_size=$split |
                  .targets=(if $carry==1 then (.targets + {carried_at:$at, carried:true}) else {volumes:$targets_volumes, bytes:$targets_bytes, sha256:$targets_sha, mode:$tgt_mode, fp:$tgt_fp} end) |
                  (if $rec_ok==1 then .records={volumes:$records_volumes, bytes:$records_bytes, sha256:$records_sha} else del(.records) end)' \
                 "$OUT/meta.env-carry.json" > "$OUT/meta.json" 2>/dev/null \
              && [ -s "$OUT/meta.json" ] && jq -e '(.env.bytes // 0) > 0' "$OUT/meta.json" >/dev/null 2>&1; then
              mkdir -p "$OUT/stage"
              for f in "$OUT"/records.tar.gz.* "$OUT/meta.json"; do
                [ -f "$f" ] || continue
                cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
              done
              if [ "${CARRY:-0}" != 1 ]; then
                for f in "$OUT"/targets.tar.gz.*; do
                  [ -f "$f" ] || continue
                  cp -f "$f" "$OUT/stage/stage-$(basename "$f")"
                done
              fi
              stage_ok=0
              if upload_par "$OUT"/stage/* || gh release upload "$ENV_TAG" "$OUT"/stage/* --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
                stage_ok=1
                for f in "$OUT"/stage/stage-*; do
                  n=$(basename "$f"); l=$(stat -c%s "$f")
                  r=$(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq ".assets[] | select(.name==\"$n\") | .size")
                  if [ "$l" = "$r" ]; then
                    echo "staged ok $n = $l bytes"
                  else
                    stage_ok=0
                    echo "::warning::staged size mismatch $n ($l vs $r)"
                  fi
                done
              else
                echo "::warning::staged upload failed; the previous packages are left untouched"
              fi
              if [ "$stage_ok" -eq 1 ]; then
                if [ "${CARRY:-0}" = 1 ]; then
                  DELPAT='^records\.tar\.gz(\.|$)|^meta\.json$'
                else
                  DELPAT='^records\.tar\.gz(\.|$)|^targets\.tar\.gz(\.|$)|^meta\.json$'
                fi
                mapfile -t DELOLD < <(gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                  | grep -E "$DELPAT" || true)
                for a in ${DELOLD[@]+"${DELOLD[@]}"}; do
                  gh release delete-asset "$ENV_TAG" "$a" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 &
                done
                wait
                UPF=()
                for f in "$OUT"/records.tar.gz.*; do [ -f "$f" ] && UPF+=("$f"); done
                if [ "${CARRY:-0}" != 1 ]; then
                  for f in "$OUT"/targets.tar.gz.*; do [ -f "$f" ] && UPF+=("$f"); done
                fi
                up_ok=1
                if [ "${#UPF[@]}" -gt 0 ]; then
                  upload_par "${UPF[@]}" || gh release upload "$ENV_TAG" "${UPF[@]}" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 || up_ok=0
                else
                  up_ok=0
                fi
                if [ "$up_ok" = 1 ]; then
                  if [ -s "$OUT/meta.json" ]; then
                    gh release upload "$ENV_TAG" "$OUT/meta.json" --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1 \
                      || echo "::warning::failed to upload meta.json (readers will fall back to unverified extract)"
                  fi
                  if [ "${CARRY:-0}" = 1 ]; then
                    echo "target workspace package carried (unchanged); records refreshed"
                  else
                    echo "target workspace package updated (env from env-sync branch; retained release env kept as fallback)"
                  fi
                  echo "package manifest: split=$SPLIT_SIZE env=carried targets=$TGT_N vol carry=${CARRY:-0} records=$REC_N vol"
                else
                  echo "::warning::failed to upload targets/records packages to release"
                fi
                for f in "$OUT"/stage/stage-*; do
                  gh release delete-asset "$ENV_TAG" "$(basename "$f")" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1 \
                    && echo "staged copy removed: $(basename "$f")" &
                done
                wait
              fi
            else
              echo "::warning::meta rewrite failed; leaving the release untouched (targets stay previous generation)"
            fi
          else
            echo "::warning::environment package is empty"
          fi
          rm -rf "$OUT"

      - name: Rebuild repository baseline
        if: always() && steps.lock.outputs.acquired == 'true' && inputs.reset_baseline
        run: |
          set +e
          cd "$SESSIONS_DIR"
          # Rewrite the repository to its clean initial baseline. Only the bridge CODE and
          # templates stay in git; ALL runtime state (sessions DB, bridge chats, loop
          # control, shell capture) now lives in the `env` release. This is the "reset to
          # factory" baseline: restoring it - and dropping the env release - returns the
          # loop to the initial state. Run this with reset_baseline=true once (or whenever
          # you want to re-freeze the baseline).
          git checkout --orphan baseline-reset >/dev/null 2>&1
          rm -rf opencode/data
          mkdir -p opencode/data
          touch opencode/data/.gitkeep
          # 循环记录同样是**运行态**：它活在 env release 的工作树里，绝不进"出厂基线"。
          # 否则 reset 出来的"干净、开箱即用"环境会带着历史轮次记录（运营者 2026-10-18 指出）。
          # 注：assets 快照已排除 ./work（见 --exclude='./work'），因此记录**不**会进 env 包；
          # 若运营者要求"仓库树也永远干净"，需再把记录迁到 $HOME 内被快照的路径（待决策）。
          rm -rf sessions state tasks workspace-snapshots loop-state.md
          rm -f opencode/config/tg-chats.json opencode/config/tg-chats-bot*.json \
                opencode/config/loop-ctl.json opencode/config/loop-marker.json \
                opencode/config/tg-bots.json opencode/config/loop-guard.json \
                opencode/config/loop-sessions.json opencode/config/model-windows.json \
                opencode/config/abort-events.json opencode/config/inject-card-*.json \
                opencode/config/botname-*.json
          {
            echo '# Runtime state lives in the env release, not in git.'
            echo 'opencode/data/*'
            echo '!opencode/data/.gitkeep'
            # 循环记录（轮次笔记 / 状态 / 任务 / 快照索引）也不是基线的一部分
            echo 'sessions/'
            echo 'state/'
            echo 'tasks/'
            echo 'workspace-snapshots/'
            echo 'loop-state.md'
            echo 'opencode/config/tg-chats*.json'
            echo 'opencode/config/tg-bots.json'
            echo 'opencode/config/loop-ctl.json'
            echo 'opencode/config/loop-marker.json'
            echo 'opencode/config/loop-guard.json'
            echo 'opencode/config/loop-sessions.json'
            echo 'opencode/config/model-windows.json'
            echo 'opencode/config/abort-events.json'
            echo 'opencode/config/inject-card-*.json'
            echo 'opencode/config/halt-release.json*'
            echo 'opencode/config/botname-*.json*'
            echo 'opencode/config/service.json*'
            echo 'opencode/config/tg-bot*.env'
            echo 'opencode/config/tg.env'
            echo 'opencode/home.tar.gz*'
          } > .gitignore
          git add -A
          git -c user.name="opencode-ci" -c user.email="opencode-ci@users.noreply.github.com" \
            commit -q -m "baseline: clean initial state ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            || echo "::warning::nothing to commit"
          git branch -M baseline-reset main
          for attempt in 1 2 3 4 5; do
            if git push --force origin main; then
              echo "baseline pushed (single commit)"
              break
            fi
            echo "::warning::baseline push attempt $attempt failed; retrying"
            sleep 4
          done
          git tag -f baseline >/dev/null 2>&1
          for attempt in 1 2 3 4 5; do
            if git push --force origin refs/tags/baseline; then
              echo "baseline tag pushed"
              break
            fi
            echo "::warning::baseline tag push attempt $attempt failed; retrying"
            sleep 4
          done
