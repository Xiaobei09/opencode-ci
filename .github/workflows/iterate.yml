name: iterate

on:
  workflow_dispatch:
    inputs:
      resume:
        description: Resume the previous run from saved state
        type: boolean
        required: false
        default: true
      budget_seconds:
        description: OpenCode run budget in seconds (default ~5h30m; max job is 6h)
        type: string
        required: false
        default: "19800"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: iterate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.CROSS_PAT }}
  SESSIONS_REPO: ${{ vars.SESSIONS_REPO }}
  SESSIONS_DIR: /home/runner/work/sessions
  TARGETS_DIR: /home/runner/work/targets

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out ci-repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI and configure git
        run: |
          set -euo pipefail
          sudo mkdir -p -m 755 /etc/apt/keyrings
          key=$(mktemp)
          wget -nv -O"$key" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo install -m 0644 "$key" /etc/apt/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y gh
          gh auth setup-git
          git config --global user.name "opencode-ci"
          git config --global user.email "opencode-ci@users.noreply.github.com"

      - name: Clone sessions repository
        run: |
          set -euo pipefail
          if [ ! -d "$SESSIONS_DIR/.git" ]; then
            mkdir -p "$(dirname "$SESSIONS_DIR")"
            gh repo clone "$SESSIONS_REPO" "$SESSIONS_DIR"
          fi
          mkdir -p "$SESSIONS_DIR/state" "$SESSIONS_DIR/tasks" "$SESSIONS_DIR/sessions" "$SESSIONS_DIR/workspace-snapshots"
          [ -f "$SESSIONS_DIR/workspace-snapshots/index.json" ] || echo '{"snapshots": []}' > "$SESSIONS_DIR/workspace-snapshots/index.json"

      - name: Acquire lock
        id: lock
        run: |
          # Runs are serialized by the workflow-level `concurrency` group, so no
          # cross-run lock file is needed. The step id/output are kept so downstream
          # `if:` guards stay simple. A committed lock file used to deadlock the loop
          # whenever a push failed; removing it removes that whole failure class.
          echo "acquired=true" >> "$GITHUB_OUTPUT"

      - name: Prepare target workspace
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TARGETS_DIR"

      - name: Restore workspace snapshots
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set +e
          INDEX="$SESSIONS_DIR/workspace-snapshots/index.json"
          [ -f "$INDEX" ] || exit 0
          COUNT=$(jq '.snapshots | length' "$INDEX")
          for i in $(seq 0 $((COUNT - 1))); do
            dir=$(jq -r ".snapshots[$i].dir // empty" "$INDEX")
            bundle=$(jq -r ".snapshots[$i].bundle // empty" "$INDEX")
            worktree=$(jq -r ".snapshots[$i].worktree // empty" "$INDEX")
            branch=$(jq -r ".snapshots[$i].branch // empty" "$INDEX")
            commit=$(jq -r ".snapshots[$i].commit // empty" "$INDEX")
            repo=$(jq -r ".snapshots[$i].repo // empty" "$INDEX")
            [ -n "$dir" ] || continue
            target_dir="$TARGETS_DIR/$dir"
            [ -e "$target_dir" ] && continue
            if ! git clone "$SESSIONS_DIR/$bundle" "$target_dir"; then
              echo "::warning::clone failed for $dir, skipping"
              continue
            fi
            (
              set +e
              cd "$target_dir" || exit 0
              if [ -n "$branch" ]; then
                git checkout "$branch" 2>/dev/null \
                  || git checkout -b "$branch" "origin/$branch" 2>/dev/null \
                  || echo "::warning::branch $branch missing for $dir, staying on default"
              fi
              if [ -n "$commit" ]; then
                git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout "$commit" 2>/dev/null || true
              fi
              git fetch origin '+refs/stash:refs/stash' 2>/dev/null || true
              if ! workferry apply --dir "$target_dir" "$SESSIONS_DIR/$worktree"; then
                echo "::warning::workferry apply failed for $dir, untracked files may be lost"
              fi
              if git rev-parse --verify refs/stash >/dev/null 2>&1; then
                STASH_SHA=$(git rev-parse refs/stash)
                git stash apply --index "$STASH_SHA" 2>/dev/null \
                  || echo "::warning::stash apply failed for $dir, staged state may be incomplete"
              fi
              if [ -n "$repo" ]; then
                git remote set-url origin "$repo"
              fi
            )
          done

      - name: Restore environment and install bridge from sessions repository
        if: steps.lock.outputs.acquired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT: ${{ secrets.TG_ALLOWED_CHAT }}
          TG_PUSH_CHAT: ${{ secrets.TG_PUSH_CHAT }}
        run: |
          set -euo pipefail
          ENV_SRC="$SESSIONS_DIR/opencode"
          mkdir -p "$HOME/.config" "$HOME/.local/share" "$HOME/.opencode"
          # Restore the catch-all environment snapshot from the sessions repo RELEASE.
          # Release assets are not part of git history, so the repository stays clean
          # and each asset can far exceed git's 100MiB file cap. The tag is fixed, so
          # every run overwrites the previous environment.
          ENV_TAG="env"
          rm -rf /tmp/envdl && mkdir -p /tmp/envdl
          if gh release download "$ENV_TAG" --repo "$SESSIONS_REPO" --pattern 'home.tar.gz*' --dir /tmp/envdl --clobber >/dev/null 2>&1 \
             && ls /tmp/envdl/home.tar.gz* >/dev/null 2>&1; then
            echo "environment restored from release '$ENV_TAG'"
            if ls /tmp/envdl/home.tar.gz.* >/dev/null 2>&1; then
              cat /tmp/envdl/home.tar.gz.* | tar -xzf - -C "$HOME" 2>/dev/null \
                || echo "::warning::failed to restore environment snapshot"
            else
              tar -xzf /tmp/envdl/home.tar.gz -C "$HOME" 2>/dev/null \
                || echo "::warning::failed to restore environment snapshot"
            fi
          else
            echo "no environment release yet; starting fresh"
          fi
          if [ ! -d "$ENV_SRC/config/plugins" ] || [ ! -d "$ENV_SRC/config/v2lib" ]; then
            echo "::warning::bridge environment missing under sessions repository; continuing without it"
            exit 0
          fi
          mkdir -p "$ENV_SRC/data"
          # Link the whole opencode state into the sessions repo so the environment
          # (sessions DB + bridge state) survives across runs. Individual state-file
          # symlinks would be clobbered by the plugin's atomic temp+rename writes, so a
          # directory symlink is required.
          rm -rf "$HOME/.config/opencode" "$HOME/.local/share/opencode" "$HOME/.opencode/v2lib" "$HOME/.opencode/.v2lib-live"
          ln -s "$ENV_SRC/config" "$HOME/.config/opencode"
          ln -s "$ENV_SRC/config/v2lib" "$HOME/.opencode/v2lib"
          ln -s "$ENV_SRC/data" "$HOME/.local/share/opencode"
          # Registry (derived, gitignored) pointing envFile at a secret living outside the repo.
          sed "s#__HOME__#$HOME#g" "$ENV_SRC/templates/tg-bots.json" > "$HOME/.config/opencode/tg-bots.json"
          : > "$HOME/.opencode/tg.env"
          if [ -n "${TG_BOT_TOKEN:-}" ]; then printf 'TG_BOT_TOKEN=%s\n' "$TG_BOT_TOKEN" >> "$HOME/.opencode/tg.env"; fi
          if [ -n "${TG_ALLOWED_CHAT:-}" ]; then printf 'TG_ALLOWED_CHAT=%s\n' "$TG_ALLOWED_CHAT" >> "$HOME/.opencode/tg.env"; fi
          if [ -n "${TG_PUSH_CHAT:-}" ]; then printf 'TG_PUSH_CHAT=%s\n' "$TG_PUSH_CHAT" >> "$HOME/.opencode/tg.env"; fi
          chmod 600 "$HOME/.opencode/tg.env"
          # Marker for the catch-all snapshot: only files newer than this were created
          # or changed by this run, so the snapshot stays small and bounded.
          touch "$HOME/.opencode/.snapshot-mark"

      - name: Install OpenCode 2 and workferry
        if: steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g workferry

      - name: Run OpenCode
        id: run_opencode
        if: steps.lock.outputs.acquired == 'true'
        env:
          SESSIONS_DIR: /home/runner/work/sessions
          TARGETS_DIR: /home/runner/work/targets
          TG_BRIDGE_FORCE_SERVE: "1"
          BUDGET_SECONDS: ${{ inputs.budget_seconds }}
        run: |
          set +e
          RUN_LOG="$RUNNER_TEMP/opencode-run.log"
          BUDGET="${BUDGET_SECONDS:-19800}"
          # Cold-start resume. `opencode run` is one-shot: it loads the plugins, sends
          # one message and exits, so the tg-bridge is only alive for that one turn and
          # most operator messages get no reply. Instead we open the exact session the
          # bridge is bound to in the long-lived interactive mode, whose server loads
          # the plugins and stays up for the whole budget. No prompt is injected and no
          # new session is created; the bridge feeds operator Telegram messages into
          # this same session and pushes the replies.
          SID=""
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            SID=$(jq -r '.front // empty' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true)
          fi
          if [ -n "$SID" ]; then
            ARGS=(--standalone --session "$SID")
            echo "resuming bound session $SID"
          else
            ARGS=(--standalone --continue)
            echo "no bound session found; continuing the last session"
          fi
          TERM=xterm-256color timeout --signal=TERM --kill-after=30s "$BUDGET" \
            opencode "${ARGS[@]}" --print-logs </dev/null >"$RUN_LOG" 2>&1
          RC=$?
          # Session content must never reach the CI log, so only a non-content summary.
          echo "opencode exit=$RC lines=$(wc -l < "$RUN_LOG" 2>/dev/null)"
          # Content-safe bridge diagnostics: counters only, never message text.
          if [ -f "$HOME/.config/opencode/tg-chats.json" ]; then
            jq -c '{iocount, paused, selfmute, halted:(.halted|length), qlen:((.queue//[])|length), pqlen:((.pinqueue//[])|length)}' "$HOME/.config/opencode/tg-chats.json" 2>/dev/null || true
          fi
          for pat in "pinject delivered" "pinject failed" "inject failed" "getUpdates failed" "loop stopped" "sendMessage chunked ok" "free tier" "instance registered" "turnActuallyIdle" "loop skip" "loopskip"; do
            echo "diag '$pat' = $(grep -c -- "$pat" "$RUN_LOG" 2>/dev/null || echo 0)"
          done
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
            echo "opencode hit the time budget; treated as success so the loop continues."
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "opencode exited with $RC; this run will not relay."
          fi
          exit "$RC"

      - name: Save workspace snapshots
        if: always() && steps.lock.outputs.acquired == 'true'
        run: |
          set +e
          SNAP="$SESSIONS_DIR/workspace-snapshots"
          mkdir -p "$SNAP"
          INDEX="$SNAP/index.json"
          [ -f "$INDEX" ] || echo '{"snapshots": []}' > "$INDEX"
          shopt -s nullglob
          for target_dir in "$TARGETS_DIR"/*/; do
            repo_dir="${target_dir%/}"
            [ -d "$repo_dir/.git" ] || continue
            name=$(basename "$repo_dir")
            snap_dir="$SNAP/$name"
            rm -rf "$snap_dir"
            mkdir -p "$snap_dir"

            STASH_HASH=$(git -C "$repo_dir" stash create "snapshot-$(date -u +%s)")
            if [ -n "$STASH_HASH" ]; then
              git -C "$repo_dir" stash store -m "snapshot" "$STASH_HASH" 2>/dev/null || true
            fi

            BUNDLE_ARGS="--branches --tags HEAD"
            if git -C "$repo_dir" rev-parse --verify refs/stash >/dev/null 2>&1; then
              BUNDLE_ARGS="$BUNDLE_ARGS refs/stash"
            fi
            if ! git -C "$repo_dir" bundle create "$snap_dir/git.bundle" $BUNDLE_ARGS; then
              echo "::warning::bundle create failed for $name"
              rm -rf "$snap_dir"
              continue
            fi

            if ! workferry pack --dir "$repo_dir" "$snap_dir/worktree.tar.gz"; then
              echo "::warning::workferry pack failed for $name"
            fi

            BRANCH=$(git -C "$repo_dir" symbolic-ref --short HEAD 2>/dev/null || true)
            COMMIT=$(git -C "$repo_dir" rev-parse HEAD 2>/dev/null || true)
            REMOTE=$(git -C "$repo_dir" remote get-url origin 2>/dev/null || true)
            SAVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            ENTRY=$(jq -n \
              --arg repo "$REMOTE" \
              --arg dir "$name" \
              --arg bundle "workspace-snapshots/$name/git.bundle" \
              --arg worktree "workspace-snapshots/$name/worktree.tar.gz" \
              --arg branch "$BRANCH" \
              --arg commit "$COMMIT" \
              --arg saved_at "$SAVED_AT" \
              '{repo: $repo, dir: $dir, bundle: $bundle, worktree: $worktree, branch: $branch, commit: $commit, saved_at: $saved_at}')

            tmp=$(mktemp)
            jq --arg dir "$name" '.snapshots |= map(select(.dir != $dir))' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
            tmp=$(mktemp)
            jq --argjson e "$ENTRY" '.snapshots += [$e]' "$INDEX" > "$tmp" && mv "$tmp" "$INDEX"
          done

      - name: Snapshot environment to sessions repository
        if: always() && steps.lock.outputs.acquired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set +e
          ENV_SRC="$SESSIONS_DIR/opencode"
          mkdir -p "$ENV_SRC"
          # Best-effort scrub of the bot token from plaintext files under $HOME.
          if [ -n "${TG_BOT_TOKEN:-}" ]; then
            grep -rlI -F "$TG_BOT_TOKEN" "$HOME" \
              --exclude-dir=.cache --exclude-dir=.npm --exclude-dir=.bun --exclude-dir=bin 2>/dev/null \
              | while IFS= read -r f; do sed -i "s/${TG_BOT_TOKEN}/REDACTED/g" "$f" 2>/dev/null; done
          fi
          # Overlay capture. The persisted environment is only what the agent manages;
          # the runner base image's $HOME is recreated fresh every run and must NOT be
          # baked into the snapshot (a blanket capture is ~580MB). So we take the
          # PREVIOUS snapshot and apply this run's changes to it:
          #   baseline -> previous snapshot, minus anything the agent deleted
          #   delta    -> files touched this run (add / modify) copied on top
          # Add / delete / modify all propagate, yet the archive stays small.
          MARK="$HOME/.opencode/.snapshot-mark"
          [ -f "$MARK" ] || touch "$MARK"
          EXCL='^\./(work|\.cache|\.npm|\.bun|\.nvm|\.rustup|\.cargo|\.go|\.sdkman|\.rvm|\.pyenv|\.ssh|\.config/gh|\.config/opencode|\.local/share/opencode|\.opencode/bin|\.opencode/tg\.env|\.opencode/v2lib|\.opencode/\.snapshot-mark|\.gitconfig|\.git-credentials|node_modules|\.venv|__pycache__|\.gradle|\.m2)(/|$)'
          ENV_TAG="env"
          STAGE=$(mktemp -d)
          # 1. Unpack the previous environment (from the release) as the baseline, unless
          #    it is implausibly large (an older blanket capture that baked in the base
          #    image); in that case start fresh so the bloat is not carried forward.
          if gh release download "$ENV_TAG" --repo "$SESSIONS_REPO" --pattern 'home.tar.gz*' --dir /tmp/envdl --clobber >/dev/null 2>&1; then
            BASELINE_SZ=$(cat /tmp/envdl/home.tar.gz* 2>/dev/null | wc -c)
            if [ "$BASELINE_SZ" -gt 419430400 ]; then
              echo "::warning::previous environment is ${BASELINE_SZ}B (base-image bloat); rebuilding from this run's deltas only"
            elif ls /tmp/envdl/home.tar.gz.* >/dev/null 2>&1; then
              cat /tmp/envdl/home.tar.gz.* | tar -xzf - -C "$STAGE" 2>/dev/null || true
            elif [ -f /tmp/envdl/home.tar.gz ]; then
              tar -xzf /tmp/envdl/home.tar.gz -C "$STAGE" 2>/dev/null || true
            fi
          fi
          # 2. Drop baseline entries the agent deleted since the previous snapshot.
          ( cd "$STAGE" && find . -xdev \( -type f -o -type l \) 2>/dev/null ) | while IFS= read -r p; do
            [ -e "$HOME/$p" ] || [ -L "$HOME/$p" ] || rm -f "$STAGE/$p"
          done
          # 3. Overlay the files this run added or modified.
          ( cd "$HOME" && find . -xdev -newer "$MARK" \( -type f -o -type l \) 2>/dev/null | grep -vE "$EXCL" ) \
            | while IFS= read -r p; do
                [ -n "$p" ] || continue
                mkdir -p "$STAGE/$(dirname "$p")"
                cp -a -- "$HOME/$p" "$STAGE/$p" 2>/dev/null || true
              done
          # 4. Store it on the fixed `env` RELEASE on the sessions repo. Release assets
          #    live outside git history (the repository commits stay clean and small)
          #    and are not capped at git's 100MiB per-file limit. Split at 90MiB anyway
          #    so a runaway environment still uploads, and replace stale assets so only
          #    the latest environment is kept.
          OUT=/tmp/envsnap
          rm -rf "$OUT" && mkdir -p "$OUT"
          if [ -n "$(ls -A "$STAGE" 2>/dev/null)" ]; then
            tar -czf - -C "$STAGE" . 2>/dev/null | split -b 90m - "$OUT/home.tar.gz." \
              || echo "::warning::environment snapshot failed"
          else
            echo "No environment files to snapshot this run."
          fi
          rm -rf "$STAGE"
          # Drop any legacy in-repo copies so they never re-enter git history.
          rm -f "$ENV_SRC"/home.tar.gz "$ENV_SRC"/home.tar.gz.[a-z][a-z]
          if [ -n "$(ls -A "$OUT" 2>/dev/null)" ]; then
            gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" >/dev/null 2>&1 \
              || gh release create "$ENV_TAG" --repo "$SESSIONS_REPO" --title "environment snapshot" \
                   --notes "Latest persisted agent environment; replaced every run." >/dev/null 2>&1
            gh release view "$ENV_TAG" --repo "$SESSIONS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -E '^home\.tar\.gz(\.|$)' \
              | while IFS= read -r a; do gh release delete-asset "$ENV_TAG" "$a" --repo "$SESSIONS_REPO" -y >/dev/null 2>&1; done
            if gh release upload "$ENV_TAG" "$OUT"/home.tar.gz.* --repo "$SESSIONS_REPO" --clobber >/dev/null 2>&1; then
              SZ=$(cat "$OUT"/home.tar.gz.* 2>/dev/null | wc -c)
              echo "environment snapshot uploaded: $(ls "$OUT"/home.tar.gz.* | wc -l) volume(s), $SZ bytes"
            else
              echo "::warning::failed to upload environment snapshot to release"
            fi
          fi
          rm -rf "$OUT"

      - name: Commit and push sessions repository
        if: always() && steps.lock.outputs.acquired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set +e
          cd "$SESSIONS_DIR"
          # Make the SQLite sessions DB self-contained so the commit captures ALL session
          # data even if the run was killed before the WAL was checkpointed (otherwise
          # recent turns live only in the -wal file and can look "lost").
          if command -v python3 >/dev/null 2>&1 && [ -f opencode/data/opencode.db ]; then
            python3 -c 'import sqlite3;c=sqlite3.connect("opencode/data/opencode.db");c.execute("PRAGMA wal_checkpoint(TRUNCATE)");c.close()' 2>/dev/null \
              && echo "sqlite WAL checkpointed" || echo "::warning::sqlite WAL checkpoint skipped"
          fi
          # The environment snapshot now lives in the `env` release as assets, not in
          # git. Purge any legacy in-repo copy so it drops out of history, and never
          # stage a file GitHub will refuse (100MiB hard cap).
          rm -rf opencode/home.tar.gz opencode/home.tar.gz.[a-z][a-z]
          if ! grep -qxF 'opencode/home.tar.gz.*' .gitignore 2>/dev/null; then
            printf '\n# Environment snapshot lives in the env release, not git.\nopencode/home.tar.gz*\n' >> .gitignore
          fi
          for f in $(git ls-files); do
            [ -f "$f" ] || continue
            SZ=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$SZ" -gt 104857600 ]; then
              echo "::warning::$f is ${SZ}B; exceeding GitHub's 100MiB cap, removing so the push succeeds"
              rm -f "$f"
            fi
          done
          git add -A
          # Sanitize: never commit the bot token, even if a session ever echoed it.
          if [ -n "${TG_BOT_TOKEN:-}" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              sed -i "s/${TG_BOT_TOKEN}/REDACTED/g" "$f" 2>/dev/null
              git add -- "$f"
            done < <(git grep --cached -Il -F "$TG_BOT_TOKEN" 2>/dev/null)
          fi
          # Collapse to a SINGLE commit holding the current environment, then force
          # push. Keeping exactly one (latest) commit is what stops the repository from
          # growing forever with one full environment snapshot per run; the previous
          # commit becomes unreachable and GitHub garbage-collects its objects.
          git checkout --orphan snapshot-reset >/dev/null 2>&1
          git add -A
          git -c user.name="opencode-ci" -c user.email="opencode-ci@users.noreply.github.com" \
            commit -q -m "environment $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || echo "::warning::nothing to commit"
          git branch -M snapshot-reset main
          # Runs are serialized by the workflow concurrency group, so there is never a
          # concurrent writer; force push therefore only ever discards stale history.
          for attempt in 1 2 3 4 5; do
            if git push --force origin main; then
              echo "snapshot pushed (single commit)"
              break
            fi
            echo "::warning::snapshot push attempt $attempt failed; retrying"
            sleep 4
          done

      - name: Relay next run
        if: always() && steps.lock.outputs.acquired == 'true' && steps.run_opencode.outcome == 'success'
        run: |
          set +e
          # No checkpoint gate: every run hands off to the next one unconditionally.
          # Continuity comes from the persisted opencode state (sessions DB under
          # $HOME/.local/share/opencode, bridge state, state/current.md).  Because
          # opencode resumes from where it was interrupted, a forced timeout at the
          # end of a run is seamless on the next run.
          echo "Relaying next run unconditionally."
          gh workflow run iterate.yml -f resume=true --repo "${{ github.repository }}"
