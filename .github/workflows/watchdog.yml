name: iterate-watchdog

# R2501 (2026-10-23): the 2026-10-21 18:20 → 2026-10-23 02:03 gap had one cause:
# every run relays its successor, so a run that is **cancelled while still queued**
# (concurrency keeps only one pending run; a newer trigger replaces it) never
# reaches the relay step. The 6h cron *should* eventually restart the loop, but it
# was itself cancelled/starved during the same window. This watchdog is deliberately
# outside the iterate concurrency group: every 10 minutes it looks at iterate's
# status and dispatches one run only when nothing is running or queued.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: iterate-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  GH_TOKEN: ${{ secrets.CROSS_PAT }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch iterate when the loop is gone
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          paused=$(gh variable get CI_LOOP_PAUSED --repo "$repo" 2>/dev/null || echo false)
          if [ "$paused" = "true" ]; then
            echo "CI_LOOP_PAUSED=true; watchdog will not restart the loop"
            exit 0
          fi
          # queued / in_progress / pending / waiting are all "a successor exists".
          live=$(gh run list --repo "$repo" --workflow iterate.yml --limit 20 \
                   --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "${live:-0}" -gt 0 ]; then
            echo "iterate alive: $live run(s) in flight; nothing to do"
            exit 0
          fi
          # R2512（运营者：取消 CI 时不应该自动启动新一轮 CI）：如果最近一次 run
          # 是被取消的，即使 failure_guard 没来得及置 pause（例如 job 被强杀），
          # watchdog 也把它当作运营者停止信号，不自动重启。手动 dispatch 仍是恢复入口。
          latest=$(gh run list --repo "$repo" --workflow iterate.yml --limit 1 \
                     --json conclusion --jq '.[0].conclusion // ""' 2>/dev/null || echo "")
          if [ "$latest" = "cancelled" ]; then
            gh variable set CI_LOOP_PAUSED --body true --repo "$repo" >/dev/null 2>&1 || true
            echo "::notice::latest iterate run was cancelled; treating it as an operator stop (no restart)"
            exit 0
          fi
          # A disabled workflow cannot be dispatched (R921: 422 disabled workflow).
          # `gh workflow view` has no --json in the runner's gh; list supports it.
          state=$(gh workflow list --repo "$repo" --json name,state --jq '.[] | select(.name == "iterate") | .state' 2>/dev/null | head -1)
          [ -n "$state" ] || state=unknown
          if [ "$state" != "active" ]; then
            # Disabling iterate.yml is an operator stop signal. Do not re-enable
            # it automatically: that used to make "stop CI" impossible.
            echo "::notice::iterate.yml is '$state'; treating it as an operator stop"
            exit 0
          fi
          echo "::notice::no iterate run in flight for >~10min; dispatching a successor"
          for attempt in 1 2 3; do
            if gh workflow run iterate.yml -f resume=true --repo "$repo"; then
              echo "watchdog dispatched iterate on attempt $attempt"
              exit 0
            fi
            echo "::warning::watchdog dispatch attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::watchdog could not dispatch iterate"
          exit 1
